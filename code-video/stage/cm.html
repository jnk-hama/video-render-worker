<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts2/fonts.css">
<style>
  /* 型：CM（#298）。商品を売る CM の秒割り（#296）＝悩み → 転換 → 利点 → 加速 → 締め。
     色で物語を言う：悩み＝冷たい紺、転換で差した所から暖色が画面いっぱいに広がり、以後は暖色。差し色は琥珀1色だけ */
  :root { --cold:#122036; --ice:#A9CBEA; --warm:#F5EBDF; --ink:#2A1E14; --mut:#6A5848; --amber:#C9671E; --sand:#E9D6C1;
          --nf-ink:#2A1E14; --nf-acc:#C9671E; --nf-acc-ink:#9A4D14; --nf-mut:#6A5848; --nf-bg:#F5EBDF; --nf-num:"Cormorant Garamond","Shippori Mincho"; --nf-num-w:500; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--cold); }
  body { position:relative; color:var(--ink); font-family:"Noto Sans JP",sans-serif; }
  .abs { position:absolute; }
  .min { font-family:"Shippori Mincho",serif; font-weight:700; }
  .gar { font-family:"Cormorant Garamond","Shippori Mincho",serif; font-weight:500; font-feature-settings:"lnum" 1; font-variant-numeric:lining-nums; }
  .note { position:absolute; font:500 26px/1.5 "Noto Sans JP"; color:var(--mut); }
  .kin { position:absolute; white-space:nowrap; }
  .kin > span { display:inline-block; }
  .h1 { font:900 92px/1.1 "Noto Sans JP"; letter-spacing:.02em; }
  .h2 { font-family:"Shippori Mincho",serif; font-weight:700; font-size:200px; line-height:1.05; color:var(--amber); letter-spacing:.01em; }
  #bgCold { position:absolute; inset:0; background:radial-gradient(ellipse 900px 700px at 70% 20%, rgba(80,120,170,.35) 0%, rgba(80,120,170,0) 70%), linear-gradient(180deg, #0E1A2D 0%, #1C3352 100%); }
  #bgWarm { position:absolute; inset:0; background:radial-gradient(ellipse 1000px 800px at 78% 14%, rgba(255,226,186,.9) 0%, rgba(255,226,186,0) 65%), linear-gradient(180deg, #F8F0E6 0%, #EFDFCC 100%); clip-path:circle(0px at 900px 1340px); }
  #light { position:absolute; left:-200px; top:-200px; width:1480px; height:1400px; background:radial-gradient(circle at 75% 25%, rgba(255,214,160,.45) 0%, rgba(255,214,160,0) 55%); opacity:0; mix-blend-mode:soft-light; pointer-events:none; }
  #world { position:absolute; left:0; top:0; width:600px; height:600px; transform-origin:0 0; display:none; }
  #world img, #world .m { position:absolute; display:block; }
  .shadow { position:absolute; border-radius:50%; background:radial-gradient(ellipse at 50% 50%, rgba(40,28,18,.42) 0%, rgba(40,28,18,.16) 45%, rgba(40,28,18,0) 72%); }
  .sweep { display:none; }
  #pr { left:64px; top:176px; font:700 26px/1 "Noto Sans JP"; color:#3E3A33; border:2px solid #3E3A33; background:rgba(255,253,248,.94); padding:5px 13px; border-radius:7px; letter-spacing:.06em; z-index:5; }
  #grain { position:absolute; inset:0; width:1080px; height:1920px; mix-blend-mode:multiply; opacity:.08; pointer-events:none; }
  .card { position:absolute; border-radius:26px; overflow:hidden; box-shadow:0 40px 80px rgba(60,35,15,.22), 0 8px 18px rgba(60,35,15,.12); background:#fff; }
  /* 版3（#300）：暗いスタジオに暖色の光。文字は生成り、得の1語は金（光沢が横切る） */
  body.lux #bgWarm { background:radial-gradient(ellipse 760px 900px at 50% 56%, var(--b0) 0%, var(--b1) 42%, var(--b2) 78%, var(--b3) 100%); }
  body.lux #light { background:radial-gradient(circle at 50% 22%, rgba(var(--g),.30) 0%, rgba(var(--g),0) 50%); mix-blend-mode:screen; }
  body.lux #grain { mix-blend-mode:overlay; opacity:.07; }
  body.lux .h1 { color:var(--tx); }
  body.lux .note { color:var(--mu); }
  .gold { color:var(--a3); background:linear-gradient(100deg, var(--a0) 0%, var(--a1) 28%, var(--a2) 44%, var(--a3) 58%, var(--a0) 100%); background-size:260% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .cta { position:absolute; display:flex; align-items:center; gap:16px; height:112px; padding:0 48px; border-radius:56px; background:var(--ink); color:#fff; font:900 42px/1 "Noto Sans JP"; letter-spacing:.05em; white-space:nowrap; }
</style>
</head>
<body>
  <div id="bgCold" class="scrim"></div><div id="bgWarm" class="scrim"></div><div id="light" class="scrim"></div>
  <div id="under" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
  <div id="world"></div>
  <div id="prodlayer" class="abs prod" style="left:0;top:0;width:1080px;height:1920px;pointer-events:none"></div>
  <div id="ui" class="abs" style="left:0;top:0;width:1080px;height:1920px"><div id="pr" class="abs">PR</div></div>
  <canvas id="grain" width="540" height="960"></canvas>
<script src="core.js"></script>
<script src="numfx.js"></script>
<script src="target.js"></script>
<script>
// ---- 共通の小物 ----
const FUT = { x: 90, y: 1080, w: 900, h: 520 };          // 布団（悩み→転換で同じ位置＝場面がつながる）
const STK = { L: 540, stand: [905, 1150] };                // 本体（立っている所の中心）
let IN = { x: FUT.x + FUT.w - 250, y: FUT.y + FUT.h / 2 };   // 差し込む所＝暖色が広がり始める所（unveil は商品の真ん中に置き直す）
let FLOOD = [999, 999.1];                                  // 暖色が画面に広がる時刻（転換の場面が決める）
const mix = (c0, c1, k) => { const a = c0.match(/\w\w/g).map((h) => parseInt(h, 16)), b = c1.match(/\w\w/g).map((h) => parseInt(h, 16)); return "#" + a.map((v, j) => Math.round(lerp(v, b[j], k)).toString(16).padStart(2, "0")).join(""); };
// 見出し：1行目は太いゴシック、2行目（得の1語）だけ明朝の大きな琥珀（#296：強調の1語だけ書体を変える）
function head2(h, top, white) {
  const a = kinWrap(el("div", { class: "kin h1", style: `left:66px;top:${top}px;color:${white ? "#EEF4FA" : "var(--ink)"}` }, h[0]));
  const fs = Math.min(200, Math.floor(950 / Math.max(1, [...(h[1] || "")].length)));
  const b = kinWrap(el("div", { class: "kin h2", style: `left:56px;top:${top + 104}px;font-size:${fs}px;${white ? "color:var(--ice)" : ""}` }, h[1] || ""));
  return [a, b];
}
function futonSVG(id) {
  const st = [1, 2, 3, 4].map((k) => { const y = FUT.y + k * FUT.h / 5; return `<path d="M${FUT.x + 20},${y} ${Array.from({ length: 9 }, (_, j) => `Q${FUT.x + 50 + j * 100},${y + (j % 2 ? 16 : -16)} ${FUT.x + 100 + j * 100},${y}`).join(" ")}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="4"/>`; }).join("");
  return `<defs><clipPath id="fc${id}"><rect x="${FUT.x}" y="${FUT.y}" width="${FUT.w}" height="${FUT.h}" rx="90"/></clipPath>
    <linearGradient id="ci${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5D7FA3"/><stop offset="1" stop-color="#8FAECB"/></linearGradient>
    <radialGradient id="wr${id}"><stop offset="0" stop-color="#F09A5C"/><stop offset=".6" stop-color="#F3BE93"/><stop offset="1" stop-color="#F6D6B8"/></radialGradient></defs>
    <rect x="${FUT.x}" y="${FUT.y + 28}" width="${FUT.w}" height="${FUT.h}" rx="90" fill="rgba(0,0,0,.22)"/>
    <g clip-path="url(#fc${id})"><rect x="${FUT.x}" y="${FUT.y}" width="${FUT.w}" height="${FUT.h}" fill="url(#ci${id})"/>
      <circle class="wm" cx="${IN.x}" cy="${IN.y}" r="0" fill="url(#wr${id})"/>${st}<g class="fls"></g></g>`;
}
// 本体（販売ページの写真の切り抜き）を中心・角度で置く
function stickEl(parent) { const w = STK.L * HERO.w / HERO.h; return el("div", { class: "abs", style: `left:0;top:0;width:${w}px;height:${STK.L}px;transform-origin:50% 50%` }, `<img src="${DIR}${P.hero.cutout}" style="width:100%;height:100%;filter:drop-shadow(0 22px 26px rgba(0,0,0,.35))">`, parent); }
const placeStick = (e, cx, cy, ang) => { const w = STK.L * HERO.w / HERO.h; e.style.transform = `translate(${cx - w / 2}px, ${cy - STK.L / 2}px) rotate(${ang}deg)`; };
// 止まらない出入り（#294）：場面の部品を入れ物にまとめ、減速して入り→ゆっくり流れ→加速して抜ける。悩み→転換はつながっているので使わない
function moving(f) { return (b, i, s) => {
  const L = ["ui", "prodlayer", "under"].map((id) => { const real = $(id), box = el("div", { class: "abs", style: "left:0;top:0;width:1080px;height:1920px" }, "", real); real.id = id + "_real"; box.id = id; return [real, box, id]; });
  try { f(b, i, s); } finally { L.forEach(([real, box, id]) => { box.id = ""; real.id = id; }); }
  const last = i === B.length - 1, end = OUT(i);
  U.push((t) => { const xin = 90 * Math.exp(-6 * Math.max(0, t - (s.t0 - 0.3))), drift = -10 * (t - (s.t0 + Math.min(end, s.t1)) / 2), q = last ? 0 : clamp((t - (end - 0.3)) / 0.34);
    const x = xin + drift - 200 * q * q; L.forEach(([, box]) => { box.style.transform = `translateX(${x.toFixed(2)}px)`; }); }); }; }
const hideCam = (s) => K.push({ t: s.t0, show: 0, F: F0.body, A: [540, 2600], z: 1, r: 0 }, { t: s.t1 - 0.01, show: 0, F: F0.body, A: [540, 2600], z: 1, r: 0 });

// ===== 版2（#299）：理解した技法を使う =====
// 見出しは線から立ち上がる（マスクの中で下から上がり、出る時は上へ抜ける）
function maskLine(cls, style, text, tin, tout, ist = "") {
  const box = el("div", { class: "abs", style: `${style};overflow:hidden;padding:0 .1em .12em 0;white-space:nowrap` }, `<div class="${cls}" style="display:inline-block;position:relative;${ist}">${text}</div>`);
  const inner = box.firstChild;
  const blur = P.style && P.style.head === "blur";   // #301：見出しの出方の別案＝ぼけから大きく寄って止まる
  U.push((t) => { const a = outC((t - tin) / (blur ? 0.4 : 0.55)), o = inOutC((t - tout) / 0.35);
    if (blur) { inner.style.opacity = String(clamp(a * 1.4)); inner.style.filter = a < 1 ? `blur(${((1 - a) * 14).toFixed(1)}px)` : "none"; inner.style.transform = `translateY(${-o * 115}%) scale(${lerp(1.3, 1, a).toFixed(3)})`; inner.style.transformOrigin = "0 60%"; }
    else inner.style.transform = `translateY(${(1 - a) * 115 - o * 115}%)`;
    box.style.visibility = a <= 0 || o >= 1 ? "hidden" : "visible"; });
  return box;
}
function maskHead(h, top, tin, tout) {
  const fs = Math.min(200, Math.floor(950 / Math.max(1, [...(h[1] || "")].length)));
  return [maskLine("h1", `left:66px;top:${top}px`, h[0], tin, tout), maskLine(LUX ? "h2 gold" : "h2", `left:56px;top:${top + 100}px`, h[1] || "", tin + 0.12, tout, `font-size:${fs}px;line-height:1.05`)];
}
// 3D のカードの輪（Reelfolio の Carousel 3D・#297）：利点の写真を空間に並べ、場面が変わるたびに輪が回る。正面だけピントが合い、他はぼけて奥へ
const RING = { cx: 540, cy: 1040, R: 560, W: 600, H: 800, step: 90, cards: [], beats: [], built: false };
function buildRing() {
  if (RING.built) return; RING.built = true;
  if (LUX) Object.assign(RING, { cy: 1080, R: 800, W: 660, H: 880, step: 60 });   // 版3：大きく・6枚
  RING.beats = B.map((s, i) => ({ s, b: P.beats[i], i })).filter((x) => /^orbit/.test(x.b.kind));
  const st = el("div", { class: "abs", style: `left:${RING.cx}px;top:${RING.cy}px;width:0;height:0;perspective:2300px;perspective-origin:0 0` }, "", $("prodlayer"));
  const ring = el("div", { class: "abs", style: "left:0;top:0;width:0;height:0;transform-style:preserve-3d" }, "", st);
  RING.stage = st; RING.ring = ring;
  const extra = LUX && DECK === "ring" ? (P.ring_extra || []).map((card) => ({ b: { card } })) : [];   // 版3：輪を6枚に（隣のカードが画面の端に覗く＝奥行き）
  RING.cards = RING.beats.concat(extra).map(({ b }, k) => {
    const sh = LUX ? "box-shadow:0 20px 40px rgba(0,0,0,.5);border:2px solid rgba(var(--g2),.32)" : "box-shadow:0 50px 90px rgba(60,35,15,.28), 0 10px 22px rgba(60,35,15,.14)";
    const c = b.card, card = el("div", { class: "abs", style: `left:${-RING.W / 2}px;top:${-RING.H / 2}px;width:${RING.W}px;height:${RING.H}px;border-radius:30px;overflow:hidden;backface-visibility:hidden;background:${c.bg || "#fff"};${sh};transform:rotateY(${k * RING.step}deg) translateZ(${RING.R}px)` }, "", ring);
    if (c.image) el("img", { src: `${DIR}${c.image}`, style: `position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:${c.pos || "50% 50%"}` }, "", card);
    if (c.hero) el("img", { src: `${DIR}${P.hero.cutout}`, style: `position:absolute;left:50%;top:70px;height:${RING.H - 140}px;transform:translateX(-50%) rotate(-8deg);filter:drop-shadow(0 30px 30px rgba(0,0,0,.45))` }, "", card);
    if (c.cut) { const iw = RING.W - 40, ih = iw * c.size[1] / c.size[0], top = (RING.H - ih) / 2 + 30, kk = iw / c.size[0];
      el("img", { src: `${DIR}${c.cut}`, style: `position:absolute;left:20px;top:${top}px;width:${iw}px;filter:drop-shadow(0 24px 26px rgba(60,35,15,.22))` }, "", card);
      const fl = (c.flow || []).map((d) => `<path class="fl" d="${d}" fill="none" stroke="#E8823A" stroke-width="${7 / kk}" stroke-linecap="round" stroke-dasharray="${26 / kk} ${22 / kk}"/>`).join("");
      const dp = (c.vents || []).flatMap(([x, y]) => Array.from({ length: 7 }, (_, j) => `<circle class="dp" cx="${x + ((j * 29) % 60) - 30}" cy="${y}" r="${(11 + (j % 3) * 4) / kk}" fill="#A9D3EA" stroke="#fff" stroke-width="${2.5 / kk}" opacity="0"/>`)).join("");
      el("div", { class: "abs", style: `left:20px;top:${top}px;width:${iw}px;height:${ih}px` }, `<svg width="${iw}" height="${ih}" viewBox="0 0 ${c.size[0]} ${c.size[1]}">${fl}${dp}</svg>`, card); }
    if (c.pair) c.pair.forEach((im, j) => el("img", { src: `${DIR}${im}`, style: `position:absolute;left:${RING.W / 2 + (j ? 30 : -110)}px;top:90px;height:${RING.H - 150}px;filter:drop-shadow(0 24px 26px rgba(60,35,15,.25));transform:rotate(${j ? 4 : -4}deg)` }, "", card));
    if (LUX) el("div", { class: "shn", style: "position:absolute;inset:0;background:linear-gradient(115deg, rgba(255,255,255,0) 38%, rgba(var(--g2),.26) 50%, rgba(255,255,255,0) 62%);background-size:300% 100%;mix-blend-mode:screen" }, "", card);   // 光沢：カードの向きで光が滑る
    return card; });
}
// 輪の向き（場面ごとに1枚分回る・少し行き過ぎて戻る）と、回っている間の「引き」の強さ
// #301：利点のカードの並べ方の別案。stack＝新しいカードが手前に積もり、前のカードは奥へ下がる（Reelfolio の Stack）／
// arc＝右下から弧を描いて入り、真ん中で止まって、左上へ飛んで抜ける（Carousel）。ring は上の3Dの輪
const DECK = (P.style && P.style.deck) || "ring";
function deckAt(t, cur, bump, e, x, xf) {
  const z0 = -260 - 2600 * (1 - e) - 2800 * x + 2400 * xf * xf;
  RING.ring.style.transform = `translateZ(${z0.toFixed(1)}px) rotateX(${(-4 + Math.sin(t * 0.45) * 1.5).toFixed(2)}deg) rotateY(${(Math.sin(t * 0.6) * 4 + 30 * (1 - e)).toFixed(2)}deg)`;
  RING.stage.style.opacity = String(clamp((t - (RING.beats[0].s.t0 - 0.05)) / 0.15) * (1 - x) * (1 - clamp((xf - 0.55) / 0.35)));
  if (STREAK) STREAK(t, Math.max(bump * clamp((t - RING.beats[0].s.t0) / 0.3), Math.sin(Math.PI * xf)));
  RING.cards.forEach((c, k) => { const p = cur - k; let tr, d, op = 1;
    if (DECK === "stack") { if (p < -0.999) op = 0; const a = clamp(p + 1), r = Math.max(0, p), sd = k % 2 ? 1 : -1;   // a：手前に落ちてくる途中・r：何枚分奥へ下がったか
      tr = `translate3d(${(-sd * (1 - a) * 1150).toFixed(1)}px, ${(20 * (1 - a) - 80 * r).toFixed(1)}px, ${(-260 * r).toFixed(1)}px) rotateY(${(sd * 28 * (1 - a)).toFixed(2)}deg) rotateZ(${(sd * (-16 * (1 - a) + 3 * Math.min(r, 1))).toFixed(2)}deg)`; d = Math.min(2, r);   // 横から配られて積もる（見出し・注記の帯を通らない）
      if (p < 0) op = clamp((p + 1) / 0.2); }
    else { const q = clamp(p, -1.3, 1.3); op = 1 - clamp((Math.abs(p) - 0.95) / 0.3);   // arc
      tr = `translate3d(${(-760 * Math.sin(q * 1.15)).toFixed(1)}px, ${(-340 * q + 260 * q * q).toFixed(1)}px, ${(-520 * Math.abs(q)).toFixed(1)}px) rotateY(${(-38 * q).toFixed(2)}deg) rotateZ(${(-12 * q).toFixed(2)}deg)`; d = Math.abs(q); }
    c.style.transform = tr; c.style.opacity = String(op);
    c.style.filter = `blur(${Math.min(10, d * 6).toFixed(2)}px) brightness(${(1 - 0.35 * Math.min(1, d)).toFixed(3)})`;
    const shn = c.querySelector(".shn"); if (shn) shn.style.backgroundPosition = `${(50 + p * 60).toFixed(1)}% 0`; });
  const c0 = RING.cards[0], rv = outC((t - (RING.beats[0].s.t0 - 0.15)) / 0.7); c0.style.clipPath = rv >= 1 ? "none" : `circle(${(rv * 75).toFixed(1)}% at 50% 50%)`;
}
function ringPose(t) { let ang = 0, bump = 0;
  RING.beats.forEach(({ s }, j) => { if (j) { ang -= RING.step * sp(t - (s.t0 - 0.42), 8, 0.72); bump = Math.max(bump, Math.sin(Math.PI * clamp((t - (s.t0 - 0.5)) / 0.8))); } });
  return [ang, bump]; }
function ringAt(t) {
  const first = RING.beats[0].s, fin = B.find((s, i) => P.beats[i].kind === "finale3d"), cas = B.find((s, i) => P.beats[i].kind === "cascade");
  const [ang, bump] = ringPose(t), [ang0] = ringPose(t - 1 / 60), vel = Math.abs(ang - ang0) * 60;   // 回る速さ（度/秒）＝ぶれの強さ
  const e = outC((t - (first.t0 - 0.05)) / (LUX ? 1.0 : 0.8)), x = fin ? inOutC((t - (fin.t0 - 0.3)) / 0.7) : 0;
  const xf = cas ? inOutC((t - (cas.t0 - 0.35)) / 0.55) : 0;   // 版3：連打の前に輪がカメラを突き抜ける
  const z = -RING.R - 2600 * (1 - e) - 2800 * x - (LUX ? 900 * bump : 0) + 2400 * xf * xf, ry = ang + (LUX ? 160 : 55) * (1 - e) + Math.sin(t * 0.6) * 3, rx = -5 + Math.sin(t * 0.45) * 1.6 + (LUX ? 6 * bump : 0);   // 奥から回りながら飛んできて、回る間は引いて輪の全体を見せ、最後は奥へ遠ざかる
  if (DECK !== "ring") { deckAt(t, -ang / RING.step, bump, e, x, xf); return; }
  RING.ring.style.transform = `translateZ(${z.toFixed(1)}px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
  RING.stage.style.opacity = String(clamp((t - (first.t0 - 0.05)) / 0.15) * (1 - x) * (1 - clamp((xf - 0.55) / 0.35)));
  if (STREAK) STREAK(t, Math.max(bump * clamp((t - first.t0) / 0.3), Math.sin(Math.PI * xf)));
  const mb = LUX ? Math.min(7, vel / 70) : 0;
  RING.cards.forEach((c, k) => { const a = ((ry + k * RING.step) % 360 + 540) % 360 - 180, d = Math.abs(a) / RING.step;   // 正面からの角度（枚数）
    c.style.filter = `blur(${Math.min(LUX ? 10 : 9, d * (LUX ? 7 : 8) + mb).toFixed(2)}px) brightness(${(1 - (LUX ? 0.35 : 0.22) * Math.min(1, d)).toFixed(3)})`;
    const shn = c.querySelector(".shn"); if (shn) shn.style.backgroundPosition = `${(50 - a * 1.6).toFixed(1)}% 0`; });
  const c0 = RING.cards[0], rv = outC((t - (first.t0 - 0.15)) / 0.7);   // 1枚目は丸い窓から開く（Reveal）
  c0.style.clipPath = rv >= 1 ? "none" : `circle(${(rv * 75).toFixed(1)}% at 50% 50%)`;

  // 利点3：靴乾燥スタンドで使っている所の実写（#288）＋温風の流れと水の粒（図）

  // 加速：小さな利点を1語ずつ連打（Fitters Bible・#296）。下に2色の本体が立ち続ける（全場面に商品）
  rapid: moving((b, i, s) => {

    hideCam(s);

      pair.forEach((p, k) => { const a = sp(t - (t0 - 0.2 + k * 0.08), 10, 0.8); p.style.opacity = clamp(a * 1.4) * (1 - o);
        const hi = b.words.findIndex((w) => w.pair), on = hi >= 0 && t >= t0 + hi * slot && t < t0 + (hi + 1) * slot;   // 「2色から」の間だけ少し前へ
        p.style.transform = `translateY(${(1 - clamp(a)) * 80 + Math.sin(t * 1.4 + k) * 4}px) rotate(${k ? 5 : -5}deg) scale(${on ? 1.08 : 1})`; });

  // 締め：大きな名前の文字の手前に2色の本体（文字が奥＝奥行き・Reelfolio #297）。一言・レビューの数・リンクを静かに

    const tag = kinWrap(el("div", { class: "kin min", style: "left:0;top:300px;width:1080px;text-align:center;font-size:96px" }, b.tag || ""));
    const pair = (b.pair || []).map((im, k) => el("img", { src: `${DIR}${im}`, class: "abs", style: `left:${k ? 560 : 420}px;top:480px;height:720px;opacity:0;filter:drop-shadow(0 30px 34px rgba(60,35,15,.28))` }, "", $("prodlayer")));

    const nt = el("div", { class: "note", style: "left:70px;top:1680px;width:940px;text-align:center;opacity:0" }, b.note || "");
    hideCam(s);
    U.push((t) => { const u = t - t0;
      big.style.opacity = clamp(u / 0.6) * 0.9; big.style.transform = `translateX(${-10 * u}px)`;
      kin(tag, t0 + 0.05, 999, 0.05);
      pair.forEach((p, k) => { const a = sp(u - 0.1 - k * 0.12, 9, 0.8); p.style.opacity = clamp(a * 1.4); p.style.transform = `translateY(${(1 - clamp(a)) * 120 + Math.sin(t * 1.2 + k * 2) * 5}px) rotate(${k ? 6 : -6}deg)`; });
      fadeUp(rv, t0 + 0.5, 999, 30); setText(rv.querySelector(".gar"), String(Math.round(b.reviews * outC((u - 0.5) / 0.9))));
      fadeUp(dt, t0 + 1.2, 999); fadeUp(nm, t0 + 0.8, 999); fadeUp(ct, t0 + 1.0, 999, 30); ct.style.transform += " translateX(-50%)"; fadeUp(nt, t0 + 1.3, 999); });
  },
};
CORE.start({ grain: [215, 40], wipe: false, refl: false, motionBlur: false,

      const g = `${(100 - ((t * 0.45) % 1) * 200).toFixed(1)}% 0`; document.querySelectorAll(".gold").forEach((e) => { e.style.backgroundPosition = g; }); } } }, KINDS);   // 金の文字の上を光がゆっくり横切る
