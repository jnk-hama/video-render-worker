<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts2/fonts.css">
<style>
  /* 型：ルックブック（アパレル）。コンクリートのスタジオ・大きな英字のイタリック・細い罫線とページ番号。服は平置きの実画像だけ（人の顔は使わない #158） */
  :root { --c1:#DEDAD4; --c2:#C8C3BC; --ink:#1C1B19; --mut:#5E5A54; --acc:#8C6F5A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--c1); }
  body { position:relative; color:var(--ink); font-family:"Noto Sans JP",sans-serif; }
  .abs { position:absolute; }
  .en { font-family:"Cormorant Garamond","Shippori Mincho",serif; font-style:italic; font-weight:500; font-feature-settings:"lnum" 1; letter-spacing:-.01em; }
  .ennum { font-family:"Cormorant Garamond","Shippori Mincho",serif; font-weight:500; font-feature-settings:"lnum" 1; font-variant-numeric:lining-nums; }
  .jp { font-family:"Noto Sans JP",sans-serif; font-weight:900; letter-spacing:.01em; }
  .cap { font:700 24px/1 "Noto Sans JP"; letter-spacing:.32em; color:var(--mut); }
  .note { position:absolute; font:500 25px/1.5 "Noto Sans JP"; color:var(--mut); opacity:0; }
  .ln { position:absolute; overflow:hidden; white-space:nowrap; padding:.10em .22em .26em .06em; margin:-.10em -.22em -.26em -.06em; visibility:hidden; box-sizing:content-box; }
  .ln > .in { display:block; will-change:transform; }
  #bg { position:absolute; inset:0; background:
          radial-gradient(ellipse 1300px 1500px at 22% 12%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 60%),
          linear-gradient(176deg, var(--c1) 0%, var(--c2) 100%); }
  #floor { position:absolute; left:0; width:1080px; height:900px; background:linear-gradient(180deg, rgba(70,60,50,0) 0%, rgba(70,60,50,.07) 40%, rgba(70,60,50,.12) 100%); }
  #grain { position:absolute; inset:0; width:1080px; height:1920px; mix-blend-mode:multiply; opacity:.22; pointer-events:none; }
  #world { position:absolute; left:0; top:0; width:600px; height:600px; transform-origin:0 0; }
  #world .m, #world img { position:absolute; display:block; }
  .shadow { position:absolute; border-radius:50%; background:radial-gradient(ellipse at 50% 50%, rgba(40,32,24,.42) 0%, rgba(40,32,24,.16) 45%, rgba(40,32,24,0) 72%); }
  .sweep { position:absolute; inset:0; mix-blend-mode:soft-light; opacity:0; background:linear-gradient(105deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.9) 50%, rgba(255,255,255,0) 58%); background-size:340% 100%; background-position:100% 0; background-repeat:no-repeat; }
  #pr { left:64px; top:176px; font:700 26px/1 "Noto Sans JP"; color:var(--mut); border:2px solid var(--mut); padding:5px 13px; border-radius:7px; letter-spacing:.06em; z-index:5; }
  .rule { position:absolute; height:2px; background:var(--ink); transform-origin:0 50%; transform:scaleX(0); }
  .pg { position:absolute; right:64px; top:180px; font:700 24px/1 "Noto Sans JP"; letter-spacing:.2em; color:var(--mut); opacity:0; }
  .pill { position:absolute; height:96px; min-width:150px; padding:0 30px; border-radius:48px; border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; font:500 52px/1 "Cormorant Garamond"; font-feature-settings:"lnum" 1; opacity:0; }
  .cta { position:absolute; display:flex; align-items:center; gap:16px; height:116px; padding:0 46px; border-radius:58px; background:var(--ink); color:#F2EFEA; font:900 40px/1 "Noto Sans JP"; letter-spacing:.05em; white-space:nowrap; overflow:hidden; opacity:0; }
  .cta .sw { position:absolute; inset:0; mix-blend-mode:plus-lighter; background:linear-gradient(103deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.35) 50%, rgba(255,255,255,0) 65%); background-size:300% 100%; background-position:100% 0; opacity:0; }
</style>
</head>
<body>
  <div id="bg"></div><div id="floor"></div>
  <div id="behind" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
  <div id="world"></div>
  <div id="prodlayer" class="abs prod" style="left:0;top:0;width:1080px;height:1920px;pointer-events:none"></div>
  <div id="ui" class="abs" style="left:0;top:0;width:1080px;height:1920px"><div id="pr" class="abs">PR</div></div>
  <canvas id="grain" width="540" height="960"></canvas>
<script src="core.js"></script>
<script>
function lineIn(e, tin, tout, w = 13) { const a = sp(T - tin, w, 1), o = outC((T - tout) / 0.30);
  e.firstElementChild.style.transform = `translateY(${(1 - a) * 140 - o * 140}%)`; e.style.visibility = (a <= 0.001 || o >= 0.999) ? "hidden" : "visible"; }
const ln = (cls, style, html, parent) => el("div", { class: `ln ${cls}`, style }, `<span class="in">${html}</span>`, parent);
const fadeIO = (e, tin, tout, d = 0.3) => { e.style.opacity = outC((T - tin) / d) * (1 - outC((T - tout) / 0.28)); };
const ruleAt = (e, tin, tout) => { e.style.transform = `scaleX(${inOutC((T - tin) / 0.5) * (1 - inOutC((T - tout) / 0.3))})`; };
const page = (i, n, label) => el("div", { class: "pg" }, `${String(i + 1).padStart(2, "0")} / ${String(n).padStart(2, "0")}　${label}`);
const NB = P.beats.length;
const SH = [];   // カットごとの構え（ゆっくり寄る＝静かな雑誌のページ）
function hold(i, s, F, A, w0, w1, show = 1) { K.push({ t: s.t0 + (i ? 0.28 : 0), F, A, z: fitZ(w0), r: 0, show, ease: "lin" }, { t: s.t1 - 0.28, F, A, z: fitZ(w1), r: 0, show, ease: "in" }); }
const FLOAT = (t) => Math.sin(t * 1.1) * 4;   // 服がわずかに浮いて揺れる（平置きの写真を「置いてある物」に見せる）

const KINDS = {
  // 表紙：大きな英字の後ろに服。1コマ目に見出しと服と PR（#267-7）
  cover(b, i, s) {
    const t0 = s.t0, out = OUT(i) - 0.08, words = b.en.split(" "), last = words.pop();
    const e1 = ln("en", "left:52px;top:236px;font-size:150px;line-height:1", words.join(" "), $("behind"));
    const e2 = ln("en", "left:150px;top:396px;font-size:190px;line-height:1", last, $("behind"));
    const r = el("div", { class: "rule", style: "left:64px;top:1532px;width:280px;height:4px" });   // 服の影と重ならない短い罫
    const h1 = ln("jp", "left:60px;top:1562px;font-size:84px;line-height:1.15", b.head[0]);
    const h2 = ln("jp", "left:60px;top:1670px;font-size:84px;line-height:1.15", b.head[1]);
    const pg = page(i, NB, "LOOK");
    hold(i, s, F0.body, [560, 1090], 720, 760);
    U.push((t) => { lineIn(e1, t0 - 0.7, out, 12); lineIn(e2, t0 - 0.6, out, 12); lineIn(h1, t0 - 0.6, out); lineIn(h2, t0 - 0.55, out); ruleAt(r, t0 - 0.6, out); fadeIO(pg, t0 - 0.5, out);
      $("behind").style.transform = `translateX(${-(t - t0) * 6}px)`; });
  },
  // 重さ：数え上げ＋半円のゲージ。服は右へ
  gauge(b, i, s) {
    const t0 = s.t0, out = OUT(i) - 0.08, c0 = t0 + 0.4, c1 = t0 + 1.5;
    const cap = el("div", { class: "abs cap", style: "left:64px;top:260px;opacity:0" }, b.label);
    const num = ln("ennum", "left:52px;top:300px;font-size:300px;line-height:1", `<span class="d">0.0</span><span style="font-size:110px;font-style:italic;margin-left:14px">${b.unit}</span>`);
    const sub = el("div", { class: "abs", style: "left:64px;top:640px;opacity:0" }, `<span style="display:inline-block;font:900 40px/1 'Noto Sans JP';padding:14px 24px;border-radius:12px;background:var(--ink);color:#F2EFEA">${b.sub}</span><span style="font:700 28px/1 'Noto Sans JP';vertical-align:top;margin-left:8px">${b.mark || ""}</span>`);
    const g = el("div", { class: "abs", style: "left:0;top:0;opacity:0" }, `<svg width="1080" height="1920"><path d="M90,1040 A220,220 0 0 1 530,1040" fill="none" stroke="rgba(28,27,25,.14)" stroke-width="26" stroke-linecap="round"/><path class="p" d="M90,1040 A220,220 0 0 1 530,1040" fill="none" stroke="#1C1B19" stroke-width="26" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`);
    const gp = g.querySelector(".p"), nt = el("div", { class: "note", style: "left:64px;top:1560px;width:952px" }, b.note || ""), pg = page(i, NB, "WEIGHT");
    hold(i, s, F0.body, [830, 1150], 560, 590);
    const d = num.querySelector(".d");
    U.push((t) => { fadeIO(cap, t0 + 0.1, out); lineIn(num, c0 - 0.1, out, 12); setText(d, (b.value * outC((t - c0) / (c1 - c0))).toFixed(1));
      fadeIO(sub, t0 + 0.9, out); fadeIO(nt, c1, out); fadeIO(pg, t0 + 0.1, out);
      gp.setAttribute("stroke-dashoffset", String(1 - inOutC((t - c0) / (c1 - c0)) * Math.min(1, b.value / 14))); fadeIO(g, c0 - 0.25, out); });
  },
  // 色：平置きの実画像を1枚ずつ、名前つきで並べる（服は商品の側＝重なりの点検で商品として扱う）
  swatch(b, i, s) {
    const t0 = s.t0, out = OUT(i) - 0.08, n = b.items.length, cols = 3, cw = 316;
    const cap = el("div", { class: "abs cap", style: "left:64px;top:260px;opacity:0" }, b.label);
    const h = ln("jp", "left:60px;top:300px;font-size:96px;line-height:1.15", b.head), pg = page(i, NB, "COLOR");
    const cells = b.items.map(([img, name], k) => { const x = 66 + (k % cols) * cw, y = 540 + Math.floor(k / cols) * 480;
      const im = el("img", { src: `${DIR}${img}`, class: "abs", style: `left:${x}px;top:${y}px;width:${cw - 30}px;opacity:0` }, "", $("prodlayer"));
      const nm = el("div", { class: "abs en", style: `left:${x}px;top:${y + 372}px;width:${cw - 30}px;text-align:center;font-size:44px;opacity:0` }, name);
      return { im, nm, tin: t0 + 0.45 + k * 0.16 }; });
    const nt = el("div", { class: "note", style: "left:64px;top:1560px;width:952px" }, b.note || "");
    K.push({ t: s.t0 + 0.28, F: F0.body, A: [540, 2600], z: fitZ(600), r: 0, show: 0, ease: "lin" }, { t: s.t1 - 0.28, F: F0.body, A: [540, 2600], z: fitZ(600), r: 0, show: 0, ease: "in" });
    U.push((t) => { fadeIO(cap, t0 + 0.1, out); lineIn(h, t0 + 0.2, out); fadeIO(pg, t0 + 0.1, out); fadeIO(nt, t0 + 1.4, out);
      cells.forEach((c, k) => { const a = sp(t - c.tin, 11, 0.8), o = outC((t - out) / 0.3); c.im.style.opacity = clamp(a * 1.3) * (1 - o);
        c.im.style.transform = `translateY(${(1 - clamp(a)) * 50 + FLOAT(t + k) - o * 20}px) scale(${lerp(0.92, 1, clamp(a))})`; c.nm.style.opacity = clamp(sp(t - c.tin - 0.15, 12, 1) * 1.3) * (1 - o); }); });
  },
  // サイズ：丸い札が1つずつ。服は右下
  sizes(b, i, s) {
    const t0 = s.t0, out = OUT(i) - 0.08;
    const cap = el("div", { class: "abs cap", style: "left:64px;top:260px;opacity:0" }, b.label);
    const h = ln("jp", "left:60px;top:300px;font-size:150px;line-height:1.1", b.head), pg = page(i, NB, "SIZE");
    const pills = b.sizes.map((z, k) => el("div", { class: "pill", style: `left:${64 + (k % 4) * 240}px;top:${560 + Math.floor(k / 4) * 130}px` }, z));
    const sub = el("div", { class: "abs", style: "left:64px;top:860px;font:900 46px/1 'Noto Sans JP';opacity:0" }, b.sub || "");
    hold(i, s, F0.body, [700, 1400], 620, 650);
    U.push((t) => { fadeIO(cap, t0 + 0.1, out); lineIn(h, t0 + 0.2, out, 12); fadeIO(pg, t0 + 0.1, out); fadeIO(sub, t0 + 1.6, out);
      pills.forEach((p, k) => { const a = sp(t - (t0 + 0.55 + k * 0.11), 14, 0.7), o = outC((t - out) / 0.3); p.style.opacity = clamp(a * 1.4) * (1 - o); p.style.transform = `scale(${lerp(0.6, 1, clamp(a, 0, 1.2))})`;
        p.style.background = k === b.sizes.length - 1 && a > 0.5 ? "var(--ink)" : "transparent"; p.style.color = k === b.sizes.length - 1 && a > 0.5 ? "#F2EFEA" : "var(--ink)"; }); });
  },
  // 締め：3色を並べて、評価・レビュー・集計日・リンク
  finale(b, i, s) {
    const t0 = s.t0, s0 = t0 + 0.25, r0 = t0 + 0.6, r1 = t0 + 1.6, cta = t0 + 1.9;
    const st = el("div", { class: "abs", style: "left:60px;top:250px;opacity:0;display:flex;align-items:flex-end;gap:14px" }, `<svg width="84" height="84" viewBox="0 0 24 24" style="margin-bottom:34px"><path d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9 6.2 20.1l1.4-6.4L2.7 9.3l6.5-.7z" fill="#1C1B19"/></svg><span class="ennum" style="font-size:230px;line-height:1">${b.rating.toFixed(2)}</span>`);
    const rv = el("div", { class: "abs", style: "left:66px;top:500px;font:900 50px/1 'Noto Sans JP';letter-spacing:.04em;opacity:0" }, `レビュー <span class="ennum" style="font-size:84px">0</span> 件`);
    const dt = el("div", { class: "note", style: "left:66px;top:580px" }, b.date);
    const ct = el("div", { class: "cta", style: "left:60px;top:1600px" }, `<span style="position:relative">${b.cta}</span><svg width="38" height="38" viewBox="0 0 24 24" style="position:relative"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="#F2EFEA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="sw"></div>`);
    const cn = el("div", { class: "note", style: "left:66px;top:1740px" }, b.cta_note || "");
    const trio = (b.pair || []).map((img, k) => el("img", { src: `${DIR}${img}`, class: "abs", style: `left:${k ? 700 : 40}px;top:860px;width:340px;opacity:0` }, "", $("prodlayer")));
    hold(i, s, F0.body, [540, 1080], 400, 420);
    U.push((t) => { fadeUp(st, s0, 999, 22, 12, 0.8); fadeUp(rv, r0, 999, 22, 12, 0.8); setText(rv.querySelector("span"), Math.round(b.reviews * outC((t - r0) / (r1 - r0))).toLocaleString("en-US"));
      fadeIO(dt, r1, 999); fadeUp(ct, cta, 999, 34, 12, 0.8); fadeIO(cn, cta + 0.3, 999);
      const cs = clamp((t - (cta + 0.35)) / 0.9), sw = ct.querySelector(".sw"); sw.style.backgroundPosition = `${lerp(100, 0, inOutC(cs))}% 0`; sw.style.opacity = (cs > 0 && cs < 1) ? 1 : 0;
      trio.forEach((im, k) => { const a = sp(t - (t0 + 0.5 + k * 0.15), 10, 0.85); im.style.opacity = clamp(a * 1.3); im.style.transform = `translate(${(1 - clamp(a)) * (k ? 120 : -120)}px, ${FLOAT(t + k * 2)}px)`; }); });
  },
};
CORE.start({ grain: [214, 42], wipe: false, refl: false, motionBlur: true,
  onSeek(t, cam) {
    const base = toScreen(cam, [F0.body[0], F0.base_y]); $("floor").style.top = (base[1] - 120) + "px";
    $("heroG").style.transform = `translateY(${FLOAT(t)}px)`; $("sh").style.opacity = 1;
    const last = B[B.length - 1]; sweepAt($("sw"), t < last.t0 ? 0.9 : last.t0 + 0.4, 1.1, 0.7);
  } }, KINDS);
</script>
</body>
</html>
