<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts2/fonts.css">
<style>
  /* 型：エディトリアル（誌面）。設計書（window.PRODUCT）と時刻表（window.TIMELINE）だけで絵が決まる */
  :root { --nf-ink:#1C1A17; --nf-acc:#9A6438; --nf-acc-ink:#7A4E2B; --nf-mut:#5E574D; --nf-bg:#F3EFE8; --nf-num:"Cormorant Garamond","Shippori Mincho"; --nf-num-w:500; /* 数字の見せ方 numfx.js（#279） */ --bg:#F3EFE8; --stone:#E4DDD2; --ink:#1C1A17; --mut:#5E574D; --cu:#9A6438; --gold:#B88A3E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); }
  body { position:relative; color:var(--ink); font-family:"Noto Sans JP",sans-serif; }
  .abs { position:absolute; }
  .min { font-family:"Shippori Mincho",serif; font-weight:700; }
  .gar { font-family:"Cormorant Garamond","Shippori Mincho",serif; font-weight:500; font-feature-settings:"lnum" 1; font-variant-numeric:lining-nums; }
  .note { position:absolute; font:500 27px/1.5 "Noto Sans JP"; color:var(--mut); }
  .lab { font:500 34px/1 "Cormorant Garamond"; letter-spacing:.36em; color:var(--cu); }
  .kin { position:absolute; white-space:nowrap; }
  .kin > span { display:inline-block; }
  #bg { position:absolute; inset:-60px; background:radial-gradient(ellipse 900px 700px at 70% 18%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 70%), linear-gradient(180deg, #F6F3EE 0%, #F1ECE4 60%, #E9E2D7 100%); }
  #table { position:absolute; left:-60px; width:1200px; height:1000px; background:linear-gradient(180deg, rgba(214,205,192,0) 0%, #DDD5C9 3%, #E6DFD5 30%, #EDE7DE 100%); }
  #world { position:absolute; left:0; top:0; width:600px; height:400px; transform-origin:0 0; }
  #world img, #world .m { position:absolute; display:block; }
  .shadow { position:absolute; border-radius:50%; background:radial-gradient(ellipse at 50% 50%, rgba(60,45,30,.45) 0%, rgba(60,45,30,.18) 42%, rgba(60,45,30,0) 72%); }
  .refl { transform:scaleY(-1); transform-origin:50% 50%; opacity:.16; -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 26%); mask-image:linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 26%); }
  .sweep { position:absolute; inset:0; mix-blend-mode:screen; opacity:0; background:linear-gradient(100deg, rgba(255,255,255,0) 44%, rgba(255,250,240,.75) 50%, rgba(255,255,255,0) 56%); background-size:340% 100%; background-position:100% 0; background-repeat:no-repeat; }
  .card { position:absolute; background:#fff; border-radius:22px; box-shadow:0 30px 60px rgba(60,45,30,.18), 0 6px 14px rgba(60,45,30,.10); overflow:hidden; }
  #pr { left:64px; top:176px; font:700 26px/1 "Noto Sans JP"; color:#3E3A33; border:2px solid #3E3A33; background:rgba(255,253,248,.92); padding:5px 13px; border-radius:7px; letter-spacing:.06em; z-index:5; }   /* どの背景でも読める札（#277） */
  #wipe { position:absolute; left:0; top:-200px; width:1400px; height:2400px; background:var(--stone); transform-origin:0 0; pointer-events:none; }
  #wipe::after { content:""; position:absolute; left:0; top:0; width:6px; height:100%; background:var(--cu); }
  #grain { position:absolute; inset:0; width:1080px; height:1920px; mix-blend-mode:multiply; opacity:.10; pointer-events:none; }
  .pill { position:absolute; display:flex; align-items:center; gap:22px; height:118px; padding:0 44px 0 30px; border:3px solid var(--ink); border-radius:60px; font:700 52px/1 "Noto Sans JP"; letter-spacing:.04em; background:rgba(255,255,255,.7); }
  .pill svg { width:62px; height:62px; }
  table.cmp { position:absolute; border-collapse:collapse; font:700 32px/1.25 "Noto Sans JP"; }
  table.cmp td { padding:24px 18px; border-bottom:2px solid #EAE4DA; vertical-align:middle; }
  table.cmp small { font:500 24px/1.3 "Noto Sans JP"; color:var(--mut); }
  .cta { position:absolute; display:flex; align-items:center; gap:16px; height:116px; padding:0 46px; border-radius:58px; background:var(--ink); color:#fff; font:700 42px/1 "Noto Sans JP"; letter-spacing:.05em; white-space:nowrap; overflow:hidden; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="table"></div>
  <div id="under"></div>   <!-- 本体より後ろに置く物（写真カード・時計の輪） -->
  <div id="world"></div>
  <div id="over"></div>    <!-- 本体より前（実写・証拠カード） -->
  <div id="ui" class="abs" style="left:0;top:0;width:1080px;height:1920px"><div id="pr" class="abs">PR</div></div>
  <div id="wipe"></div>
  <canvas id="grain" width="540" height="960"></canvas>
<script src="core.js"></script>
<script src="numfx.js"></script>
<script src="target.js"></script>
<script>
const KINDS = {
  num: NUM_KIND,   // 数字の見せ方（numfx.js・#279）
  cover(b, i, s) {
    const t0 = s.t0;
    let card = null, img = null;
    if (b.image) { card = el("div", { class: "card", style: "left:70px;top:640px;width:940px;height:660px" }, `<img src="${DIR}${b.image}" style="position:absolute;left:0;top:0;width:940px;height:660px;object-fit:cover;transform-origin:60% 60%">`, $("under")); img = card.firstChild; }
    const h0 = kinWrap(el("div", { class: "kin min", style: "left:66px;top:262px;font-size:132px;letter-spacing:.02em" }, b.head[0]));
    const h1 = kinWrap(el("div", { class: "kin min", style: "left:66px;top:418px;font-size:132px;letter-spacing:.02em" }, b.head[1] || ""));
    const nm = el("div", { class: "abs gar", style: `left:70px;top:1340px;font-size:${Math.min(58, Math.floor(940 / (P.name.length * 1.2)))}px;letter-spacing:.18em;white-space:nowrap;opacity:0` }, P.name);   // 長い商品名は1行に収まる大きさに（折り返すと下の行に重なる）
    const sb = el("div", { class: "abs", style: "left:72px;top:1420px;font:700 32px/1 'Noto Sans JP';letter-spacing:.1em;color:var(--mut);opacity:0" }, P.sub || "");
    const cn = b.note ? el("div", { class: "note", style: "left:72px;top:1490px;width:936px;opacity:0" }, b.note) : null;   // 見出しが販売ページの言葉の引用の時の※
    if (b.image) { K.push({ t: t0, show: 0, F: F0.body, A: [540, 2600], z: 1.3, r: 0 }, { t: s.t1 - 0.01, show: 0, F: F0.body, A: [540, 2600], z: 1.3, r: 0 }); }
    else { K.push({ t: t0, show: 1, F: F0.body, A: [540, 1150], z: fitZ(820), r: 0 }, { t: s.t1 - 0.01, show: 1, F: F0.body, A: [540, 1140], z: fitZ(860), r: 0 }); }
    U.push((t) => {
      if (card) { const a = 0.45 + 0.55 * inOutC((t - t0) / 0.6); card.style.opacity = t > OUT(i) || t < t0 ? 0 : 1; card.style.clipPath = `inset(${(1 - a) * 100}% 0 0 0 round 22px)`;
        img.style.transform = `scale(${1.04 + 0.08 * clamp((t - t0) / (s.t1 - t0))}) translate(${-12 * clamp((t - t0) / (s.t1 - t0))}px, 0)`; }
      kin(h0, t0 - 0.3, OUT(i)); kin(h1, t0 + 0.15, OUT(i)); fadeUp(nm, t0 + 1.0, OUT(i)); fadeUp(sb, t0 + 1.2, OUT(i)); if (cn) fadeUp(cn, t0 + 0.8, OUT(i));
    });
  },
  counter(b, i, s) {
    const t0 = s.t0, n0 = t0 + 0.35, n1 = t0 + 1.35;
    const big = el("div", { class: "abs gar", style: "left:54px;top:210px;font-size:300px;line-height:1;opacity:0" }, `<span>0</span><span style="font-size:116px;margin-left:12px">${b.unit}</span>`);
    const sub = el("div", { class: "abs", style: "left:70px;top:540px;font:700 54px/1 'Noto Sans JP';letter-spacing:.06em;opacity:0" }, `${b.sub[0]}<span class="gar" style="font-size:80px;color:var(--cu);margin:0 8px">${b.sub[1]}</span>${b.sub[2]}`);
    let icons = [];
    if (b.icons === "cups") { const svg = el("div", { class: "abs", style: "left:62px;top:650px;width:600px;height:200px" }, "");
      let h = `<svg width="600" height="200">`; for (let k = 0; k < b.count; k++) { const x = k * 190;
        h += `<defs><clipPath id="c${i}_${k}"><path d="M${18 + x},40 L${30 + x},150 Q${32 + x},162 ${44 + x},162 L${112 + x},162 Q${124 + x},162 ${126 + x},150 L${138 + x},40 Z"/></clipPath></defs>
        <g opacity="0"><rect clip-path="url(#c${i}_${k})" x="${x}" y="162" width="160" height="0" fill="#9A6438" fill-opacity=".8"/>
        <path d="M${18 + x},40 L${30 + x},150 Q${32 + x},162 ${44 + x},162 L${112 + x},162 Q${124 + x},162 ${126 + x},150 L${138 + x},40" fill="none" stroke="#1C1A17" stroke-width="4" stroke-linejoin="round"/>
        <path d="M${136 + x},64 q26,4 24,30 q-2,24 -30,26" fill="none" stroke="#1C1A17" stroke-width="4"/></g>`; }
      svg.innerHTML = h + "</svg>"; icons = [...svg.querySelectorAll("g")]; }
    K.push({ t: t0, show: 1, F: F0.body, A: [650, 1220], z: fitZ(640), r: 0 }, { t: s.t1 - 0.01, show: 1, F: [F0.body[0] + 15, F0.body[1]], A: [650, 1220], z: fitZ(690), r: 0 });
    U.push((t) => {
      const a = sp(t - (n0 - 0.1), 11, 0.85), o = outC((t - OUT(i)) / 0.25); big.style.opacity = clamp(a * 1.3) * (1 - o); big.style.transform = `translateY(${(1 - clamp(a)) * 60}px)`;
      const v = String(Math.round(b.value * outC((t - n0) / (n1 - n0)))); if (big.firstChild.textContent !== v) big.firstChild.textContent = v;
      fadeUp(sub, n1 - 0.2, OUT(i));
      icons.forEach((g, k) => { const ti = t0 + 1.5 + k * 0.5, a2 = sp(t - (ti - 0.35), 10, 1), f = inOutC((t - ti) / 0.55); g.setAttribute("opacity", clamp(a2 * 1.2) * (1 - o)); g.setAttribute("transform", `translate(0 ${(1 - a2) * 16})`);
        const r = g.querySelector("rect"); r.setAttribute("y", 162 - 108 * f); r.setAttribute("height", 108 * f); });
    });
  },
  macro_broll(b, i, s) {
    const t0 = s.t0, sw = t0 + 1.16;
    const cv = el("canvas", { class: "abs", width: 1080, height: 1920, style: "left:0;top:0;opacity:0" }, "", $("over"));
    const sh = el("div", { class: "abs", style: "left:0;top:0;width:1080px;height:1920px;opacity:0;background:linear-gradient(180deg, rgba(20,16,12,.55) 0%, rgba(20,16,12,0) 34%, rgba(20,16,12,0) 70%, rgba(20,16,12,.45) 100%)" }, "", $("over"));
    const h = kinWrap(el("div", { class: "kin min", style: "left:66px;top:262px;font-size:120px" }, b.head));
    const en = el("div", { class: "abs gar", style: "left:72px;top:420px;font-size:48px;letter-spacing:.4em;opacity:0" }, b.en || "");
    const nt = el("div", { class: "note", style: "left:72px;top:1430px;opacity:0" }, b.note || "");
    const fr = []; for (let k = 1; k <= b.frames; k++) { const im = new Image(); im.src = `${DIR}${b.broll}/f_${String(k).padStart(3, "0")}.jpg`; fr.push(im); BRF.push(im); }
    const tip = F0.tip, mid = [lerp(tip[0], F0.body[0], 0.22), lerp(tip[1], F0.body[1], 0.45)];
    K.push({ t: t0, show: 1, F: mid, A: [600, 1060], z: fitZ(1330), r: -8 }, { t: sw - 0.01, show: 1, F: [lerp(tip[0], mid[0], 0.6), lerp(tip[1], mid[1], 0.6)], A: [600, 1020], z: fitZ(1530), r: -20 },
           { t: sw, show: 0, F: mid, A: [600, 1020], z: fitZ(1530), r: -20 }, { t: s.t1 - 0.01, show: 0, F: mid, A: [600, 1020], z: fitZ(1530), r: -20 });
    const ctx = cv.getContext("2d");
    U.push((t) => {
      const on = t >= sw && t < s.t1; cv.style.opacity = on ? 1 : 0; sh.style.opacity = on ? 1 : 0;
      if (on) ctx.drawImage(fr[clamp(Math.floor((t - sw) * 25), 0, fr.length - 1)], 0, 0, 1080, 1920);
      kin(h, t0 + 0.12, OUT(i)); h.style.color = on ? "#fff" : "#1C1A17"; h.style.textShadow = on ? "0 4px 30px rgba(0,0,0,.35)" : "none";
      fadeUp(en, t0 + 0.45, OUT(i)); en.style.color = on ? "#F2DFC2" : "#9A6438"; fadeUp(nt, sw + 0.5, OUT(i)); nt.style.color = on ? "#F5EEE4" : "#5E574D";
    });
  },
  ring(b, i, s) {
    const t0 = s.t0, r0 = t0 + 0.35, r1 = Math.min(t0 + 2.0, s.t1 - 0.6);
    const svg = el("div", { class: "abs", style: "left:0;top:0;width:1080px;height:1920px;opacity:0" }, `<svg width="1080" height="1920"><circle cx="540" cy="640" r="250" fill="none" stroke="#DCD3C6" stroke-width="16"/><circle cx="540" cy="640" r="250" fill="none" stroke="#9A6438" stroke-width="16" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 540 640)"/></svg>`, $("under"));
    const lab = el("div", { class: "abs", style: "left:0;top:250px;width:1080px;text-align:center;font:700 44px/1 'Noto Sans JP';letter-spacing:.12em;opacity:0" }, b.label);
    const val = el("div", { class: "abs", style: "left:0;top:500px;width:1080px;text-align:center;line-height:1;opacity:0" }, `<span class="min" style="font-size:96px">${b.value[0]}</span><span class="gar" style="font-size:250px;margin:0 6px">${b.value[1]}</span><span class="min" style="font-size:96px">${b.value[2]}</span>`);
    const nt = el("div", { class: "note", style: "left:0;top:930px;width:1080px;text-align:center;opacity:0" }, b.note || "");
    K.push({ t: t0, show: 1, F: F0.body, A: [540, 1340], z: fitZ(580), r: 0 }, { t: s.t1 - 0.01, show: 1, F: F0.body, A: [540, 1330], z: fitZ(615), r: 0 });
    U.push((t) => { fadeUp(lab, t0 + 0.2, OUT(i)); fadeUp(val, t0 + 0.32, OUT(i), 40); fadeUp(nt, r1 - 0.4, OUT(i));
      const rin = sp(t - (r0 - 0.3), 9, 1), o = outC((t - OUT(i)) / 0.25); svg.style.opacity = clamp(rin * 1.2) * (1 - o); svg.querySelectorAll("circle")[1].setAttribute("stroke-dashoffset", String(1 - inOutC((t - r0) / (r1 - r0)))); });
  },
  compare(b, i, s) {
    const t0 = s.t0;
    const lab = el("div", { class: "abs", style: "left:70px;top:250px;opacity:0" }, `<span class="lab">${b.label}</span>`);
    const ti = kinWrap(el("div", { class: "kin min", style: "left:66px;top:300px;font-size:84px" }, b.title));
    let rows = `<tr><td style="width:42%"></td><td style="width:27%;text-align:center;color:var(--mut)">${b.cols[0][0]}<br><span class="gar" style="font-size:40px">${b.cols[0][1]}</span></td><td style="width:31%;text-align:center;color:#fff;background:var(--ink)">${b.cols[1][0]}<br><span class="gar" style="font-size:40px;color:#E8C99A">${b.cols[1][1]}</span></td></tr>`;
    b.rows.forEach((r) => rows += `<tr><td>${r[0]}</td><td style="text-align:center;color:var(--mut)">${r[1]}</td><td style="text-align:center;color:var(--cu)">${r[2]}</td></tr>`);
    const card = el("div", { class: "card", style: `left:56px;top:440px;width:968px;height:${120 + b.rows.length * 120}px;opacity:0` }, `<table class="cmp" style="left:0;top:0;width:968px">${rows}</table>`);
    const nt = el("div", { class: "note", style: `left:70px;top:${460 + 120 + b.rows.length * 120}px;opacity:0` }, b.note || "");
    const trs = [...card.querySelectorAll("tr")];
    K.push({ t: t0, show: 1, F: F0.body, A: [540, 1330], z: fitZ(445), r: 0 }, { t: s.t1 - 0.01, show: 1, F: F0.body, A: [540, 1320], z: fitZ(475), r: 0 });
    U.push((t) => { fadeUp(lab, t0 + 0.1, OUT(i)); kin(ti, t0 + 0.25, OUT(i), 0.03); fadeUp(card, t0 + 0.65, OUT(i), 40);
      trs.forEach((tr, k) => { const a = sp(t - (t0 + 0.85 + k * 0.32), 12, 1); tr.style.opacity = clamp(a * 1.3); tr.style.transform = `translateX(${(1 - a) * 40}px)`; });
      fadeUp(nt, s.t1 - 1.6, OUT(i)); });
  },
  // あたため（モーショングラフィック・#286）：冷たい色の布団に本体が差し込まれ、温風が曲線で流れ、差した所から暖色に染まる。10分の輪が満ちる
  // 布団と風と色は図（イメージ・※で明記）。本体は販売ページの写真の切り抜き
  warmup(b, i, s) {
    const t0 = s.t0, X0 = 90, Y0 = 640, FW = 900, FH = 560, ix = X0 + FW - 40, iy = Y0 + FH / 2;
    const h0 = kinWrap(el("div", { class: "kin min", style: "left:66px;top:262px;font-size:104px;letter-spacing:.02em" }, b.head[0]));
    const h1 = kinWrap(el("div", { class: "kin min", style: "left:66px;top:400px;font-size:150px;letter-spacing:.02em;color:var(--cu)" }, b.head[1] || ""));
    const stitch = [1, 2, 3, 4].map((k) => { const y = Y0 + k * FH / 5; return `<path d="M${X0 + 20},${y} ${Array.from({ length: 9 }, (_, j) => `Q${X0 + 50 + j * 100},${y + (j % 2 ? 16 : -16)} ${X0 + 100 + j * 100},${y}`).join(" ")}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4"/>`; }).join("");
    const flows = [-200, -110, -30, 40, 120, 210].map((dy, k) => `<path class="fl" d="M${ix - 60},${iy} C${ix - 260},${iy + dy * 0.3} ${ix - 480},${iy + dy} ${X0 + 80},${iy + dy * 1.15}" fill="none" stroke="rgba(255,236,214,.95)" stroke-width="7" stroke-linecap="round" stroke-dasharray="40 46" opacity="0"/>`).join("");
    const svg = el("div", { class: "abs", style: "left:0;top:0;width:1080px;height:1920px;opacity:0" }, `<svg width="1080" height="1920">
      <defs><clipPath id="qc${i}"><rect x="${X0}" y="${Y0}" width="${FW}" height="${FH}" rx="90"/></clipPath>
        <radialGradient id="wg${i}"><stop offset="0" stop-color="#F0A36E"/><stop offset=".55" stop-color="#F4BF94"/><stop offset="1" stop-color="#F4BF94" stop-opacity="0"/></radialGradient></defs>
      <rect x="${X0}" y="${Y0 + 26}" width="${FW}" height="${FH}" rx="90" fill="rgba(60,45,30,.12)"/>
      <g clip-path="url(#qc${i})"><rect x="${X0}" y="${Y0}" width="${FW}" height="${FH}" fill="#AFC2D2"/><circle class="wm" cx="${ix}" cy="${iy}" r="0" fill="url(#wg${i})"/>${stitch}${flows}</g>
      <rect x="${X0}" y="${Y0}" width="${FW}" height="${FH}" rx="90" fill="none" stroke="rgba(28,26,23,.18)" stroke-width="3"/>
      <circle cx="210" cy="1420" r="96" fill="none" stroke="#DCD3C6" stroke-width="14"/>
      <circle class="tr" cx="210" cy="1420" r="96" fill="none" stroke="#9A6438" stroke-width="14" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 210 1420)"/></svg>`, $("under"));
    const W = svg.querySelector(".wm"), FL = svg.querySelectorAll(".fl"), TR = svg.querySelector(".tr");
    const stick = el("div", { class: "abs prod", style: `left:0;top:0;width:${HERO.w * 2.2}px;height:${HERO.h * 2.2}px;opacity:0;transform-origin:0 0` }, `<img src="${DIR}${P.hero.cutout}" style="width:100%;height:100%;filter:drop-shadow(0 18px 24px rgba(40,30,20,.3))">`, $("under"));
    const num = el("div", { class: "abs", style: "left:150px;top:1366px;width:120px;text-align:center;line-height:1;opacity:0" }, `<span class="gar" style="font-size:96px">0</span><span class="min" style="font-size:34px">分</span>`);
    const lab = el("div", { class: "abs", style: "left:350px;top:1360px;opacity:0" }, `<div style="font:900 52px/1.2 'Noto Sans JP'">${b.label}</div><div style="font:700 38px/1.5 'Noto Sans JP';color:var(--cu)">${b.temp || ""}</div>`);
    const nt = el("div", { class: "note", style: "left:72px;top:1600px;width:936px;opacity:0" }, b.note || "");
    K.push({ t: t0, show: 0, F: F0.body, A: [540, 2600], z: 1.2, r: 0 }, { t: s.t1 - 0.01, show: 0, F: F0.body, A: [540, 2600], z: 1.2, r: 0 });
    const L = HERO.h * 2.2;   // 横に寝かせた本体の長さ（切り抜きは縦長）
    U.push((t) => {
      const u = t - t0, o = outC((t - OUT(i)) / 0.25);
      kin(h0, t0 + 0.05, OUT(i)); kin(h1, t0 + 0.25, OUT(i)); fadeUp(lab, t0 + 1.0, OUT(i)); fadeUp(nt, t0 + 1.4, OUT(i));
      svg.style.opacity = clamp(sp(u, 10, 1) * 1.3) * (1 - o);
      const ins = inOutC((u - 0.25) / 0.7);   // 右から差し込まれる（吹き出し口が布団側）

    const glow = sl.lastElementChild;
    K.push({ t: t0, show: 0, F: F0.body, A: [540, 2600], z: 1.2, r: 0 }, { t: s.t1 - 0.01, show: 0, F: F0.body, A: [540, 2600], z: 1.2, r: 0 });
    const x0 = L + sb[0] * W, y0 = T0 + sb[1] * H, w0 = sb[2] * W, x1 = 540 - 330, y1 = 860, w1 = 660;   // 写真の中の位置 → 前に出た位置
    U.push((t) => {
      const u = t - t0, o = outC((t - OUT(i)) / 0.25);
      kin(h0, t0 + 0.1, OUT(i)); kin(h1, t0 + 0.3, OUT(i)); fadeUp(sub, t0 + 1.9, OUT(i)); fadeUp(nt, t0 + 1.2, OUT(i));
      const lift = inOutC((u - 0.75) / 0.85), push = inOutC((u - 1.75) / Math.max(1.2, s.t1 - t0 - 2.1));
      whole.style.opacity = clamp(sp(u, 10, 1) * 1.3) * (1 - o) * lerp(1, 0.45, lift);
      whole.style.filter = `blur(${lift * 9}px) drop-shadow(0 30px 40px rgba(60,45,30,.2))`; whole.style.transform = `scale(${lerp(1.0, 0.94, lift) * (1 + 0.03 * clamp(u / 1.0))})`;
      const sc = (w0 + (w1 - w0) * lift) / w0, x = lerp(x0, x1, lift), y = lerp(y0, y1, lift) - Math.sin(Math.PI * lift) * 60;
      const hs1 = w1 * (sb[3] * H) / (sb[2] * W), cx = (540 - (x1 + f[0] * w1)) * push, cy = (1080 - (y1 + f[1] * hs1)) * push;   // 断面を画面の真ん中へ
      sl.style.opacity = u < 0.75 ? 0 : (1 - o); sl.style.left = `${x + cx}px`; sl.style.top = `${y + cy}px`;
      sl.style.transform = `scale(${sc * lerp(1, 1.5, push)}) rotate(${lerp(0, -4, lift) + lerp(0, 3, push)}deg)`;
      glow.style.backgroundPosition = `${lerp(100, 0, clamp((u - 1.9) / 1.3))}% 0`; glow.style.opacity = u > 1.9 && u < 3.3 ? 1 : 0;
    });
  },
  // おすすめを文字だけで（オーナー「コーヒーの描写はコーヒー売る訳じゃないからいらない、他のコメントと一緒にテロップだけで紹介して」）。
  // 商品を下に置き、上に札を1枚ずつ。札＝販売ページの説明文・商品名に書いてある事だけ
  points(b, i, s) {
    const t0 = s.t0, n = b.items.length, gap = Math.min(0.5, (s.t1 - t0 - 1.6) / n);
    const lab = el("div", { class: "abs gar", style: "left:72px;top:262px;font-size:48px;letter-spacing:.4em;color:var(--cu);opacity:0" }, b.label || "");
    const rows = b.items.map((it, k) => el("div", { class: "abs", style: `left:64px;top:${350 + k * 170}px;width:952px;height:140px;border-radius:24px;background:rgba(255,253,248,.94);box-shadow:0 14px 30px rgba(60,45,30,.10);display:flex;align-items:center;gap:26px;padding:0 34px;opacity:0` },
      `<svg width="56" height="56" viewBox="0 0 24 24" style="flex:none"><circle cx="12" cy="12" r="11" fill="#9A6438"/><path d="M6.5 12.5l3.6 3.6L17.5 8.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div style="font:900 50px/1.2 'Noto Sans JP';color:var(--ink)">${it[0]}</div>${it[1] ? `<div style="font:500 28px/1.4 'Noto Sans JP';color:var(--mut)">${it[1]}</div>` : ""}</div>`));
    const nt = el("div", { class: "note", style: "left:72px;top:1700px;width:936px;opacity:0" }, b.note || "");
    // 写真がある時は商品の切り抜きの代わりに使っている写真（家具など：切り抜き1つでは何の商品か伝わらない物）
    const card = b.image ? el("div", { class: "card", style: "left:70px;top:1060px;width:940px;height:560px;opacity:0" }, `<img src="${DIR}${b.image}" style="width:940px;height:560px;object-fit:${b.image_fit || "cover"}">`, $("under")) : null;   // 色の一覧など切れてはいけない写真は image_fit: contain（背景は白いカード）
    if (card) K.push({ t: t0, show: 0, F: F0.body, A: [540, 2600], z: 1.2, r: 0 }, { t: s.t1 - 0.01, show: 0, F: F0.body, A: [540, 2600], z: 1.2, r: 0 });
    else K.push({ t: t0, show: 1, F: F0.body, A: [540, 1420], z: fitZ(560), r: 0 }, { t: s.t1 - 0.01, show: 1, F: F0.body, A: [540, 1405], z: fitZ(600), r: 0 });
    U.push((t) => { fadeUp(lab, t0 + 0.1, OUT(i)); fadeUp(nt, t0 + 0.8, OUT(i)); if (card) { fadeUp(card, t0 + 0.05, OUT(i), 40); card.firstChild.style.transform = `scale(${1.03 + 0.05 * clamp((t - t0) / (s.t1 - t0))})`; }
      rows.forEach((r, k) => { const a = sp(t - (t0 + 0.35 + k * gap), 12, 0.8), o = outC((t - OUT(i)) / 0.25); r.style.opacity = clamp(a * 1.3) * (1 - o); r.style.transform = `translateX(${(1 - clamp(a)) * -80}px)`; }); });
  },
  // 中身めぐり（オーナー「商品ページから違うケーキの描写あれば色んな角度から」）：販売ページの写真から切り抜いた品を1つずつ、
  // 引き→傾け→寄り（断面・表面）の3つの角度で見せる。写真は1方向から撮った物なので、角度はカメラの動き（写真そのものは変えない）
  tour(b, i, s) {
    const t0 = s.t0, n = b.items.length, D = (s.t1 - t0 - 0.45) / n;
    const h0 = kinWrap(el("div", { class: "kin min", style: "left:66px;top:262px;font-size:120px;letter-spacing:.02em" }, b.head[0]));
    const h1 = kinWrap(el("div", { class: "kin min", style: "left:66px;top:410px;font-size:120px;letter-spacing:.02em" }, b.head[1] || ""));
    const nt = el("div", { class: "note", style: "left:72px;top:1600px;width:936px;opacity:0" }, b.note || "");
    const stg = el("div", { class: "abs prod", style: "left:0;top:0;width:1080px;height:1920px;perspective:1800px;clip-path:inset(580px 0 340px 0)" }, "", $("under"));   // 寄っても見出しと※に掛からない窓
    const cards = b.items.map((it) => { const w = el("div", { class: "abs", style: "left:140px;top:640px;width:800px;height:760px;opacity:0;transform-style:preserve-3d" }, `<img src="${DIR}${it.cut}" style="position:absolute;left:0;top:0;width:800px;height:760px;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(60,45,30,.22))">`, stg); return { w, f: it.focus || [0.5, 0.5] }; });
    K.push({ t: t0, show: 0, F: F0.body, A: [540, 2600], z: 1.2, r: 0 }, { t: s.t1 - 0.01, show: 0, F: F0.body, A: [540, 2600], z: 1.2, r: 0 });
    U.push((t) => {
      kin(h0, t0 + 0.05, OUT(i)); kin(h1, t0 + 0.25, OUT(i)); fadeUp(nt, t0 + 0.6, OUT(i));
      cards.forEach((c, k) => { const a = t0 + 0.3 + k * D, u = (t - a) / D, on = u > 0 && (u < 1 || k === n - 1) && t < OUT(i) + 0.25;   // 前の品が出切ってから次（重ならない）
        if (!on) { c.w.style.opacity = 0; return; }
        const inn = outC(u / 0.16), out = k < n - 1 ? inOutC((u - 0.88) / 0.12) : outC((t - OUT(i)) / 0.25);
        const p1 = inOutC(u / 0.45), p2 = inOutC((u - 0.45) / 0.5);   // 引き→傾け（0〜0.45）→寄り（0.45〜0.95）
        const zs = lerp(lerp(0.92, 1.0, p1), 2.1, p2), ry = lerp(lerp(-16, 14, p1), 4, p2), rx = lerp(6, 0, p1);
        const fx = (c.f[0] - 0.5) * 800 * p2, fy = (c.f[1] - 0.5) * 760 * p2;
        c.w.style.transformOrigin = `${c.f[0] * 100}% ${c.f[1] * 100}%`;
        c.w.style.transform = `translate(${(1 - inn) * 260 - out * 320 - fx * 0.6}px, ${-fy * 0.6}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${zs})`;
        c.w.style.opacity = clamp(inn * 1.2) * (1 - out); });
    });
  },
  finale(b, i, s) {
    const t0 = s.t0, hasR = !!b.ranking, PB = hasR ? t0 + 1.96 : t0;
    let card = null, rn = null;
    if (hasR) { card = el("div", { class: "card", style: "left:150px;top:300px;width:780px;height:780px;opacity:0" }, `<img src="${DIR}${b.ranking.image}" style="width:780px;height:780px">`, $("over"));
      rn = el("div", { class: "note", style: "left:90px;top:1110px;width:900px;text-align:center;opacity:0" }, b.ranking.note); }
    const st = el("div", { class: "abs", style: "left:64px;top:250px;opacity:0;display:flex;align-items:flex-end;gap:14px" }, `<svg width="92" height="92" viewBox="0 0 24 24" style="margin-bottom:30px"><path d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9 6.2 20.1l1.4-6.4L2.7 9.3l6.5-.7z" fill="#B88A3E"/></svg><span class="gar" style="font-size:220px;line-height:1">${b.rating.toFixed(2)}</span>`);
    const rv = el("div", { class: "abs", style: "left:72px;top:500px;font:700 46px/1 'Noto Sans JP';letter-spacing:.06em;opacity:0" }, `レビュー <span class="gar" style="font-size:72px;color:var(--cu)">0</span> 件`);
    const dt = el("div", { class: "note", style: "left:72px;top:572px;opacity:0" }, b.date);
    const ct = el("div", { class: "cta", style: "left:64px;top:650px;opacity:0" }, `<span style="position:relative">${b.cta}</span><svg width="38" height="38" viewBox="0 0 24 24" style="position:relative"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="sweep" style="mix-blend-mode:plus-lighter"></div>`);
    const cn = el("div", { class: "note", style: "left:72px;top:790px;opacity:0" }, b.cta_note || "");
    const co = el("div", { class: "abs gar", style: `left:72px;top:${Math.max(1440, Math.round(1230 + HERO.h * fitZ(575) / 2 + 30))}px;font-size:40px;letter-spacing:.3em;color:var(--mut);opacity:0` }, b.colors || "");   // 縦長の商品は写真の下へ（1440 だと重なる・カシウェア）
    const cx = P.hero.alt ? HERO.w * 0.75 : HERO.w * 0.5;
    if (hasR) K.push({ t: t0, show: 0, F: [cx, 150], A: [500, 1260], z: fitZ(520), r: 0 }, { t: PB - 0.01, show: 0, F: [cx, 150], A: [500, 1260], z: fitZ(520), r: 0 });
    K.push({ t: PB, show: 1, F: [cx, HERO.h * 0.49], A: [500, 1230], z: fitZ(535), r: 0 }, { t: END, show: 1, F: [cx, HERO.h * 0.49], A: [500, 1230], z: fitZ(575), r: 0 });
    U.push((t) => {
      if (hasR) { const a = sp(t - (t0 + 0.05), 9, 0.8), o = outC((t - (PB - 0.24)) / 0.3); card.style.opacity = clamp(a * 1.3) * (1 - o) * (t >= t0 ? 1 : 0);
        card.style.transform = `translateY(${(1 - clamp(a)) * 80}px) rotate(${lerp(-7, -2.5, clamp(a))}deg) scale(${lerp(0.92, 1, clamp(a))})`; fadeUp(rn, t0 + 0.45, PB - 0.24); }
      const alt = $("altG"); if (alt) { const w = sp(t - PB, 8, 1); alt.style.opacity = t >= PB ? clamp(w * 1.1) : 0; alt.style.transform = `translate(${(1 - w) * 40}px, 0) scale(0.80)`; }
      fadeUp(st, PB, 999); fadeUp(rv, PB + 0.2, 999); const v = Math.round(b.reviews * outC((t - (PB + 0.2)) / 0.9)).toLocaleString("en-US"); const sp2 = rv.querySelector("span"); if (sp2.textContent !== v) sp2.textContent = v;
      fadeUp(dt, PB + 0.6, 999); fadeUp(ct, PB + 0.8, 999, 34); fadeUp(cn, PB + 1.1, 999); fadeUp(co, PB + 0.4, 999); sweepAt(ct.querySelector(".sweep"), PB + 1.3, 0.9, 1);
    });
    if (hasR) MARKS.push(PB);
  },
};

CORE.start({ grain: [215, 40], wipe: true, refl: true, motionBlur: false,
  onSeek(t) { const last = B[B.length - 1]; if ($("sw")) sweepAt($("sw"), t < last.t0 ? (B[1] ? B[1].t0 + 0.4 : 0.6) : last.t0 + 2.6, 1.2, 0.8); } }, KINDS);
</script>
