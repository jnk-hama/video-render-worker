<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

     寸法図から組んだ形（傘＝円すい台・脚3本）の上に写真を貼り直して立体にする。カメラは商品の周りを回り・上下し・寄る。
     写真の画素は描き変えない（光の計算をしない材質・#068）。回り込みは写真の角度から ±10° まで（#304）。高さは傘の下（1.1m）まで＝写っていない傘の上の面を見せない。
     背景・床・映り込み・光の筋は CG（注意書きに書く）。字は DOM（#ui）＝点検 23項目がそのまま読む。点検の「写真の層」は QC_PRODUCT_ONLY で商品だけを描き直して撮る。

<script>

{ const vv = /^voicevox:([^/]+)/.exec((P.prep && P.prep.voice) || ""); if (vv) { const c = document.createElement("div"); c.id = "credit"; c.textContent = `VOICEVOX:${vv[1]}`; document.body.appendChild(c); } }

  g.putImageData(im, 0, 0); return c.toDataURL(); });
const grain = scrimDiv("left:0;top:0;width:1080px;height:1920px;mix-blend-mode:overlay;background-size:256px 256px");
U.push(() => { grain.style.backgroundImage = `url(${GRAIN[Math.floor(T() * 24) % 4]})`; grain.style.opacity = 0.08; });
const toggle = (x, y) => { const tr = el("div", { class: "abs", style: `left:${x}px;top:${y}px;width:124px;height:68px;box-sizing:border-box;border-radius:999px;border:3px solid rgba(255,244,226,.6);opacity:0` });

  return (tin, ton, tout) => { const t = T(), k = MK.cd(t - ton, 26);
    tr.style.opacity = (clamp((t - tin) / 0.2) * (1 - clamp((t - tout) / 0.2))).toFixed(3); tr.style.transform = `scale(${(0.9 + 0.1 * MK.cd(t - tin, 20)).toFixed(4)})`;
    knob.style.transform = `translateX(${f2(56 * (t >= ton ? k : 0))}px) scale(${(1 - 0.12 * Math.sin(Math.PI * clamp((t - ton + 0.08) / 0.2))).toFixed(4)})`;
    fillE.style.opacity = (t >= ton ? k : 0).toFixed(3); tr.style.boxShadow = t >= ton ? `0 0 ${f2(36 * k)}px rgba(242,165,74,${(0.45 * k).toFixed(3)})` : "none"; }; };

// =====================================================================
// カメラ：商品の軸の周りを回る（th＝写真の角度から何度回り込むか）。r＝軸からの距離・h＝高さ（m）。

const FOV = 28, TANH = Math.tan((FOV / 2) * Math.PI / 180);
const SH = (th, r, h, ay, cx = 540, cy = 960, ax = 0) => ({ th, r, h, ay, cx, cy, ax });
const s1 = S.S1, s2 = S.S2, s3 = S.S3, s4 = S.S4, s5 = S.S5, s6 = S.S6, s7 = S.S7, s8 = S.S8;
const WX = 1.45;   // 白い型の置き場所（茶の右 1.45m）
const KEYS = [

  [s1.t1 - 0.95, SH(4, 3.25, 0.82, 1.05, 770, 880)],

  [ev("bloom") + 0.45, SH(0, 4.6, 0.8, 0.92, 540, 1080)],
  [s2.t1 - 0.2, SH(-4, 5.4, 0.8, 0.9, 540, 1060)],              // 光が満ちたら引く：光が空間へ広がる
  [s3.t0 + 0.5, SH(-8, 4.8, 0.5, 1.0, 580, 1060)],              // S3：低く回り込み、光の筋を下から
  [s3.t1 - 0.2, SH(-9, 4.8, 0.5, 1.0, 580, 1060)],
  [s4.t0 + 0.9, SH(-3, 1.9, 0.95, 1.4, 540, 1000)],             // S4：傘へ寄る（ドリー）→ 布の寄りへ溶ける
  [s4.t1, SH(-2, 1.7, 0.95, 1.4, 540, 1000)],
  [s5.t0 + 0.05, SH(10, 2.8, 0.55, 0.7, 840, 610)],            // S5：脚の高さで回り込む（3本の脚の前後が入れ替わる＝木の脚の立体）。字は左の空き
  [s5.t1 - 0.15, SH(-8, 2.6, 0.6, 0.66, 840, 610)],
  [s6.t0 + 0.55, SH(0, 4.6, 0.8, 0.92, 560, 1180, WX)],         // S6：横へ滑って白い型へ（トラック）
  [s6.t1 - 0.2, SH(-3, 4.4, 0.8, 0.92, 560, 1180, WX)],
  [s7.t0 + 0.45, SH(0, 9.4, 0.8, 0.85, 540, 860, WX / 2)],       // S7：大きく引いて2色が並ぶ（大きな数字と件数の間）
  [s7.t1 - 0.2, SH(1, 8.9, 0.8, 0.85, 540, 860, WX / 2)],
  [ev("name") - 0.1, SH(6, 5.4, 0.8, 0.95, 830, 640)],           // S8：茶へ戻り、右に立てる（足は注意書きより上・名前は左の空き）。最後まで少しずつ回る（止まって見せない）
  [TL.end, SH(-2, 5.1, 0.8, 0.95, 830, 640)]];
const shotAt = (t) => { let i = KEYS.findIndex((k) => k[0] > t); if (i === -1) return { ...KEYS.at(-1)[1] }; if (i === 0) return { ...KEYS[0][1] };
  const [ta, a] = KEYS[i - 1], [tb, b] = KEYS[i], u = E.inOutCubic((t - ta) / (tb - ta));
  const s = Object.fromEntries(Object.keys(a).map((k) => [k, a[k] + (b[k] - a[k]) * u]));
  s.ay += 0.22 * E.inOutCubic((t - (ev("up") - 0.05)) / 0.5) - 0.22 * E.inOutCubic((t - (ev("down") - 0.05)) / 0.55);   // S3：「上にも」で上へ振り、「下にも」で戻る（下へは振らない：ランプが上がって字にかかる）
  return s; };
// 点灯の強さ（光の筋・床の光・後ろの光）
const litAt = (id, t) => id === "brown" ? E.inOutCubic((t - ev("bloom")) / 0.8) : E.inOutCubic((t - ev("on")) / 0.7);

// ---------- three.js（読み込みが済むまで seek は待つ） ----------
const T3 = {};

  for (const [o, col] of stops) r.addColorStop(o, col); g.fillStyle = r; g.fillRect(0, 0, 256, 256); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx; };
// 光の筋（上へ・下へ）：細い口から広がり、先へ行くほど消える扇。下が口
const fanTex = (THREE) => { const c = document.createElement("canvas"); c.width = 256; c.height = 512; const g = c.getContext("2d");
  for (let y = 0; y < 512; y++) { const v = 1 - y / 511, w = 0.16 + 0.84 * v, a = Math.pow(1 - v, 1.6) * 0.9;
    const lg = g.createLinearGradient(128 - 128 * w, 0, 128 + 128 * w, 0); lg.addColorStop(0, "rgba(255,214,160,0)"); lg.addColorStop(0.5, `rgba(255,214,160,${a.toFixed(3)})`); lg.addColorStop(1, "rgba(255,214,160,0)");
    g.fillStyle = lg; g.fillRect(0, y, 256, 1); }
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx; };
const loadImg = (src) => new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = src; });
T3.ready = import("./vendor/three.module.min.js").then(async (THREE) => {
  const J = await (await fetch(DIR + "lamp.json")).json(), NP = J.parts.length;
  const Z = new Float32Array(await (await fetch(DIR + "z.f32")).arrayBuffer()), PART = new Uint8Array(await (await fetch(DIR + "part.u8")).arrayBuffer());
  const ld = new THREE.TextureLoader(), tex = {};
  for (const n of ["off", "on", "woff", "won"]) { const t = await ld.loadAsync(DIR + n + ".png"); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; tex[n] = t; }
  const ptex = await ld.loadAsync(DIR + "part.png"); ptex.magFilter = ptex.minFilter = THREE.NearestFilter; ptex.generateMipmaps = false;
  // 透明度を CPU で読む（何も無い所の三角形を作らない）
  const im = await loadImg(DIR + "off.png"), cv = document.createElement("canvas"); cv.width = im.width; cv.height = im.height; const g2 = cv.getContext("2d"); g2.drawImage(im, 0, 0);
  const AL = g2.getImageData(0, 0, im.width, im.height).data;
  const [x0, y0, x1, y1] = J.box, W = x1 - x0, H = y1 - y0, G = J.grid, gw = J.gw, gh = J.gh, [Cx, Cy, D] = J.cam, F = J.F, N = J.N, NV = gw * gh;
  const al = new Uint8Array(NV), uv = new Float32Array(NV * 2);
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) { const k = j * gw + i; uv[k * 2] = (i * G + 0.5) / W; uv[k * 2 + 1] = 1 - (j * G + 0.5) / H; al[k] = AL[((j * G) * W + i * G) * 4 + 3]; }
  // 部品ごとの網：その部品の画素（1目ぶん太らせる）を含む三角形だけ。奥行きはその部品の面。写真のカメラから画素を戻す（同じ位置から見れば写真と同じ）
  const geos = [];
  for (let p = 0; p < NP; p++) { const pos = new Float32Array(NV * 3), mk = new Uint8Array(NV);
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) { const k = j * gw + i, z = Z[p * NV + k], px = x0 + i * G, py = y0 + j * G;
      pos[k * 3] = Cx + (px - N / 2) * (D - z) / F; pos[k * 3 + 1] = Cy - (py - N / 2) * (D - z) / F; pos[k * 3 + 2] = z;
      mk[k] = PART[k] === p || (i > 0 && PART[k - 1] === p) || (i < gw - 1 && PART[k + 1] === p) || (j > 0 && PART[k - gw] === p) || (j < gh - 1 && PART[k + gw] === p) ? 1 : 0; }
    const idx = [], ok = (a, b, c) => (al[a] | al[b] | al[c]) > 0 && (mk[a] | mk[b] | mk[c]) > 0;
    for (let j = 0; j < gh - 1; j++) for (let i = 0; i < gw - 1; i++) { const a = j * gw + i, b = a + 1, c = a + gw, d = c + 1; if (ok(a, c, b)) idx.push(a, c, b); if (ok(b, c, d)) idx.push(b, c, d); }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("uv", new THREE.BufferAttribute(uv, 2)); g.setIndex(idx); geos.push(g); }
  // 商品の材質：消灯 A と点灯 B を、電球の位置から開く光の円で切り替える。光の計算はしない＝画素は写真のまま。映り込みは床に近いほど濃く、上ほど消える
  const VS = "varying vec2 vUv; varying float vY; void main(){ vUv = uv; vY = position.y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }";
  const FS = `uniform sampler2D A; uniform sampler2D B; uniform sampler2D Pt; uniform float me; uniform vec3 circ; uniform float aspect; uniform float refl; uniform float alpha; varying vec2 vUv; varying float vY;
    void main(){ if (abs(texture2D(Pt, vUv).r * 255.0 / 50.0 - me) > 0.5) discard;
      vec4 a = texture2D(A, vUv), b = texture2D(B, vUv);
      float dd = length((vUv - circ.xy) * vec2(aspect, 1.0)); float m = circ.z > 0.0 ? 1.0 - smoothstep(circ.z - 0.12, circ.z, dd) : 0.0;
      vec4 c = mix(a, b, m); float al = c.a * alpha * (refl > 0.5 ? (1.0 - smoothstep(0.0, 0.75, vY)) : 1.0); if (al < 0.01) discard;

  const BULB = [(J.axis_px - x0) / W, 1 - (436 - y0) / H];   // 電球（傘の下の縁の真ん中）＝光の円の中心
  const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(FOV, 1080 / 1920, 0.05, 80);

  const glowTex = radial(THREE, [[0, "rgba(255,206,150,0.55)"], [0.35, "rgba(242,165,74,0.18)"], [1, "rgba(242,165,74,0)"]]);

    // 影（足もと3つと下の広い影）・後ろの光・床の光・光の筋（上・下）
    const shadows = Object.values(J.feet).map(([fx, , fz]) => { const s = plane(shadowTex, 0.28, 0.28, false); s.rotation.x = -Math.PI / 2; s.position.set(fx, FLOORY + 0.001, fz); s.renderOrder = 1; grp.add(s); return s; });
    const wide = plane(shadowTex, 1.1, 1.1, false); wide.rotation.x = -Math.PI / 2; wide.position.set(0, FLOORY + 0.001, 0); wide.renderOrder = 1; wide.material.opacity = 0.55; grp.add(wide);

    const pool = plane(glowTex, 2.6, 2.6, true); pool.rotation.x = -Math.PI / 2; pool.position.set(0, FLOORY + 0.002, 0.05); pool.renderOrder = 1; grp.add(pool);
    const up = plane(ftex, 1.7, 1.5, true); up.position.set(0, J.shade.top_y + 0.75, -0.05); up.renderOrder = 3; grp.add(up);
    const dn = plane(ftex, 1.1, J.shade.bot_y - FLOORY, true); dn.rotation.z = Math.PI; dn.position.set(0, (J.shade.bot_y + FLOORY) / 2, -0.06); dn.renderOrder = 3; grp.add(dn);
    grp.position.x = x; sc.add(grp);

  };

  const rd = new THREE.WebGLRenderer({ canvas: $("gl"), alpha: true, antialias: true, preserveDrawingBuffer: true });
  rd.setPixelRatio(1); rd.setSize(1080, 1920, false); rd.outputColorSpace = THREE.SRGBColorSpace; rd.toneMapping = THREE.NoToneMapping;
  Object.assign(T3, { THREE, rd, sc, cam, floor, L, J, ok: true });
});
// 商品の上の点（m・ブラウンの置き場所の座標）を、今のカメラで画面の px に
const projPx = (x, y, z) => { const w = new T3.THREE.Vector3(x, y, z).project(T3.cam); return [(w.x + 1) * 540, (1 - w.y) * 960]; };
const STATE = { brown: { circ: -1 }, white: { circ: -1 }, beam: { up: 0, dn: 0 }, cover: 0 };   // 場面の側が毎コマ書く。cover＝差し込みの寄りが画面を覆う割合（1 なら 3D の商品は見えない）
const draw3 = (t, productOnly = false) => {
  const s = shotAt(t), cam = T3.cam, a = Math.atan2(T3.J.cam[0], T3.J.cam[2]) + (s.th * Math.PI) / 180;
  cam.position.set(s.ax + s.r * Math.sin(a), s.h, s.r * Math.cos(a)); cam.lookAt(s.ax, s.ay, 0);
  cam.setViewOffset(1080, 1920, 540 - s.cx, 960 - s.cy, 1080, 1920); cam.updateMatrixWorld();

    it.grp.visible = (id === "brown" || t > s5.t1 - 0.1) && STATE.cover < 0.999;   // 白い型は S6 から。寄りが画面を覆い切っている間は描かない（見えない商品を点検が「字と重なる」と数えた）
    it.back.material.opacity = 0.85 * Lt; it.pool.material.opacity = 0.75 * Lt;

  const rd = T3.rd; rd.setClearColor(C.ground, productOnly ? 0 : 1); rd.clear(); rd.render(T3.sc, cam);

};
// 点検（ovl.mjs）の「写真の層」：商品だけを透明の地に描き直す（床・影・光・映り込みは写真ではない）

// 差し込みの寄り（2D の切り抜き・#world の中＝商品の層）。x, y, 幅は画面の px
const insert = (src, w, h, backdrop) => { const e = document.createElement("div"); e.className = "m"; if (backdrop) e.dataset.backdrop = "1";

{

  { const n = note(c1.note, 1290, -1, cut - 0.2); n.style.width = "360px"; }
  const hide = insert("", 1080, 1920); hide.innerHTML = ""; hide.style.background = "var(--ground)"; hide.dataset.backdrop = "1";   // 寄りの間は 3D のランプを隠す（2本に見えた）

  U.push(() => { const t = T(); calm(head, s5.t0 + 0.12, s5.t1 - 0.3); calm(sub, s5.t0 + 0.3, s5.t1 - 0.28);
    if (!T3.ok) return;
    const f = T3.J.feet.L, q = 0.55, [x, y] = projPx(0.02 + (f[0] - 0.02) * q, 1.2 + (f[1] - 1.2) * q, 0.02 + (f[2] - 0.02) * q);   // 前の左の脚の中ほど（付け根から 55%）

// =====================================================================

  const pill = cta.firstElementChild, shine = pill.firstElementChild;
  const tap = el("div", { class: "abs", style: "left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,244,226,.9);box-shadow:0 0 0 6px rgba(255,244,226,.28),0 8px 24px rgba(0,0,0,.4);opacity:0" });

    ring.setAttribute("rx", f2(rb.height / 2 + gw)); ring.setAttribute("opacity", t >= ev("under") ? (0.7 * (1 - ru)).toFixed(3) : 0); });
}
