<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- 実物だけの型（real・#370）：オーナー「今の動画は偽物感が凄くある」→ 商品を 3DCG で作るのをやめる（#366 の例外を取り下げ）。
     商品＝販売ページの実物の写真（切り抜き・細部の切り出し。画素は描き変えない）／場面＝本物の映像（Pexels・商用可・連番のコマ p/<key>/fv/）。
     切り抜きを映像の中に合成しない（光が合わず偽物に見える・E-048 と同じ理由）＝映像は全画面、商品は白い台（#stage）の上に実物の写真として置く。
     流れ：S1 つかみ（映像＋台の上の実物）→ S2 証拠の数字（映像の上）→ S3〜S5 細部の実写真 → S6 評価（映像の上）→ S7 実物と行動。
     時刻は timing.json（window.TIMELINE）の events、文字は設計書（window.PRODUCT）。すべての値は時刻 T の関数（タイマー・乱数なし） -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts2/fonts.css">
<script src="edge_tokens.js"></script>
<script src="motionkit.js"></script>
<script src="stagekit.js"></script>
<style>
  :root { --ground:#F4F5F7; --ink:#111A2E; --dim:#525B6E; --acc:#14284B; --hot:#B5390A; --line:#14284B; }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#0B1220; }
  body { position:relative; color:var(--ink); font-family:"Noto Sans JP",sans-serif; font-feature-settings:"palt" 1; }
  /* 映像は #bg の中（重なりの点検では字にも商品にも数えない＝背景） */
  #bg, #world, #prodlayer, #ui, #stage, #tone, #grain { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  #bg { overflow:hidden; background:#0B1220; }
  #bg img { position:absolute; left:0; top:0; width:1080px; height:1920px; display:block; transform-origin:50% 45%; }
  #tone { pointer-events:none; }
  #stage { top:0; background:var(--ground); box-shadow:0 -1px 0 rgba(17,26,46,.18), 0 -30px 60px rgba(11,18,32,.18); overflow:hidden; }
  #prodlayer { overflow:hidden; pointer-events:none; }
  #over { position:absolute; left:0; top:0; }
  #grain { pointer-events:none; mix-blend-mode:overlay; opacity:.16; background-size:512px 512px; }
  #hdr { position:absolute; left:0; top:0; width:1080px; height:150px; background:var(--ground); pointer-events:none; }
  #hdr i { position:absolute; left:0; top:144px; width:1080px; height:6px; background:var(--line); }
  .ln { position:absolute; overflow:hidden; white-space:nowrap; padding:.12em .22em .22em 0; margin:-.12em -.22em -.22em 0; visibility:hidden; }
  .ln > .in { display:block; }
  .num { font-family:"Noto Sans JP"; font-weight:300; font-feature-settings:"tnum" 1, "palt" 0; letter-spacing:-.03em; }
  .note { position:absolute; left:64px; width:520px; font:400 24px/1.45 "Noto Sans JP"; color:var(--dim); opacity:0; }
  .note.w { color:#E9EDF5; }
  .plate { position:absolute; background:var(--acc); color:#fff; white-space:nowrap; padding:8px 16px 10px; font:500 26px/1 "Noto Sans JP"; letter-spacing:.06em; opacity:0; }
  .pill { position:absolute; padding:12px 24px; border:2px solid var(--ink); border-radius:999px; font:500 28px/1 "Noto Sans JP"; color:var(--ink); white-space:nowrap; opacity:0; }
  .card { position:absolute; overflow:hidden; border-radius:18px; box-shadow:0 30px 60px rgba(17,26,46,.20), 0 2px 0 rgba(255,255,255,.6) inset; background:#E9EBEF; opacity:0; }
  .card img { position:absolute; left:0; top:0; display:block; transform-origin:50% 50%; }
  #cut, #cut2, #cut3 { position:absolute; display:none; filter:drop-shadow(0 26px 30px rgba(17,26,46,.22)); }   /* 初期は隠す（置き場が決まるまで見せない） */
  #pr { position:absolute; left:64px; top:176px; font:700 24px/1 "Noto Sans JP"; color:#fff; border:2px solid var(--ink); border-radius:6px; padding:5px 12px; letter-spacing:.08em; background:var(--ink); z-index:3; }
  #credit { position:absolute; left:156px; top:178px; font:500 20px/1 "Noto Sans JP"; letter-spacing:.04em; color:#fff; background:rgba(17,26,46,.72); padding:6px 10px; border-radius:6px; z-index:3; }
</style></head>
<body>
<div id="bg"><img id="fa" alt=""><img id="fb" alt=""><div id="tone"></div></div>
<div id="world"></div>
<div id="stage" class="scrim"><svg id="warm" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;left:0;top:0"></svg></div>
<div id="prodlayer" class="prod"></div>
<svg id="over" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="hdr" class="scrim"><i></i></div>
<div id="ui"><div id="pr">PR</div></div>
<div id="grain" class="scrim"></div>
<script>
const TL = window.TIMELINE, P = window.PRODUCT, { clamp, lerp } = EDGE, { el, sv, ln, reveal, note, $ } = SK;
const E = Object.assign({}, EDGE.E, { inOutSine: (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x)), outCubic: (x) => 1 - Math.pow(1 - clamp(x), 3), outBack: (x) => { x = clamp(x); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); } });
const ev = (id) => { const e = TL.events.find((x) => x.id === id); if (!e) throw new Error(`timing.json に出来事 ${id} が無い`); return e.t; };
const COPY = Object.fromEntries(P.beats.map((b) => [b.kind, b])), S = Object.fromEntries(TL.scenes.map((s) => [s.id, s]));
const DIR = `p/${P.product_key}/`, U = SK.U, T = () => SK.T, pad = (i) => String(i).padStart(4, "0");
const s1 = S.S1, s2 = S.S2, s3 = S.S3, s4 = S.S4, s5 = S.S5, s6 = S.S6, s7 = S.S7;
{ const vv = /^voicevox:([^/]+)/.exec((P.prep && P.prep.voice) || ""); if (vv) { const c = document.createElement("div"); c.id = "credit"; c.textContent = `VOICEVOX:${vv[1]}`; document.body.appendChild(c); } }
const TF = () => Math.round(T() * 60) / 60, WAITS = [];
const show = (im, src) => { if (im.getAttribute("src") !== src) { im.setAttribute("src", src); WAITS.push(im.decode().catch(() => {})); } };
const INK = "#111A2E", ACC = "#14284B", HOT = "#D9480F";

// ---------- 映像（本物・30コマ/秒の連番）。場面ごとの映像と、切れ目の溶かし ----------
// clip：[名前, 始まる秒, コマ数, 画面の中での置き方（下へずらす px・寄りの中心）]
const XF = 0.4, CLIPS = [["a", 0, 108, { dy: -150, ox: "40%", oy: "42%" }, s1.t0, s2.t0 + XF], ["b", s2.t0, 168, { dy: 0, ox: "50%", oy: "38%" }, s2.t0, s3.t0 + 0.3], ["c", s6.t0 - 0.35, 96, { dy: 60, ox: "45%", oy: "35%" }, s6.t0 - 0.35, s7.t0 + 0.3]];
const fa = $("fa"), fb = $("fb"), tone = $("tone");
const clipAt = (c, t) => `${DIR}fv/${c[0]}_${pad(Math.min(c[2] - 1, Math.max(0, Math.floor((t - c[1]) * 30 + 1e-6))))}.jpg`;
const place = (im, c, t) => { const u = clamp((t - c[4]) / (c[5] - c[4])), z = 1 + 0.06 * u; im.style.transformOrigin = `${c[3].ox} ${c[3].oy}`; im.style.transform = `translateY(${c[3].dy}px) scale(${z.toFixed(4)})`; };
U.push(() => { const t = T(), live = CLIPS.filter((c) => t >= c[4] && t < c[5]);
  const A = live[0], B = live[1];
  fa.style.display = A ? "block" : "none"; fb.style.display = B ? "block" : "none";
  if (A) { show(fa, clipAt(A, t)); place(fa, A, t); fa.style.opacity = 1; }
  if (B) { show(fb, clipAt(B, t)); place(fb, B, t); fb.style.opacity = E.inOutSine((t - B[4]) / XF).toFixed(3); }
  // 色：S2 は冷たい青 → 「8℃→20℃」で暖かい色へ（本物の映像の色を寄せるだけ）。S2・S6 の下は字の地として暗くする
  const g = E.inOutCubic((t - ev("hachi")) / (ev("nijuu") - ev("hachi"))), in2 = clamp((t - s2.t0) / XF) * (1 - clamp((t - (s3.t0 - 0.1)) / 0.3)), in6 = clamp((t - (s6.t0 - 0.1)) / 0.4) * (1 - clamp((t - (s7.t0 - 0.1)) / 0.3));
  const cold = in2 * (1 - g) * 0.20, warm = in2 * g * 0.24 + in6 * 0.08, dark = Math.max(in2, in6);   // 冷たさは薄く（0.34 では映像が紺の板になった＝暗さは高級ではない）
  tone.style.background = `linear-gradient(180deg, rgba(11,18,32,0) 0px, rgba(11,18,32,0) 800px, rgba(11,18,32,${(0.66 * dark).toFixed(3)}) 1040px, rgba(11,18,32,${(0.70 * dark).toFixed(3)}) 1920px), linear-gradient(rgba(36,84,170,${cold.toFixed(3)}), rgba(36,84,170,${cold.toFixed(3)})), linear-gradient(rgba(255,150,60,${warm.toFixed(3)}), rgba(255,150,60,${warm.toFixed(3)}))`; });

// ---------- 白い台（#stage）：上の辺の位置 Y(t)。S1＝下の台／S2＝無し／S3〜S5＝全面／S6＝無し／S7＝全面 ----------
const Y1 = 1010, MV = 0.5, mv = (t, t0, a, b) => lerp(a, b, E.inOutCubic((t - t0) / MV));
const stageY = (t) => t < s2.t0 - 0.05 ? Y1 : t < s3.t0 - 0.25 ? mv(t, s2.t0 - 0.05, Y1, 1920) : t < s6.t0 - 0.2 ? mv(t, s3.t0 - 0.25, 1920, 150) : t < s7.t0 - 0.25 ? mv(t, s6.t0 - 0.2, 150, 1920) : mv(t, s7.t0 - 0.25, 1920, 150);
const stage = $("stage");
U.push(() => { const y = stageY(T()); stage.style.top = y.toFixed(2) + "px"; stage.style.height = (1920 - y).toFixed(2) + "px"; stage.style.display = y < 1919 ? "block" : "none"; $("warm").style.top = (-y).toFixed(2) + "px"; });
// 粒子：512px の素を、コマごとに決まった位置へずらす（乱数なし）
{ const g = $("grain"); g.style.backgroundImage = `url(${DIR}img/grain.png)`; U.push(() => { const f = Math.floor(T() * 30 + 1e-6); g.style.backgroundPosition = `${(f * 193) % 512}px ${(f * 331) % 512}px`; }); }

// ---------- 字の道具 ----------
const line = (style, html, tin, tout, d = 0.9, track = [0.14, 0.04]) => { const e = ln(style, html); U.push(() => { reveal(e, tin, tout, d, 0.22);
  if (track) e.firstElementChild.style.letterSpacing = lerp(track[0], track[1], E.outCubic((T() - tin) / 1.4)).toFixed(3) + "em"; }); return e; };
const fade = (e, tin, tout, d = 0.35) => U.push(() => { const t = T(), a = clamp((t - tin) / d) * (1 - clamp((t - tout) / 0.22)); e.style.opacity = a.toFixed(3); e.style.visibility = a > 0.001 ? "visible" : "hidden"; });
const vis = (e, a) => { e.style.opacity = a.toFixed(3); e.style.display = a > 0.001 ? "inline" : "none"; };
const prod = $("prodlayer");
// 実物の切り抜き（販売ページの写真）。置き場は場面ごと：[x, 下端 y, 高さ]
const CUT_AR = 666 / 1224, cut = el("img", { id: "cut", src: `${DIR}img/cut.png`, alt: "" }, "", prod);
const putCut = (im, x, bottom, h, a = 1) => { im.style.height = h.toFixed(1) + "px"; im.style.width = (h * CUT_AR).toFixed(1) + "px"; im.style.left = x.toFixed(1) + "px"; im.style.top = (bottom - h).toFixed(1) + "px"; im.style.opacity = a.toFixed(3); im.style.display = a > 0.001 ? "block" : "none"; };
// 細部の写真のカード（横から入って、次のカードに押されて出る）
const card = (src, x, y, w, h, iw, ih, tin, tout) => { const c = el("div", { class: "card", style: `left:${x}px;top:${y}px;width:${w}px;height:${h}px` }, `<img src="${DIR}img/${src}" style="width:${iw}px;height:${ih}px;left:${(w - iw) / 2}px;top:${(h - ih) / 2}px">`, prod);
  U.push(() => { const t = T(), a = E.outCubic((t - tin) / 0.55), o = E.inCubic((t - tout) / 0.35), k = clamp((t - tin) / (tout - tin + 0.35));
    c.style.opacity = (clamp((t - tin) / 0.2) * (1 - clamp((t - tout) / 0.35))).toFixed(3); c.style.display = t >= tin && t < tout + 0.36 ? "block" : "none";
    c.style.transform = `translateX(${((1 - a) * 260 - o * 320).toFixed(2)}px) rotate(${((1 - a) * 2.4).toFixed(3)}deg)`;
    c.firstElementChild.style.transform = `scale(${(1.24 - 0.22 * k).toFixed(4)})`; }); return c; };
const kicker = (txt, y, tin, tout) => line(`left:64px;top:${y}px;font:500 26px/1 'Noto Sans JP';color:var(--dim)`, txt, tin, tout, 0.7, [0.3, 0.16]);
const NOTE_Y = 1330;

// ---------- S1：つかみ。上は本物の映像（静かな部屋）・下の台に実物。暖かさの輪が台に広がる ----------
{ const c = COPY.S1, out = s1.t1 - 0.3;
  const pl = el("div", { class: "plate", style: "left:64px;top:232px" }, `${c.brand}<span style="opacity:.6">　―　</span>${c.series}`); fade(pl, -1, out, 0.01);
  line(`left:64px;top:${Y1 + 40}px;font:400 24px/1 'Noto Sans JP';color:var(--dim)`, P.target.who, -1, out, 0.01, [0.1, 0.06]);
  line(`left:64px;top:${Y1 + 84}px;font:900 66px/1.15 'Noto Sans JP'`, c.hook, 0.1, out, 0.8, [0.1, 0.0]);
  line(`left:64px;top:${Y1 + 172}px;font:900 66px/1.15 'Noto Sans JP';color:var(--acc)`, c.hook2, ev("hook2") - 0.05, out, 0.8, [0.1, 0.0]);
  const ul = sv("line", { x1: 64, x2: 64, y1: Y1 + 262, y2: Y1 + 262, stroke: HOT, "stroke-width": 6, "stroke-linecap": "round" });
  line(`left:64px;top:${Y1 + 288}px;font:500 34px/1 'Noto Sans JP'`, c.spec, ev("hook2") + 0.35, out, 0.8, [0.1, 0.02]);
  const n = note(c.note, Y1 + 344, -1, out);
  // 暖かさの輪（台の地に広がる・図）
  const rings = Array.from({ length: 3 }, () => sv("circle", { cx: 834, cy: 1500, fill: "none", stroke: "#F2A765" }, $("warm")));
  U.push(() => { const t = T(), o = 1 - clamp((t - out) / 0.22), u = E.outCubic((t - (ev("hook2") + 0.05)) / 0.5); ul.setAttribute("x2", (64 + 528 * u).toFixed(1)); ul.style.opacity = (u > 0 ? o : 0).toFixed(3);
    rings.forEach((r, k) => { const a = (t - ev("hook2") - k * 0.42) / 1.6, v = a >= 0 && a < 1; r.setAttribute("r", (160 + 560 * E.outCubic(a)).toFixed(1)); r.setAttribute("stroke-width", (26 * (1 - a)).toFixed(2)); r.style.opacity = (v ? 0.5 * (1 - a) * o : 0).toFixed(3); });
    // 実物：1コマ目から台の上に居る。少し下から上がって止まる。台と一緒に下へ退場
    // ★置き場は毎コマ、時刻だけで決める（S7 と1か所にまとめた）。「ある時刻より前だけ更新」にすると、途中の時刻から描き始めた区間で初期状態の写真が残った（4つに分けて描く本描画で S4〜S6 に余計な実物が出た）
    const rise = 46 * (1 - E.outCubic((t + 0.25) / 0.9)), y = stageY(t);
    if (t < s7.t0 - 0.3) putCut(cut, 606, 1890 + rise + (y - Y1), 880, t < s2.t0 + 0.5 ? 1 : 0);
    else { const a = E.outCubic((t - (s7.t0 + 0.05)) / 0.7), k = t - s7.t0; putCut(cut, 486 + (1 - a) * 60 + 16 * k, 1400 + (y - 150) + 10 * k, 1020 + 14 * k, clamp((t - (s7.t0 - 0.05)) / 0.3)); } }); }

// ---------- S2：証拠の数字（自社試験 8畳・30分・8℃→20℃）。窓の外は雪の映像・色が冷→暖へ ----------
{ const c = COPY.S2, out = s2.t1 - 0.3, tin = Math.max(s2.t0 + 0.35, ev("test") - 0.05), W = "#FFFFFF";
  const pl = el("div", { class: "plate", style: "left:64px;top:900px;background:#fff;color:#111A2E" }, c.label); fade(pl, tin, out);
  line(`left:64px;top:972px;font-size:104px;line-height:1;color:${W}`, `<span class="num">${c.room.replace("畳", "")}</span><span style="font:700 46px/1 'Noto Sans JP';margin-left:6px">畳</span>`, tin + 0.15, out, 0.8, null);
  const cx = 420, cyy = 1030, R = 62, trk = sv("circle", { cx, cy: cyy, r: R, fill: "none", stroke: "rgba(255,255,255,.35)", "stroke-width": 6 }), arc = sv("circle", { cx, cy: cyy, r: R, fill: "none", stroke: "#fff", "stroke-width": 8, "stroke-linecap": "round", transform: `rotate(-90 ${cx} ${cyy})`, "stroke-dasharray": `0 ${2 * Math.PI * R}` });
  const mins = el("div", { style: `position:absolute;left:${cx - 60}px;top:${cyy - 24}px;width:120px;text-align:center;white-space:nowrap;color:${W}` }, `<span class="num" style="font-size:46px;line-height:1;font-weight:400">${c.mins}</span><span style="font:700 24px/1 'Noto Sans JP';margin-left:2px">分</span>`);
  fade(mins, ev("sanjuu") - 0.1, out);
  const big = line(`left:64px;top:1092px;font-size:216px;line-height:1;color:${W}`, `<span class="num" style="font-weight:400">${c.from}</span><span style="font:700 84px/1 'Noto Sans JP';margin-left:10px">℃</span>`, ev("hachi") - 0.3, out, 0.7, null);
  line(`left:560px;top:1226px;font:500 36px/1 'Noto Sans JP';color:${W}`, `${c.from}℃ → ${c.to}℃`, ev("nijuu") + 0.05, out, 0.8, [0.2, 0.06]);
  const n = note(c.note, 1356, tin, out); n.classList.add("w"); n.style.width = "836px";
  U.push(() => { const t = T(), a = clamp((t - (ev("sanjuu") - 0.15)) / 0.3) * (1 - clamp((t - out) / 0.22)), u = E.inOutSine((t - ev("sanjuu")) / 1.1), C = 2 * Math.PI * R, f = TF(), from = +c.from, to = +c.to;
    for (const e of [trk, arc]) e.style.opacity = a.toFixed(3); arc.setAttribute("stroke-dasharray", `${(C * u).toFixed(2)} ${C.toFixed(2)}`);
    big.querySelector(".num").textContent = String(Math.round(from + (to - from) * E.inOutCubic((f - ev("hachi")) / (ev("nijuu") - ev("hachi"))))); }); }

// ---------- S3〜S4 の下：台の上の実物（下半分を空けない・オーナー指摘「下が空く」）。S3 は全身、S4 は帯の下へ下がる ----------
{ const c3 = el("img", { id: "cut2", src: `${DIR}img/cut.png`, alt: "" }, "", prod), tin = s3.t0 - 0.1, out = s5.t0 - 0.1;
  U.push(() => { const t = T(), a = E.outCubic((t - tin) / 0.7), d = E.inOutCubic((t - (s4.t0 - 0.2)) / 0.6), o = E.inCubic((t - out) / 0.35);
    const k = t - s3.t0, h = 940 + 9 * k; putCut(c3, 640 - 20 * k + o * 560, 1900 + (1 - a) * 420 + d * 250 + 9 * k, h, t >= tin && t < out + 0.36 ? 1 : 0); }); }

// ---------- S3：フィン（実物の寄りの写真）・15か所の穴・表面 約80℃ ----------
{ const c = COPY.S3, tin = s3.t0 + 0.2, out = s3.t1 - 0.3;
  card("fin.jpg", 64, 250, 560, 470, 560, 470, tin - 0.1, out);
  line(`left:644px;top:296px;font:700 36px/1 'Noto Sans JP'`, c.pre, ev("hachijuu") - 0.4, out, 0.7, [0.1, 0.02]);
  const big = line(`left:636px;top:350px;font-size:170px;line-height:1;color:var(--hot)`, `<span class="num" style="font-weight:400">0</span><span style="font:700 56px/1 'Noto Sans JP';margin-left:4px">${c.unit}</span>`, ev("hachijuu") - 0.35, out, 0.7, null);
  U.push(() => { big.querySelector(".num").textContent = String(Math.round(+c.big * E.inOutCubic((TF() - (ev("hachijuu") - 0.3)) / 0.7))); });
  kicker(c.head, 764, tin + 0.1, out);
  line(`left:64px;top:810px;font:900 56px/1.15 'Noto Sans JP'`, c.sub, ev("ana") - 0.1, out, 0.8, [0.1, 0.0]);
  const n = note(c.note, 906, tin, out); n.style.width = "400px"; }

// ---------- S4：タイマー（実物の写真）・24時間を 15分ずつ＝96コマの帯が順に点く ----------
{ const c = COPY.S4, tin = s4.t0 + 0.1, out = s4.t1 - 0.3;
  card("timer.jpg", 64, 250, 952, 511, 952, 511, tin - 0.05, out);
  kicker("タイマー", 806, tin + 0.1, out);
  line(`left:64px;top:852px;font:900 84px/1.15 'Noto Sans JP'`, c.head, tin + 0.15, out, 0.8, [0.1, 0.0]);
  line(`left:64px;top:974px;font:500 40px/1 'Noto Sans JP';color:var(--acc)`, c.sub, ev("pin") - 0.1, out, 0.8, [0.1, 0.02]);
  // 24時間の帯（96コマ）。6〜9時と 18〜23時が点く例（図）
