<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>UGREEN v2 style guide</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="edge_tokens.js"></script>
<style>
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { background:#F5F6F8; color:#1E2027; font-family:"Noto Sans JP",sans-serif; position:relative; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(#E8EAEF 1px,transparent 1px),linear-gradient(90deg,#E8EAEF 1px,transparent 1px); background-size:40px 40px; }
  h1 { position:absolute; left:64px; top:60px; margin:0; font:300 64px/1 "Noto Sans JP"; letter-spacing:.02em; }
  h2 { margin:0 0 18px; font:500 26px/1 "Noto Sans JP"; color:#5A5F6E; letter-spacing:.14em; }
  .sec { position:absolute; left:64px; width:952px; }
  .sw { display:inline-block; width:146px; margin-right:12px; vertical-align:top; }
  .sw i { display:block; height:110px; border-radius:6px; border:1px solid #D6D9E0; }
  .sw b { display:block; font:500 22px/1.3 "Noto Sans JP"; margin-top:10px; }
  .sw span { display:block; font:400 18px/1.35 "Noto Sans JP"; color:#5A5F6E; }
  .ty div { margin-bottom:14px; }
</style></head>
<body>
<div class="grid"></div>
<h1>UGREEN Air — 一本の線</h1>
<div class="sec" style="top:150px"><h2>PALETTE（6色・実物から採色／地に対するコントラスト）</h2><div id="pal"></div></div>
<div class="sec ty" style="top:430px"><h2>TYPE（Noto Sans JP のみ・ローカル固定）</h2>
  <div style="font:300 180px/1 'Noto Sans JP';font-feature-settings:'tnum';color:#7C5E2E">8.6<span style="font-size:72px">mm</span></div>
  <div style="font:700 64px/1.2 'Noto Sans JP'">置くだけで、最大15W。</div>
  <div style="font:500 44px/1.3 'Noto Sans JP'">ポケットにも、スッと。</div>
  <div style="font:400 24px/1.4 'Noto Sans JP';color:#5A5F6E">※注記 24px・地の板つき（4.5:1 以上）</div>
</div>
<div class="sec" style="top:910px"><h2>LINE（THE LINE 4px・製図の矢印・輪・目盛り）</h2><svg id="lines" width="952" height="220"></svg></div>
<div class="sec" style="top:1170px"><h2>MOTION（イージング：直線を使わない）</h2><svg id="ease" width="952" height="300"></svg></div>
<div class="sec" style="top:1520px"><h2>SAFE AREA（大事な文字の置き場 x64–900・y170–1520）</h2>
  <svg width="952" height="300"><rect x="0" y="0" width="169" height="300" fill="none" stroke="#5A5F6E" stroke-dasharray="6 6"/><g id="safe"></g></svg></div>
<script>
const { C, E } = EDGE;
// コントラスト（WCAG）
const L = (h) => { const v = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4))); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
const cr = (a, b) => { const x = L(a), y = L(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const roles = { ground: "地（写真の背景）", grid: "方眼", ink: "線・文字", graphite: "補助・注記", lav: "本体（面だけ）", bronze: "要の数字" };
document.getElementById("pal").innerHTML = Object.entries(C).map(([k, v]) => `<div class="sw"><i style="background:${v}"></i><b>${roles[k]}</b><span>${v}<br>${k === "ground" ? "—" : cr(v, C.ground).toFixed(1) + ":1"}</span></div>`).join("");
// 線の見本
const s = document.getElementById("lines");
s.innerHTML = `<line x1="0" y1="40" x2="420" y2="40" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>
<text x="0" y="90" fill="${C.graphite}" font-size="20">THE LINE 4px（ink）</text>
<g transform="translate(470,20)" stroke="${C.ink}" stroke-width="2"><line x1="0" y1="0" x2="0" y2="80"/><line x1="-14" y1="0" x2="14" y2="0"/><line x1="-14" y1="80" x2="14" y2="80"/><path d="M-7 12 L0 0 L7 12 M-7 68 L0 80 L7 68" fill="none"/></g>
<text x="500" y="70" fill="${C.bronze}" font-size="40" font-weight="300">8.6mm</text>
<circle cx="780" cy="100" r="80" fill="none" stroke="${C.ink}" stroke-width="4"/><circle cx="780" cy="100" r="80" fill="none" stroke="${C.bronze}" stroke-width="10" stroke-dasharray="${2 * Math.PI * 80 * 0.66} 999" transform="rotate(-90 780 100)"/>
<rect x="0" y="150" width="420" height="14" rx="7" fill="none" stroke="${C.ink}" stroke-width="2"/><rect x="2" y="152" width="${416 * 0.62}" height="10" rx="5" fill="${C.bronze}"/>`;
// イージング曲線
const ez = document.getElementById("ease"), names = [["outExpo", "入場"], ["outQuart", "ペン先"], ["inCubic", "退場（速い）"], ["inOutCubic", "カメラ"], ["spring", "着地のばね"], ["anticip", "予備動作"]];
ez.innerHTML = names.map(([n, j], i) => { const x0 = (i % 3) * 318, y0 = Math.floor(i / 3) * 150, w = 280, h = 100;
  let d = ""; for (let k = 0; k <= 60; k++) { const x = k / 60, y = E[n](x); d += `${k ? "L" : "M"}${(x0 + x * w).toFixed(1)} ${(y0 + 110 - y * h).toFixed(1)} `; }
  return `<rect x="${x0}" y="${y0 + 10}" width="${w}" height="${h}" fill="none" stroke="${C.grid}"/><path d="${d}" fill="none" stroke="${C.bronze}" stroke-width="3"/><text x="${x0}" y="${y0 + 140}" fill="${C.graphite}" font-size="20">${n} — ${j}</text>`; }).join("");
// セーフ領域（縮尺 0.15625＝1080→169）
document.getElementById("safe").innerHTML = `<rect x="${64 * 0.15625}" y="${170 * 0.15625}" width="${(900 - 64) * 0.15625}" height="${(1520 - 170) * 0.15625}" fill="rgba(124,94,46,.15)" stroke="${C.bronze}"/>
<text x="200" y="40" fill="${C.ink}" font-size="22">1080×1920 を 0.156 倍。銅の枠＝大事な文字の置き場</text>
<text x="200" y="80" fill="${C.graphite}" font-size="20">右の操作列（x≥900）・下の説明文（y≥1520）・左上 LIVE 印（y<170）を避ける</text>
<text x="200" y="130" fill="${C.graphite}" font-size="20">質感：40px の方眼（#E8EAEF）だけ。地は公式写真の背景 #F5F6F8。粒子・故障・過剰なグラデは使わない</text>`;
window.READY = document.fonts.ready;
</script>
</body></html>
