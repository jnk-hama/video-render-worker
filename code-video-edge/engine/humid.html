<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- SwitchBot 気化式加湿器（#335）。r6：オーナー「没入感が少ない／リアルなリビングをコードで／ブラウンは汚い」。
     S2（昼）と S4（夜）は Blender Cycles で描いた 3D のリビング（cycles_room.py・本物の素材は Poly Haven CC0・#337）。色は茶色を使わず、生成りの白・柿色・夜の紺。
     時刻は timing.json（window.TIMELINE）の events、文字は設計書（window.PRODUCT）。すべての値は時刻 T の関数（タイマー・乱数なし）。
     #world＝3D の部屋／#over＝線と図（重なり検査の対象外）／.prod＝実写真／#ui＝文字 -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts2/fonts.css">
<script src="edge_tokens.js"></script>
<script src="motionkit.js"></script>
<script src="stagekit.js"></script>
<style>
  :root { --ground:#FBF7F1; --ink:#26272B; --graphite:#66625E; --acc:#C8412A; --plan:#C8412A; --night:#161B2A; --moon:#FFE3BC; }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--ground); }
  body { position:relative; color:var(--ink); font-family:"Noto Sans JP",sans-serif; font-feature-settings:"palt" 1; }
  .abs { position:absolute; }
  #bg { position:absolute; inset:0; background:var(--ground); }
  #world, #prodlayer, #ui { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  #over { position:absolute; left:0; top:0; }
  .plate { position:absolute; overflow:hidden; border-radius:22px; box-shadow:0 28px 56px rgba(30,32,38,.14), 0 0 0 1px rgba(30,32,38,.06); }
  .plate img, .bare img { display:block; width:100%; height:100%; }
  .bare { position:absolute; }
  .ln { position:absolute; overflow:hidden; white-space:nowrap; padding:.12em .22em .22em 0; margin:-.12em -.22em -.22em 0; visibility:hidden; }
  .ln > .in { display:block; }
  .num { font-weight:300; font-feature-settings:"tnum" 1, "palt" 0; letter-spacing:-.01em; }
  .note { position:absolute; left:64px; width:836px; font:400 24px/1.45 "Noto Sans JP"; color:var(--graphite); opacity:0; }
  .note.w { color:#FFFFFF; }
  .note.k { color:var(--ink); }
  #pr { position:absolute; left:64px; top:176px; font:700 24px/1 "Noto Sans JP"; color:var(--ink); border:2px solid var(--ink); border-radius:6px; padding:5px 12px; letter-spacing:.08em; background:var(--ground); z-index:3; }
  #credit { position:absolute; left:156px; top:184px; font:500 20px/1 "Noto Sans JP"; letter-spacing:.04em; opacity:.5; color:var(--ink); z-index:3; }
</style></head>
<body>
<div id="bg"></div>
<div id="world"></div>
<div id="prodlayer" class="prod"></div>
<svg id="over" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="ui"><div id="pr">PR</div></div>
<script>
const TL = window.TIMELINE, P = window.PRODUCT, { E, clamp, lerp, breathe } = EDGE, { el, sv, ln, reveal, note, f2, $ } = SK;
const ev = (id) => { const e = TL.events.find((x) => x.id === id); if (!e) throw new Error(`timing.json に出来事 ${id} が無い`); return e.t; };
const COPY = Object.fromEntries(P.beats.map((b) => [b.kind, b])), S = Object.fromEntries(TL.scenes.map((s) => [s.id, s]));
const DIR = "p/switchbot-humid/", U = SK.U, T = () => SK.T;
const photo = (src, x, y, w, h, cls, origin) => SK.photo(DIR, src, x, y, w, h, cls, origin);
// r13（#343・21人会議「本体が一度も本物の部屋で生きて映っていない」・オーナー「コード動画は無料で」）：
//   販売ページの実写真を、Actions で推定した奥行き（Depth Anything V2 Small・Apache-2.0）でずらし、カメラが寄る・回り込む映像にする。
//   写真は描き変えない（画素を奥行きに応じて少し動かすだけ）。動きは小さく（大きいと縁が伸びる）。値は時刻の関数＝毎回同じ。
//   画素ごとに「この画素はどこから来たか」を奥行きで8回たどる（近い物ほど大きく動く＝本物の視差）
//   ★ブラウザの中で毎コマ計算すると（CPU の WebGL）、画面全体の描画まで遅くなり 3,500秒で打ち切られた（r13 の1回目）。
//     そこで 3D の部屋と同じ形にした：カメラの式はここ1か所 → DEPTH_JOBS で一覧を書き出す → factory/depthwarp.py が1コマずつ JPEG に → ここは差し替えて見せるだけ
const DEPTH = {};   // 名前 → { ph, a, b, cam(u) → [dx, dy, zoom, focus] }
const depthPlate = (ph, name, a, b, cam) => {   // a〜b 秒の間を 30コマ/秒の連番で見せる。dx・dy：写真の幅に対するカメラのずれ／zoom：寄り／focus：動かない奥行き（0＝奥・1＝手前）
  DEPTH[name] = { ph, a, b, cam };
  const im = el("img", { class: "dp", style: "position:absolute;left:0;top:0;width:100%;height:100%;display:block" }, "", ph);
  return (t) => { const n = Math.ceil((b - a) * FPS3D) + 1, i = Math.max(0, Math.min(n - 1, Math.floor((t - a) * FPS3D + 1e-6))), src = `${DIR}dp/${name}_${String(i).padStart(4, "0")}.jpg`;
    if (im.getAttribute("src") !== src) { im.setAttribute("src", src); WAITS.push(im.decode().catch(() => {})); } };
};
window.DEPTH_JOBS = () => Object.fromEntries(Object.entries(DEPTH).map(([name, d]) => { const n = Math.ceil((d.b - d.a) * FPS3D) + 1;
  return [name, Array.from({ length: n }, (_, i) => { const [dx, dy, zoom, focus] = d.cam(clamp(i / (n - 1)));
    return { src: `${name}.png`, depth: `${name}_d.png`, w: parseInt(d.ph.style.width), h: parseInt(d.ph.style.height), dx, dy, zoom, focus, out: `${name}_${String(i).padStart(4, "0")}.jpg` }; })]; }));
const C = { ground: "#FBF7F1", ink: "#26272B", acc: "#C8412A", plan: "#C8412A", night: "#161B2A", moon: "#FFE3BC", white: "#FFFFFF" };
// #308 VOICEVOX の声は規約で「VOICEVOX:話者名」の記載が条件（オーナー「表記は小さく透過」）。PR の札の右
{ const vv = /^voicevox:([^/]+)/.exec((P.prep && P.prep.voice) || ""); if (vv) { const c = document.createElement("div"); c.id = "credit"; c.textContent = `VOICEVOX:${vv[1]}`; document.body.appendChild(c); } }
// 地の色：場面ごと（転換の覆いが満ちきった所で地を替える＝覆いの下で切り替わる）
const groundAt = (t) => (t < S.S3.t0 ? C.ground : t < S.S4.t0 ? C.plan : t < S.S5.t0 ? C.night : C.ground);   // S2・S4 は 3D の部屋が地を覆う（S2 の PR の札は明るい地）
const inkAt = (t) => (t >= S.S3.t0 && t < S.S5.t0 ? C.white : C.ink);   // S2 は明るい天井の上＝濃い字
U.push(() => { const t = T(), g = groundAt(t); $("bg").style.background = g; $("pr").style.background = g; $("pr").style.color = $("pr").style.borderColor = inkAt(t); const cr = $("credit"); if (cr) cr.style.color = inkAt(t); });
const cover = SK.coverLayer();
// 3D のリビング（#337）：Blender Cycles で描いた連番の絵（cycles_room.py・30コマ/秒）を1枚ずつ差し替える。
//   絵の中身（カメラの動き）はこの下の CAM が決め、CYCLES_JOBS で描く側へ渡す＝カメラの決め所は1か所
const FPS3D = 30;
const room3d = el("img", { id: "room3d", class: "m", "data-backdrop": "1", style: "position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0" }, "", $("world"));
const mistCv = el("canvas", { class: "m", "data-backdrop": "1", width: 1080, height: 1920, style: "position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0" }, "", $("world"));
// 撮影の粒子（フィルムグレイン）：3D の場面だけ、本物のカメラの映像に近いごく弱いざらつき。種つきの模様4枚をコマごとに替える（乱数なし）
const GRAIN = Array.from({ length: 4 }, (_, k) => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), im = g.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const x = Math.sin((i + 1) * 12.9898 + (k + 1) * 78.233) * 43758.5453, v = 128 + ((x - Math.floor(x)) - 0.5) * 120; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); return c.toDataURL(); });
const grain = el("div", { class: "m", "data-backdrop": "1", style: "position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;mix-blend-mode:overlay;background-size:256px 256px" }, "", $("world"));
// r12（#342・7人会議「前半の部屋と後半のカードが別の作品に見える」・オーナー「もっともっとグラフィックへの没入感」）：
//   後半（S5〜S8）も同じリビングの中。Cycles で描いた同じ部屋を、ピントをカメラのすぐ前に置いて大きくぼかした4枚（bk5〜bk8・cycles_room.py は変えない）。
//   場面ごとに向きが変わり、ゆっくり寄る。字の下には曇りガラスの板を置く（字は忙しい絵の上に載せない・#341）。
//   絵は露出を上げて明るく、上の幕は薄く（生成りの幕を厚くすると灰色がかったベージュ＝茶色に寄った・r12 の試し描き）
const BK = ["S5", "S6", "S7", "S8"].map((id, k) => el("img", { class: "m", "data-backdrop": "1", src: `${DIR}cy/bk${k + 5}.png`, style: "position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;transform-origin:50% 45%;filter:brightness(1.22) saturate(1.08)" }, "", $("world")));
const bkVeil = el("div", { class: "m", "data-backdrop": "1", style: "position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;background:rgba(255,249,240,.22)" }, "", $("world"));
U.push(() => { const t = T(); let any = 0;
  BK.forEach((im, k) => { const s = S[["S5", "S6", "S7", "S8"][k]], a = clamp((t - (s.t0 - 0.3)) / 0.35) * (k === 3 ? 1 : 1 - clamp((t - (s.t1 - 0.05)) / 0.35));
    im.style.opacity = a.toFixed(3); any = Math.max(any, a);
    im.style.transform = `translate(${f2(-14 * E.inOutCubic((t - s.t0) / (s.t1 - s.t0)))}px,0) scale(${(1.08 - 0.06 * E.inOutCubic((t - (s.t0 - 0.3)) / (s.t1 - s.t0 + 0.3))).toFixed(4)})`; });
  bkVeil.style.opacity = any.toFixed(3); });
// 曇りガラスの板（字の下だけ）：地の色を 84% ＋背景を 18px ぼかす。場面の頭で少し下から上がる
const glass = (sid, x, y, w, h, tIn = 0, tOut = 0, alpha = 0.84) => { const e = el("div", { class: "m", "data-backdrop": "1", style: `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:36px;background:rgba(251,247,241,${alpha});backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.65);box-shadow:0 22px 50px rgba(30,32,38,.10);opacity:0` }, "", $("world"));
  U.push(() => { const t = T(), s = S[sid], a = clamp((t - (s.t0 + tIn - 0.15)) / 0.3) * (sid === "S8" ? 1 : 1 - clamp((t - (s.t1 - 0.28 + tOut)) / 0.22));
    e.style.opacity = a.toFixed(3); e.style.transform = `translateY(${f2((1 - E.outExpo((t - (s.t0 + tIn - 0.15)) / 0.5)) * 40)}px)`; }); return e; };
const NOTEBAR = ["S5", "S6", "S7", "S8"].map((sid) => glass(sid, 40, 1416, 1000, 118, 0, 0.3, 0.93));   // ※の帯：※より後まで残し、濃くする（r12 の点検で ※ が 4.3:1・帯が先に消えていた）
const WAITS = [];   // 差し替えた絵の読み込み待ち（seek がこれを返す＝撮る前に必ず絵が出ている）。3D の部屋と奥行きの写真の両方
const roomShow = (src) => { if (room3d.getAttribute("src") !== src) { room3d.setAttribute("src", src); WAITS.push(room3d.decode().catch(() => {})); } };

// =====================================================================
// S1 BEFORE→AFTER（#339・会議の結論）：同じ部屋・同じカメラで、乾いた冬の朝（加湿の前）→ 暖かい部屋（後）。光だけが変わる。
//   1コマ目から販売ページの写真（本体のあるリビング）を札で見せ（#303・「1コマ目に商品」）、問いかけ「冬の乾燥、気になる？」から入る。
//   後の絵は S2 の最初のコマ（day_0000）と同じ物＝S1 の終わりから S2 の動きへ切れ目なくつながる。部屋は CG（※に書く）
//   r10（#340）：21畳は S2 へ移した（750ml/h の「だから」として見せる）。S1 は問いかけと前→後だけ
// =====================================================================
const ROOM = { w: 1230, h: 684 };   // 販売ページの写真の画素
{
  const c = COPY.S1, s = S.S1, hand = s.t1 - 0.4;   // hand＝S2 の動く絵へ渡す時刻
  const cold = el("img", { class: "m", "data-backdrop": "1", src: `${DIR}cy/cold_0000.png`, style: "position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 55%" }, "", $("world"));
  const warm = el("img", { class: "m", "data-backdrop": "1", src: `${DIR}cy/day_0000.png`, style: "position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;transform-origin:50% 55%" }, "", $("world"));
  // r12（#342・トップクリエイター「1コマ目は字が先に出ているだけで動きが弱い」）：窓から差す冷たい光の筋が2本、ゆっくり横へ動く。暖まると消える（光だけ・#339）
  const beams = [0, 1].map((k) => el("div", { class: "m", "data-backdrop": "1", style: `position:absolute;left:-200px;top:0;width:1480px;height:1920px;opacity:0;mix-blend-mode:screen;background:linear-gradient(${104 + k * 7}deg, rgba(190,215,255,0) ${38 + k * 14}%, rgba(205,226,255,.55) ${44 + k * 14}%, rgba(190,215,255,0) ${50 + k * 14}%)` }, "", $("world")));
  const veil = el("div", { class: "abs m", "data-backdrop": "1", style: "left:0;top:0;width:1080px;height:1920px;background:linear-gradient(to bottom, var(--ground) 0, var(--ground) 33%, rgba(251,247,241,0) 45%, rgba(251,247,241,0) 70%, rgba(251,247,241,.82) 76%, rgba(251,247,241,.82) 81%, rgba(251,247,241,0) 87%)" }, "", $("world"));   // 上の字の下は地の色そのもの（透かすと 4.5:1 を割った・r9）＋※の下だけ明るい帯（暗い冬の床の上で ※ が 2.0:1 だった）
  const W = 952, H = Math.round((ROOM.h / ROOM.w) * W), PY = 1430 - H;
  const ph = photo("sb/room.png", 64, PY, W, H, "plate");   // 販売ページの写真（描き変えない・回さない #304）
  const room = depthPlate(ph, "room", 0, s.t1, (u) => { u = E.inOutCubic(u); return [lerp(-0.018, 0.018, u), 0.004, 1.06 + 0.04 * u, 0.35]; });   // r13：横へ回り込む（部屋の奥が手前より遅く動く）
  const hk1 = ln("left:64px;top:300px;font:700 132px/1.12 'Noto Sans JP';color:var(--acc)", c.hook);
  const hk2 = ln("left:64px;top:452px;font:700 132px/1.12 'Noto Sans JP';color:var(--acc)", c.hook2);
  note(c.note, 1486, -1, s.t1 - 0.45, "note k");
  U.push(() => {
    const t = T(), wv = ev("warm"), k = (1.05 - 0.05 * E.inOutCubic(clamp(t / hand))).toFixed(4);   // ゆっくり引いて、渡す時にちょうど 1.0
    const on = t < hand + 0.4;
    cold.style.opacity = on ? 1 : 0; warm.style.opacity = on ? E.inOutCubic(clamp((t - wv) / Math.min(0.9, s.t1 - wv))).toFixed(3) : 0;   // 「気になる？」の終わりから S2 の頭までに暖まる
    cold.style.transform = warm.style.transform = `scale(${k})`;
    if (t < s.t1 + 0.1) room(t);
    beams.forEach((b, i) => { b.style.opacity = on ? ((0.55 - 0.15 * i) * (1 - E.inOutCubic((t - wv) / 0.7))).toFixed(3) : 0; b.style.transform = `translateX(${f2((i ? -1 : 1) * 30 + 70 * Math.sin(0.9 * t + i * 2))}px)`; });
    veil.style.opacity = t < hand ? 1 : (1 - clamp((t - hand) / 0.4)).toFixed(3);
    ph.style.opacity = (1 - clamp((t - (hand - 0.35)) / 0.3)).toFixed(3); ph.style.transform = `translateY(${f2(1.5 * Math.sin(t * 1.6) + 60 * E.inCubic(clamp((t - (hand - 0.35)) / 0.3)))}px)`;
    reveal(hk1, -0.8, s.t1 - 0.45); reveal(hk2, -0.7, s.t1 - 0.42);
  });
}

// =====================================================================
// S2 ROOM：Cycles で描いた 3D のリビング（昼）。画面の左の外（壁ぎわの加湿器）から湿りの粒が部屋じゅうへ広がる。「750」で 750ml/h
//   オーナー「没入感が少ない／リアルなリビングをコードで」（r6）。部屋は CG のイメージ（※に書く）。商品は 3D にしない（#068）
// =====================================================================
const TANK = { x: 120, y: 660, w: 300, h: 560, r: 36 };
// 500ml のペットボトルの線画（100×258 の箱）。S2 の「1本半」と S3 の「9本」で同じ形＝同じ物差し（#340・数字は換算だけ）
const BOTTLE = { w: 100, h: 258, body: "M38 18 L38 40 C38 55 10 60 10 85 L10 240 Q10 258 28 258 L72 258 Q90 258 90 240 L90 85 C90 60 62 55 62 40 L62 18 Z", cap: "M34 0 H66 V18 H34 Z" };
let bottleN = 0;
const bottle = (x, y, k, stroke, water) => {   // 線と水（水位 0〜1）。水は胴の形で切る
  const g = sv("g", { opacity: 0 }), id = `btl${bottleN++}`, gi = sv("g", { transform: `translate(${x} ${y}) scale(${k})` }, g);   // 外＝出入りの動き（CSS）・内＝置き場所（CSS の transform が SVG の transform を上書きするので分ける）
  sv("path", { d: BOTTLE.body }, sv("clipPath", { id }, sv("defs", {}, gi)));
  const w = sv("rect", { x: 0, width: BOTTLE.w, fill: water, "clip-path": `url(#${id})` }, gi);
  sv("path", { d: BOTTLE.body, fill: "none", stroke, "stroke-width": 4 / k, "stroke-linejoin": "round" }, gi); sv("path", { d: BOTTLE.cap, fill: stroke }, gi);
  return { g, level: (u) => { const top = 40 + (BOTTLE.h - 40) * (1 - clamp(u)); w.setAttribute("y", f2(top)); w.setAttribute("height", f2(BOTTLE.h - top)); } };
};   // S3 のタンクの外形（右に暦と判子を置くため左へ）
// カメラ：昼はソファと窓へゆっくり寄る／夜は低く、ランプと窓の方へ（同じ部屋を別の角度で＝#302 の「同じ場面にしない」）
//   手持ちのごく小さな揺れ（数ミリ・周期の違う正弦波の和＝乱数なし）を足す：三脚で止めた CG らしさを消す
const sway = (t, k) => [0.004 * Math.sin(1.7 * t + k) + 0.002 * Math.sin(4.3 * t + 2 * k), 0.003 * Math.sin(2.3 * t + 3 * k) + 0.0015 * Math.sin(5.9 * t + k), 0.003 * Math.sin(1.3 * t + 5 * k)];
const CAM = {
  day: (u, t) => { const w = sway(t, 0.3); return { cam: [1.25 - 0.35 * u + w[0], 1.05 - 0.04 * u + w[1], -0.8 - 0.25 * u + w[2]], look: [-1.9, 0.6, -3.65], fov: 62 }; },   // ソファと日だまりの両方が入る向き（#338）
  night: (u, t) => { const w = sway(t, 1.1); return { cam: [0.7 - 0.25 * u + w[0], 0.95 + w[1], -0.9 - 0.2 * u + w[2]], look: [-2.6, 1.2, -3.6], fov: 56 }; },   // 少し見上げる＝ランプの光が大きな字（18dB）の下に来る
};
const SPAN = () => ({ day: [S.S1.t1 - 0.4, S.S2.t1], night: [S.S4.t0, S.S4.t1] });
const SWAY0 = { day: 2.6, night: 9.5 };   // 揺れの位相の起点（r8 で描いた絵と同じ。S1 の長さが変わってもカメラの一覧を変えない）
const camAt = (mode, i) => { const [a, b] = SPAN()[mode], t = a + i / FPS3D; return CAM[mode](clamp((t - a) / (b - a)), SWAY0[mode] + i / FPS3D); };
// 描く側（cycles_room.py --frames）へ渡すコマの一覧：{ day: [{cam, look, fov, out}], night: [...] }

// S5 WASH：丸洗いの実写真＋チェック（輪が描かれ、中にチェックが描かれる）

  const txt = ln(`left:${x + 80}px;top:${y - 2}px;font:700 64px/1.2 'Noto Sans JP'`, text);
  U.push(() => { const t = T(), r = E.outQuart((t - tAt) / 0.3), k = E.outQuart((t - tAt - 0.18) / 0.22), o = t >= tAt ? (1 - clamp((t - tOut) / 0.2)).toFixed(3) : 0;
    ring.setAttribute("stroke-dashoffset", f2(164 * (1 - r))); tick.setAttribute("stroke-dashoffset", f2(40 * (1 - k))); ring.setAttribute("opacity", o); tick.setAttribute("opacity", o);

{

// S6 SMART：アプリを持つ手の実写真。「アプリ」「声」の札、「水切れを通知」で鈴の印が揺れる

{

  // r12（#342 コピーライター「アプリ・声・で操作の順に出て文として読みにくい」）：1行のかたまり「［アプリ］と［声］で操作」。札は墨色の線（柿色は縁の光と通知の印に譲る）

  const parts = [...row.children], partAt = () => [ev("app"), ev("koe") - 0.12, ev("koe"), ev("koe") + 0.12];
  // r11（#341・60fps の Opal / Uber の縁の光・toast）：「アプリ」で写真の縁を柿色の光が一周する。光は写真の外側だけ（写真の上に色を載せない）
  const glow = el("div", { class: "m", "data-backdrop": "1", style: `position:absolute;left:${X - 9}px;top:${Y - 9}px;width:${W + 18}px;height:${Hh + 18}px;box-sizing:border-box;padding:7px;border-radius:30px;opacity:0;filter:blur(1.5px);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude` }, "", $("world"));

  const toast = el("div", { class: "abs", style: "left:64px;top:1210px;width:952px;height:136px;box-sizing:border-box;border-radius:32px;background:#FFFFFF;box-shadow:0 20px 44px rgba(30,32,38,.14),0 0 0 1px rgba(30,32,38,.06);opacity:0" });
  const icon = el("div", { class: "abs", style: "left:28px;top:30px;width:76px;height:76px;border-radius:20px;background:var(--acc)" }, `<svg width="76" height="76" viewBox="-38 -38 76 76"><path d="M-14 9 Q-14 -14 0 -16 Q14 -14 14 9 L18 14 L-18 14 Z M-5 18 Q0 23 5 18" fill="#FFFFFF"/></svg>`, toast);
  const sub = el("div", { class: "abs", style: "left:132px;top:40px;font:700 52px/1.1 'Noto Sans JP';color:var(--ink)" }, c.sub, toast);

    const pa = partAt(); parts.forEach((e, i) => { const k = MK.cd(t - pa[i], 22); e.style.opacity = t >= pa[i] ? (1 - clamp((t - (s.t1 - 0.35)) / 0.2)).toFixed(3) : 0; e.style.transform = `translateY(${f2((1 - k) * 24)}px) scale(${(0.85 + 0.15 * k).toFixed(4)})`; });
    const ap = t - ev("app"), go = t >= ev("app") ? clamp(ap / 0.25) * (1 - clamp((ap - 1.0) / 0.4)) * (1 - clamp(out * 1.5)) : 0;   // 縁の光：1.1秒で1周して消える（通知の印と柿色を2つ同時に出さない・#342）

    const u = t - ev("tsuchi"), sp = E.spring(u);   // 着地のばね（行き過ぎ 1.5%・弾ませない #334）
    toast.style.opacity = t >= ev("tsuchi") - 0.02 ? (clamp(u / 0.12) * (1 - clamp((t - (s.t1 - 0.3)) / 0.2))).toFixed(3) : 0;
    toast.style.transform = `translateY(${f2((1 - sp) * -36)}px)`;   // 降りる途中も写真（下端 y＝1152）に重ねない（r11 の点検で 17.50秒に重なった）
    icon.firstElementChild.style.transform = `rotate(${f2(u > 0 ? 18 * Math.exp(-u * 5) * Math.sin(u * 22) : 0)}deg)`; });

// S7 PROOF：星5つの輪郭を「評価は」で描き、「4.55」で 4.55 まで満ちる（取得日つき）

{
  const c = COPY.S7, s = S.S7, val = parseFloat(c.score), SZ = 150, X0 = 64, Y = 760;   // 星も左 64 の線に揃える（数字と字は左なのに星だけ中央だった・#342）

  const star = "M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9 6.2 20.1l1.4-6.4L2.7 9.3l6.5-.7z";

    const ol = sv("path", { d: star, fill: "none", stroke: C.acc, "stroke-width": 1, pathLength: 1, "stroke-dasharray": 1, opacity: 0 }, sv("g", { transform: `translate(${x} ${Y}) scale(${SZ / 24})` }, SG));
    const wrap = sv("g", { "clip-path": `url(#sc${i})` }, SG), fl = sv("path", { d: star, fill: C.acc, opacity: 0 }, sv("g", { transform: `translate(${x} ${Y}) scale(${SZ / 24})` }, wrap));
    return { x, ol, fl, cr };
  });
  // r11（#341・motionin の Apple Keynote の数字の場面）：数字は星が満ちるのと同じ時間で 0.00 から数え上がる（桁の幅は揃える＝揺れない）
  const big = ln("left:64px;top:330px;font-size:250px;line-height:1", `<span class="num">${c.score}</span>`), bigN = big.firstElementChild.firstElementChild;

    const dr = E.inOutCubic((t - ev("hyoka")) / Math.max(0.3, ev("star") - ev("hyoka"))), fillU = E.inOutCubic((t - ev("star")) / 0.45) * val;

  glass("S8", 100, 1030, 880, 370, ev("name") - s.t0);

  const sweep = el("div", { style: "position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(105deg, rgba(255,250,240,0) 35%, rgba(255,250,240,.5) 50%, rgba(255,250,240,0) 65%);background-size:300% 100%" }, "", ph);
  const ctr = "left:0;width:1080px;text-align:center;";

  const name = el("div", { class: "abs", style: ctr + "top:1046px;font:700 132px/1.15 'Noto Sans JP'" }, [...c.head].map((ch) => `<span style="display:inline-block">${ch}</span>`).join(""));
  const sub = ln(ctr + "top:1204px;font:500 44px/1.2 'Noto Sans JP'", c.sub);
  // 「詳しくはリンクから」は押せる形の札（cta.gallery）：柿色の丸い札＋白い丸の矢印。「リンク」で押されて沈み、波紋が広がる

    ph.style.opacity = clamp((t - (s.t0 - 0.05)) / 0.2).toFixed(3);

    sweep.style.backgroundPosition = `${f2(130 - 160 * E.inOutCubic((t - (s.t0 + 0.35)) / 0.9))}% 0`;
