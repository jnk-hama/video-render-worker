<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- ART WORK STUDIO Espresso フロアランプ（台本は works/aws-espresso/TREATMENT.md）。
     夜の紺の地に、販売ページの実写真を横いっぱいの帯で置き、奥行きで動かす（#343 の depthPlate・写真は描き変えない）。
     転換はすべて「光」：S2 と S6 と S8 はシェードから広がる光の円、他は暖かい光の幕が通る（lemo-opuscar DIRECTOR §8：転換は媒体の中で1つの文法に）。
     時刻は timing.json（window.TIMELINE）の events、文字は設計書（window.PRODUCT）。すべての値は時刻 T の関数（タイマー・乱数なし）。
     .prod＝実写真（重なり検査で「商品」側）／#ui＝文字／.scrim＝光の覆い（重なり検査の対象外） -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts2/fonts.css">
<script src="edge_tokens.js"></script>
<script src="motionkit.js"></script>
<script src="stagekit.js"></script>
<style>
  :root { --ground:#12151D; --ink:#FFF4E2; --dim:#A9A398; --acc:#F2A54A; }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--ground); }
  body { position:relative; color:var(--ink); font-family:"Noto Sans JP",sans-serif; font-feature-settings:"palt" 1; }
  .abs { position:absolute; }
  #bg { position:absolute; inset:0; background:var(--ground); }
  #world, #prodlayer, #ui { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  #over { position:absolute; left:0; top:0; }
  .band { position:absolute; overflow:hidden; }
  .band > img, .band > svg { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  /* r4（オーナー「画面の下 1/4 が空く」を直す）：帯の下に、磨いた床に映ったような薄い映り込み。字は置かない（安全域の外） */
  .band.refl { -webkit-box-reflect: below 92px linear-gradient(to bottom, rgba(0,0,0,0) 52%, rgba(0,0,0,.30)); }
  .ln { position:absolute; overflow:hidden; white-space:nowrap; padding:.12em .22em .22em 0; margin:-.12em -.22em -.22em 0; visibility:hidden; }
  .ln > .in { display:block; }
  .num { font-weight:300; font-feature-settings:"tnum" 1, "palt" 0; letter-spacing:-.01em; }
  .note { position:absolute; left:64px; width:836px; font:400 24px/1.45 "Noto Sans JP"; color:var(--dim); opacity:0; }
  #pr { position:absolute; left:64px; top:176px; font:700 24px/1 "Noto Sans JP"; color:var(--ink); border:2px solid var(--ink); border-radius:6px; padding:5px 12px; letter-spacing:.08em; background:var(--ground); z-index:3; }
  #credit { position:absolute; left:156px; top:184px; font:500 20px/1 "Noto Sans JP"; letter-spacing:.04em; opacity:.5; color:var(--ink); z-index:3; }
</style></head>
<body>
<div id="bg"></div>
<div id="world"></div>
<div id="prodlayer" class="prod"></div>
<svg id="over" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="ui"><div id="pr">PR</div></div>
<script>
const TL = window.TIMELINE, P = window.PRODUCT, { E, clamp, lerp } = EDGE, { el, sv, ln, reveal, note, f2, $ } = SK;
const ev = (id) => { const e = TL.events.find((x) => x.id === id); if (!e) throw new Error(`timing.json に出来事 ${id} が無い`); return e.t; };
const COPY = Object.fromEntries(P.beats.map((b) => [b.kind, b])), S = Object.fromEntries(TL.scenes.map((s) => [s.id, s]));
const DIR = "p/aws-espresso/", U = SK.U, T = () => SK.T, FPS3D = 30, NS = SK.NS;
const C = { ground: "#12151D", ink: "#FFF4E2", acc: "#F2A54A" };
// #308 VOICEVOX の声は規約で「VOICEVOX:話者名」の記載が条件（オーナー「表記は小さく透過」）。PR の札の右
{ const vv = /^voicevox:([^/]+)/.exec((P.prep && P.prep.voice) || ""); if (vv) { const c = document.createElement("div"); c.id = "credit"; c.textContent = `VOICEVOX:${vv[1]}`; document.body.appendChild(c); } }

// 写真の帯（横いっぱい）：販売ページの写真を 1080×890 に切った物（sb/）。字は帯の上と下の地に置き、写真に重ねない
const PL = { x: 0, y: 540, w: 1080, h: 850 };   // r8：890→850（字の置き場の下端 1440・#352）
const band = (src, g = PL) => SK.photo(DIR, src, g.x, g.y, g.w, g.h, g === PL ? "band refl" : "band");
// カメラ：帯の中の絵（写真・奥行きの連番・線の図）を同じ式で動かす。k＝寄り、(ox,oy)＝寄る中心（帯の中の画素）、ty＝縦のずれ
const camCSS = (ph, k, ox, oy, ty = 0) => { for (const c of ph.children) { c.style.transformOrigin = `${ox}px ${oy}px`; c.style.transform = `translateY(${f2(ty)}px) scale(${k.toFixed(4)})`; } };
// 奥行きで動かす写真（#343・humid.html と同じ形）：カメラの式はここ → DEPTH_JOBS → factory/depthwarp.py が連番の JPEG に → ここは差し替えて見せるだけ
//   cam(t)：その時刻の [dx, dy, zoom, focus]（時刻で書く＝同じ時刻の2枚（消灯・点灯）が必ず同じカメラになる）
const DEPTH = {}, WAITS = [];   // cam(t) → [dx, dy, zoom, focus, ox, oy]（ox・oy＝寄る中心 0〜1・無ければ真ん中）
const depthPlate = (ph, name, a, b, cam) => {
  DEPTH[name] = { ph, a, b, cam };
  const im = el("img", { class: "dp" }, "", ph);
  return (t) => { const n = Math.ceil((b - a) * FPS3D) + 1, i = Math.max(0, Math.min(n - 1, Math.floor((t - a) * FPS3D + 1e-6))), src = `${DIR}dp/${name}_${String(i).padStart(4, "0")}.jpg`;
    if (im.getAttribute("src") !== src) { im.setAttribute("src", src); WAITS.push(im.decode().catch(() => {})); } };
};
window.DEPTH_JOBS = () => Object.fromEntries(Object.entries(DEPTH).map(([name, d]) => { const n = Math.ceil((d.b - d.a) * FPS3D) + 1;
  return [name, Array.from({ length: n }, (_, i) => { const [dx, dy, zoom, focus, ox = 0.5, oy = 0.5, dolly = 0] = d.cam(d.a + i / FPS3D);
    return { src: `${name}.png`, depth: `${name}_d.png`, w: parseInt(d.ph.style.width), h: parseInt(d.ph.style.height), dx, dy, zoom, focus, ox, oy, dolly, out: `${name}_${String(i).padStart(4, "0")}.jpg` }; })]; }));
// 連番の今のコマの時刻（帯の中の線の図を、写真の連番と同じコマで動かす＝ずれない）
const camT = (name, t) => { const d = DEPTH[name]; return d.a + Math.max(0, Math.min(Math.ceil((d.b - d.a) * FPS3D), Math.floor((t - d.a) * FPS3D + 1e-6))) / FPS3D; };
// 帯の出入り（光の幕の下で入れ替える）
const vis = (ph, a, b, din = 0.16, dout = 0.18) => { ph.style.opacity = (clamp((T() - a) / din) * (1 - clamp((T() - b) / dout))).toFixed(3); };
// 光の円（S2・S6・S8 の山場の文法）：点いた写真をシェードの位置から丸く見せていく。半径は面積で緩める（出だしの数コマが跳ばない・motionkit areaR）。縁は 220px ぼかす
const bloomMask = (ph, cx, cy, t0, d, R) => { const u = (T() - t0) / d;
  if (u <= 0) { ph.style.webkitMaskImage = ph.style.maskImage = "linear-gradient(transparent,transparent)"; return; }
  if (u >= 1) { ph.style.webkitMaskImage = ph.style.maskImage = "none"; return; }
  const r = MK.areaR(u, R, E.inOutCubic), m = `radial-gradient(circle at ${f2(cx)}px ${f2(cy)}px, #000 ${f2(Math.max(0, r - 220))}px, transparent ${f2(r)}px)`;
  ph.style.webkitMaskImage = ph.style.maskImage = m; };
// 光の覆い（字より下・写真より上）。.scrim＝重なり検査の対象外
const scrimDiv = (style) => { const e = el("div", { class: "scrim", style: `position:absolute;pointer-events:none;opacity:0;${style}` }); $("ui").insertBefore(e, $("pr")); return e; };
// シェードから出る光の玉（点灯の瞬間・画面の加算）
const flash = (x, y, size) => scrimDiv(`left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;mix-blend-mode:screen;background:radial-gradient(circle, rgba(255,236,200,1) 0, rgba(255,196,120,.75) 18%, rgba(242,165,74,.25) 42%, rgba(242,165,74,0) 70%)`);
const flashAt = (e, t0, peak = 0.95) => { const u = T() - t0; e.style.opacity = u < 0 ? 0 : (Math.min(1, u / 0.08) * (1 - clamp((u - 0.1) / 0.7)) * peak).toFixed(3); e.style.transform = `scale(${(0.5 + 0.8 * E.outExpo(u / 0.6)).toFixed(4)})`; };
// 暖かい光の幕（場面の切れ目を斜めに通る）：帯の高さだけ。切れ目の 0.3秒前から 0.3秒後まで
const leak = scrimDiv(`left:0;top:${PL.y}px;width:1080px;height:${PL.h}px;mix-blend-mode:screen;background:linear-gradient(112deg, rgba(255,190,110,0) 30%, rgba(255,214,160,.7) 50%, rgba(255,190,110,0) 70%);background-size:300% 100%`);
const CUTS = ["S3", "S4", "S5", "S6"].map((id) => S[id].t0);
U.push(() => { const t = T(), c = CUTS.find((x) => Math.abs(t - x) < 0.32);
  if (c === undefined) { leak.style.opacity = 0; return; }
  const u = (t - (c - 0.32)) / 0.64; leak.style.opacity = Math.sin(Math.PI * clamp(u)).toFixed(3); leak.style.backgroundPosition = `${f2(120 - 140 * E.inOutCubic(u))}% 0`; });
const ctr = "left:0;width:1080px;text-align:center;";
// r5（#348・frontend-design「全部の字に同じ入りの動きを付けない・大胆さは1か所」）：
//   下からすべり上がる入り（reveal）は、作り込む1場面目（S1・#303）だけ。山場の「灯り。」は光が灯る字（下）、締めの名前は1字ずつ。他は静かに 0.18秒で出す
const calm = (e, tin, tout) => { const t = T();
  e.style.visibility = t < tin || t > tout + 0.2 ? "hidden" : "visible"; e.firstElementChild.style.transform = "none";
  e.style.opacity = (clamp((t - tin) / 0.18) * (1 - clamp((t - tout) / 0.18))).toFixed(3); };

// ---------- r3（オーナー「モーショングラフィックス：カメラの動きとトランジション／UIコンポーネント／ランディングページとウェブエフェクト／フォトのルックとライティング」）----------
// フォトのルック：(1) 周辺減光＝帯の縁だけ暗く（真ん中の商品の色は変えない） (2) フィルムの粒＝画面全体にごく弱く（種つき4枚をコマごとに・乱数なし）
//   (3) 光のこぼれ＝点いた写真の時だけ、帯の外の紺の地にシェードの所から暖かい光がにじむ。写真そのものは明るくしない（点灯の効果を盛らない・#068 の線）
const vignette = (ph) => el("div", { style: "position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 78% 74% at 50% 46%, rgba(0,0,0,0) 58%, rgba(8,10,16,.42) 100%)" }, "", ph);
const GRAIN = Array.from({ length: 4 }, (_, k) => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), im = g.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const x = Math.sin((i + 1) * 12.9898 + (k + 1) * 78.233) * 43758.5453, v = 128 + ((x - Math.floor(x)) - 0.5) * 120; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); return c.toDataURL(); });
const grain = scrimDiv("left:0;top:0;width:1080px;height:1920px;mix-blend-mode:overlay;background-size:256px 256px");
U.push(() => { grain.style.backgroundImage = `url(${GRAIN[Math.floor(T() * 24) % 4]})`; grain.style.opacity = 0.09; });
const spill = (x, y, w = 1100, h = 900) => el("div", { class: "m", "data-backdrop": "1", style: `position:absolute;left:${x - w / 2}px;top:${y - h / 2}px;width:${w}px;height:${h}px;opacity:0;background:radial-gradient(ellipse at 50% 50%, rgba(242,165,74,.26), rgba(242,165,74,0) 62%)` }, "", $("world"));
// カメラの光：点灯の瞬間、シェードの高さに横長の光の筋（アナモルフィックの筋）が走って消える
const streak = (x, y) => scrimDiv(`left:0;top:${y - 5}px;width:1080px;height:10px;mix-blend-mode:screen;filter:blur(2px);transform-origin:${x}px 5px;background:linear-gradient(90deg, rgba(255,214,160,0), rgba(255,226,180,.95) ${f2(x / 10.8)}%, rgba(255,214,160,0))`);
const streakAt = (e, t0) => { const u = T() - t0; e.style.opacity = u < 0 ? 0 : (Math.min(1, u / 0.06) * (1 - clamp((u - 0.08) / 0.5))).toFixed(3); e.style.transform = `scaleX(${(0.2 + 1.3 * E.outExpo(u / 0.5)).toFixed(4)})`; };
// カメラの動きとトランジション：切れ目で出ていく帯は左へ流れてぼけ、入る帯は右から流れてピントが合う（スウィッシュ・パン）。光の幕と同じ向き
//   Web の動き：同時に、字の塊と帯が違う速さで上へ流れる（ページを送る時の視差スクロール）
const SCROLL = { text: 72, plate: 26 };
// 床に落ちる灯り（下 1/4）：ランプが点いている間だけ、画面の下に暖かい光だまり。消灯の写真の間（開き・S6 の前半）は消える
const floorGlow = el("div", { class: "m", "data-backdrop": "1", style: "position:absolute;left:-100px;top:1380px;width:1280px;height:640px;opacity:0;background:radial-gradient(ellipse 50% 46% at 50% 62%, rgba(242,165,74,.22), rgba(242,165,74,0) 72%)" }, "", $("world"));
U.push(() => { const t = T(), on1 = E.inOutCubic((t - ev("bloom")) / 0.8), off6 = clamp((t - (S.S6.t0 - 0.3)) / 0.3) * (1 - E.inOutCubic((t - ev("on")) / 0.7));
  floorGlow.style.opacity = (on1 * (1 - off6)).toFixed(3); floorGlow.style.transform = `scaleX(${(1 + 0.03 * Math.sin(t * 0.9)).toFixed(4)})`; });
const move = (ph, s, swish = true) => { const t = T(), i = 1 - E.outExpo((t - (s.t0 - 0.12)) / 0.6), o = E.inCubic((t - (s.t1 - 0.22)) / 0.3);
  const x = swish ? 70 * i - 70 * o : 0, b = swish ? 7 * Math.max(clamp((s.t0 + 0.1 - t) / 0.22), clamp((t - (s.t1 - 0.2)) / 0.25)) : 0;
  ph.style.translate = `${f2(x)}px ${f2(SCROLL.plate * (i - o))}px`; ph.style.filter = b > 0.05 ? `blur(${f2(b)}px)` : "none"; };
const lift = (els, s) => { const t = T(), y = SCROLL.text * ((1 - E.outExpo((t - (s.t0 - 0.05)) / 0.7)) - E.inCubic((t - (s.t1 - 0.3)) / 0.3)); els.forEach((e) => { e.style.translate = `0 ${f2(y)}px`; }); };
// UI の部品：ON/OFF のトグル（S1→S2 と S6）。引き紐の「カチッ」で、つまみが右へ（臨界減衰のばね）・地が琥珀に満ちる
const toggle = (x, y) => { const tr = el("div", { class: "abs", style: `left:${x}px;top:${y}px;width:124px;height:68px;box-sizing:border-box;border-radius:999px;border:3px solid rgba(255,244,226,.6);opacity:0` });
  const fillE = el("div", { style: "position:absolute;inset:-3px;border-radius:999px;background:var(--acc);opacity:0" }, "", tr);
  const knob = el("div", { style: "position:absolute;left:5px;top:5px;width:52px;height:52px;border-radius:50%;background:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.35)" }, "", tr);
  return (tin, ton, tout) => { const t = T(), k = MK.cd(t - ton, 26);
    tr.style.opacity = (clamp((t - tin) / 0.2) * (1 - clamp((t - tout) / 0.2))).toFixed(3); tr.style.transform = `scale(${(0.9 + 0.1 * MK.cd(t - tin, 20)).toFixed(4)})`;
    knob.style.transform = `translateX(${f2(56 * (t >= ton ? k : 0))}px) scale(${(1 - 0.12 * Math.sin(Math.PI * clamp((t - ton + 0.08) / 0.2))).toFixed(4)})`;   // 押す瞬間に少しつぶれる（予備動作）
    fillE.style.opacity = (t >= ton ? k : 0).toFixed(3); tr.style.boxShadow = t >= ton ? `0 0 ${f2(36 * k)}px rgba(242,165,74,${(0.45 * k).toFixed(3)})` : "none"; }; };

// =====================================================================
// S1 HOOK＋S2 BLOOM（この媒体だけの動き）：消灯の部屋へ寄る（寄る中心＝シェード）→ 問い →（静けさ）→ カチッ →
//   シェードから光の円が広がって、同じ構図の点灯の写真が現れる → 引いていく。消灯・点灯は販売ページの対の写真（暗く・明るく加工しない）
// =====================================================================
const SHADE = { x: 798, y: 138, x0: 686, y0: 57, x1: 911, y1: 220 };   // off.png の中のシェード（奥行きの図から測った）
{
  const c1 = COPY.S1, c2 = COPY.S2, s1 = S.S1, s2 = S.S2, tc = ev("bloom"), A = 0, B = s2.t1 + 0.12;
  const off = band("sb/off.png"), pull = band("sb/pull.png"), on = band("sb/on.png");   // 重なり順：消灯 < 手 < 点灯（点灯の光の円が手の上に開く）
  // r6（motion-video-kit「原因 → 結果を見せる」）：問いの終わり（r7：video-shotcraft R3「手の動きは人の速さで」で 0.65→0.95秒）に、寄りの向きのまま引き紐をつまむ手（販売ページ asp19）へ切る。カチッはこの手で鳴る
  const cut = s1.t1 - 0.95, CHAIN = { x: 458, y: 0 };   // 鎖が帯の上の縁から出ていく所＝光の円の中心（原因と結果を同じ画素でつなぐ）
  // 奥行きのカメラ（2枚とも同じ式）：シェードへ 1.0→1.45 まで寄り（問い）、カチッで止まり、光が満ちたら部屋全体まで引く（r2：r1 の CSS の寄り 1.14 は見えなかった・審査）
  //   寄りは写真の元の画素から（depthwarp の ox・oy）＝拡大の甘さが出ない。横は少し回り込む（部屋の奥が遅れて動く）
  const zoomAt = (t) => (t < tc ? 1 + 0.45 * E.inOutCubic(t / tc) : 1.45 - 0.45 * E.inOutCubic((t - tc - 0.45) / (s2.t1 - tc - 0.6)));
  //   ピントの面＝ランプ（奥行き 0.70）：ランプは動かず、奥の壁が流れる。横の回り込みは r2 の半分（大きく寄った所で脚の縁がぎざぎざになった）
  // r8（カメラマン）：寄りと引きは「カメラごと近づく」ドリー（近いソファほど大きくなる・遠近はカメラの位置で決まる）。強さ 0.2＝縁が引きずれない所（0.3 でソファの縁が乱れた）
  const cam = (t) => [lerp(-0.006, 0.006, E.inOutCubic((t - A) / (B - A))), 0.002, zoomAt(t), 0.7, SHADE.x / PL.w, SHADE.y / PL.h, 0.2];
  const dOff = depthPlate(off, "off", A, B, cam), dOn = depthPlate(on, "on", A, B, cam); vignette(off); vignette(on);
  const dPull = depthPlate(pull, "pull", cut - 0.1, tc + 1.0, (t) => [lerp(0.004, -0.004, E.inOutCubic((t - cut) / (tc + 1 - cut))), 0.003, 1.0 + 0.14 * E.outQuart((t - (cut - 0.1)) / 0.8), 0.62, 0.62, 0.72, 0.2]); vignette(pull);   // 寄りの続き（同じ向き）：指先へ
  // 「ランプ」でシェードにピントの括弧が合う（撮影機の AF の印）。帯の中の svg＝カメラと一緒に動く
  const af = document.createElementNS(NS, "svg"); af.setAttribute("viewBox", `0 0 ${PL.w} ${PL.h}`); off.appendChild(af);
  const pad = 22, bx = [SHADE.x0 - pad, SHADE.y0 - pad, SHADE.x1 + pad, SHADE.y1 + pad], L = 42;
  const corners = [[bx[0], bx[1], 1, 1], [bx[2], bx[1], -1, 1], [bx[0], bx[3], 1, -1], [bx[2], bx[3], -1, -1]].map(([x, y, sx, sy]) =>
    sv("path", { d: `M${x} ${y + sy * L} L${x} ${y} L${x + sx * L} ${y}`, fill: "none", stroke: C.acc, "stroke-width": 5, "stroke-linecap": "round", opacity: 0 }, af));
  // 誰に向けた動画か（設計書の target.who）を問いの上に小さく。問いは 112px に詰めて帯の上に収める
  const who = ln("left:64px;top:238px;font:500 34px/1.2 'Noto Sans JP';color:var(--dim)", P.target.who);
