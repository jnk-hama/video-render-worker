     字は DOM（#ui）＝点検 23項目がそのまま読む。点検の「写真の層」は QC_PRODUCT_ONLY で版画だけを描き直して撮る。
     時刻は timing.json（window.TIMELINE）の events、文字は設計書（window.PRODUCT）。すべての値は時刻 T の関数（タイマー・乱数なし） -->

<script>
const TL = window.TIMELINE, P = window.PRODUCT, { E, clamp, lerp } = EDGE, { el, sv, ln, reveal, note, f2, $ } = SK;
const ev = (id) => { const e = TL.events.find((x) => x.id === id); if (!e) throw new Error(`timing.json に出来事 ${id} が無い`); return e.t; };
const COPY = Object.fromEntries(P.beats.map((b) => [b.kind, b])), S = Object.fromEntries(TL.scenes.map((s) => [s.id, s]));
const DIR = "p/aws-espresso/", U = SK.U, T = () => SK.T;
const C = { ground: "#12151D", ink: "#FFF4E2", acc: "#F2A54A" };
// #308 VOICEVOX の声は規約で「VOICEVOX:話者名」の記載が条件（PR の札の右・小さく透過）
{ const vv = /^voicevox:([^/]+)/.exec((P.prep && P.prep.voice) || ""); if (vv) { const c = document.createElement("div"); c.id = "credit"; c.textContent = `VOICEVOX:${vv[1]}`; document.body.appendChild(c); } }
const ctr = "left:0;width:1080px;text-align:center;";
const calm = (e, tin, tout) => { const t = T();
  e.style.visibility = t < tin || t > tout + 0.2 ? "hidden" : "visible"; e.firstElementChild.style.transform = "none";
  e.style.opacity = (clamp((t - tin) / 0.18) * (1 - clamp((t - tout) / 0.18))).toFixed(3); };
const scrimDiv = (style) => { const e = el("div", { class: "scrim", style: `position:absolute;pointer-events:none;opacity:0;${style}` }); $("ui").insertBefore(e, $("pr")); return e; };
// フィルムの粒（種つき4枚をコマごとに・乱数なし）
const GRAIN = Array.from({ length: 4 }, (_, k) => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), im = g.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const x = Math.sin((i + 1) * 12.9898 + (k + 1) * 78.233) * 43758.5453, v = 128 + ((x - Math.floor(x)) - 0.5) * 120; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); return c.toDataURL(); });
const grain = scrimDiv("left:0;top:0;width:1080px;height:1920px;mix-blend-mode:overlay;background-size:256px 256px");
U.push(() => { grain.style.backgroundImage = `url(${GRAIN[Math.floor(T() * 24) % 4]})`; grain.style.opacity = 0.09; });
// UI の部品：ON/OFF のトグル（lamp.html と同じ）
const toggle = (x, y) => { const tr = el("div", { class: "abs", style: `left:${x}px;top:${y}px;width:124px;height:68px;box-sizing:border-box;border-radius:999px;border:3px solid rgba(255,244,226,.6);opacity:0` });
  const fillE = el("div", { style: "position:absolute;inset:-3px;border-radius:999px;background:var(--acc);opacity:0" }, "", tr);
  const knob = el("div", { style: "position:absolute;left:5px;top:5px;width:52px;height:52px;border-radius:50%;background:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.35)" }, "", tr);
  return (tin, ton, tout) => { const t = T(), k = MK.cd(t - ton, 26);
    tr.style.opacity = (clamp((t - tin) / 0.2) * (1 - clamp((t - tout) / 0.2))).toFixed(3); tr.style.transform = `scale(${(0.9 + 0.1 * MK.cd(t - tin, 20)).toFixed(4)})`;
    knob.style.transform = `translateX(${f2(56 * (t >= ton ? k : 0))}px) scale(${(1 - 0.12 * Math.sin(Math.PI * clamp((t - ton + 0.08) / 0.2))).toFixed(4)})`;
    fillE.style.opacity = (t >= ton ? k : 0).toFixed(3); tr.style.boxShadow = t >= ton ? `0 0 ${f2(36 * k)}px rgba(242,165,74,${(0.45 * k).toFixed(3)})` : "none"; }; };

// =====================================================================
// 展示室（3D）：版画の置き場所とカメラ
// =====================================================================
//   単位は m。版画の中心の高さ YC。カメラはいつも -z を向く（正面）＝位置だけで構図を決める
const FOV = 30, TAN = Math.tan((FOV / 2) * Math.PI / 180), YC = 1.75;
const PRINTS = {
  room:  { srcs: ["off", "pull", "on"], w: 3.2, ar: 1081 / 1374, x: 0, z: 0 },
  shade: { srcs: ["shade"], w: 2.9, ar: 944 / 1200, x: 4.8, z: -0.4 },
  linen: { srcs: ["linenv"], w: 2.0, ar: 1070 / 837, x: 8.9, z: -0.2 },
  legs:  { srcs: ["legsv"], w: 1.0, ar: 1070 / 390, x: 11.9, z: -0.5 },
  white: { srcs: ["woff", "won"], w: 3.2, ar: 1081 / 1374, x: 15.6, z: 0 },
  end:   { srcs: ["end"], w: 3.2, ar: 1081 / 1374, x: 20.0, z: 0 } };
for (const p of Object.values(PRINTS)) p.h = p.w * p.ar;
// 構図：版画 id を、画面の高さ hPx（または幅 wPx）で、中心を (cx, cy) に置くカメラの位置
const ppu = (d) => 1920 / (2 * d * TAN);
const frame = (id, { hPx, wPx, cx = 540, cy = 955 }) => { const p = PRINTS[id], d = wPx ? (p.w * 1920) / (wPx * 2 * TAN) : (p.h * 1920) / (hPx * 2 * TAN), k = ppu(d);
  return [p.x - (cx - 540) / k, YC + (cy - 960) / k, p.z + d]; };
// カメラの道：[時刻, 位置]。隣どうしは内外とも緩める（着く時はゆっくり着く・行き過ぎ無し）
// 字の帯の間（上の見出しの下 545・下の注意書きの上 1392）に、額（生成りの余白 0.08m）ごと収まる版画の高さ（px）。寄りの上限はこれ（S1 の寄りで額が見出しにかかった）
const BAND3 = { top: 545, bot: 1392 }, FIT = (id) => (BAND3.bot - BAND3.top) / (1 + 0.16 / PRINTS[id].h), CY = (BAND3.top + BAND3.bot) / 2;
const fit = (id, k = 1) => frame(id, { hPx: FIT(id) * k, cy: CY });
const s1 = S.S1, s2 = S.S2, s3 = S.S3, s4 = S.S4, s5 = S.S5, s6 = S.S6, s7 = S.S7, s8 = S.S8;
const G8 = { x: 75, y: 250, w: 930, h: 732 };
const PUSH8 = 1.04;   // 締めの版画の枠（r9 の硬貨の時刻表・影の面と同じ）
const KEYS = [
  [0, fit("room", 0.86)],                                  // S1：引いた所から（展示室・床の映り込み）問いの間に寄る
  [ev("click") - 0.05, fit("room")],                   // カチッで止まる＝山場の前の静けさ
  [ev("bloom") + 0.5, fit("room")],
  [s2.t1 - 0.4, fit("room", 0.78)],                          // 光が満ちたら引く：光だまりと展示室が見える
  [s3.t0 + 0.35, fit("shade", 0.95)],                        // 次の版画へ滑る（0.6秒前後・ぶれで）
  [s3.t1 - 0.3, fit("shade", 0.97)],
  [s4.t0 + 0.35, fit("linen", 0.94)],
  [s4.t1 - 0.3, fit("linen")],                         // 布へゆっくり寄る（透ける光の細部）
  [s5.t0 + 0.4, frame("legs", { wPx: 700, cx: 760, cy: 960 })],        // 脚の上の端から（左の縦書きの見出しに額を重ねない）
  [s5.t1 - 0.75, frame("legs", { wPx: 700, cx: 760, cy: 960 - 0.12 * 2 * 700 })],   // 下の端まで（カメラごと下がる＝ペデスタル）。次へ移るのは 1.1秒（0.65秒で 35%・0.9秒で 30.3%：大きな脚の版画が流れて 1コマで画面が変わり過ぎた）
  [s6.t0 + 0.35, fit("white", 0.95)],
  [s6.t1 - 0.3, fit("white")],
  [s7.t0 + 0.3, [13.6, YC - 0.84, 30]],                               // 大きく引いて全景（ここまでの版画が1部屋に並ぶ）
  [s7.t1 - 0.3, [13.9, YC - 0.76, 27.5]],   // 版画の列は大きな数字と件数の間（y 約 700〜1020）
  [ev("name") - 0.15, frame("end", { wPx: G8.w, cx: G8.x + G8.w / 2, cy: G8.y + G8.h / 2 })],   // 締めの版画を r9 と同じ枠へ。ここから止める（硬貨が落ちる）
  [TL.end, ((q) => [q[0], q[1], PRINTS.end.z + (q[2] - PRINTS.end.z) / PUSH8])(frame("end", { wPx: G8.w, cx: G8.x + G8.w / 2, cy: G8.y + G8.h / 2 }))]];   // 締めはゆっくり 4% 寄る（止めたままでは 18.4〜19.5秒が止まって見えた）。前へ進むだけ＝画面の中心を軸に大きくなる
const camAt = (t) => { let i = KEYS.findIndex((k) => k[0] > t); if (i === -1) return KEYS.at(-1)[1].slice(); if (i === 0) return KEYS[0][1].slice();
  const [ta, a] = KEYS[i - 1], [tb, b] = KEYS[i], u = E.inOutCubic((t - ta) / (tb - ta));
  const pos = a.map((v, q) => v + (b[q] - v) * u);
  // S3：「上にも」で光を追って上へ・「下にも」で下へ（ペデスタル。向きは正面のまま）
  pos[1] += 0.11 * E.inOutCubic((t - (ev("up") - 0.05)) / 0.55) - 0.22 * E.inOutCubic((t - (ev("down") - 0.05)) / 0.6) + 0.11 * E.inOutCubic((t - (s3.t1 - 0.3)) / 0.5);   // 0.22m では版画の上の縁が副見出しに触れた
  return pos; };
// 床の光だまり・壁の光の強さ（版画ごと）：消灯の版画は弱く、点くと強く
const litAt = (id, t) => id === "room" ? lerp(0.12, 1, E.inOutCubic((t - ev("bloom")) / 0.8)) : id === "white" ? lerp(0.12, 1, E.inOutCubic((t - ev("on")) / 0.7)) : 1;

// ---------- three.js（読み込みが済むまで seek は待つ） ----------
const T3 = {};
const radial = (THREE, c0, c1) => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, c0); r.addColorStop(1, c1); g.fillStyle = r; g.fillRect(0, 0, 256, 256); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx; };
T3.ready = import("./vendor/three.module.min.js").then(async (THREE) => {
  const rd = new THREE.WebGLRenderer({ canvas: $("gl"), alpha: true, antialias: true, preserveDrawingBuffer: true });
  rd.setPixelRatio(1); rd.setSize(1080, 1920, false); rd.outputColorSpace = THREE.SRGBColorSpace; rd.toneMapping = THREE.NoToneMapping; rd.autoClear = false;
  const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(FOV, 1080 / 1920, 0.1, 120);
  const ld = new THREE.TextureLoader(), tex = {};
  for (const n of [...new Set(Object.values(PRINTS).flatMap((p) => p.srcs))]) { const t = await ld.loadAsync(`${DIR}sb/${n}.png`); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; tex[n] = t; }
  // 版画の材質：3枚を混ぜる（A→B の溶け・C を光の円で見せる）。光の計算はしない＝画素は写真のまま。映り込みは下ほど薄く消える
  const VS = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }";
  const FS = `uniform sampler2D A; uniform sampler2D B; uniform sampler2D Cc; uniform float ab; uniform vec3 circ; uniform float feather; uniform float aspect; uniform float alpha; uniform float refl; varying vec2 vUv;
    void main(){ vec4 a = texture2D(A, vUv), b = texture2D(B, vUv), c = texture2D(Cc, vUv); vec3 col = mix(a.rgb, b.rgb, ab);
      float dd = length((vUv - circ.xy) * vec2(aspect, 1.0)); float m = 1.0 - smoothstep(circ.z - feather, circ.z, dd); col = mix(col, c.rgb, circ.z > 0.0 ? m : 0.0);
      float al = alpha * (refl > 0.5 ? (1.0 - smoothstep(0.0, 0.55, vUv.y)) : 1.0);
      gl_FragColor = vec4(col, al);
      #include <colorspace_fragment>
    }`;
  const printMat = (p, refl) => new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: FS, transparent: refl, depthTest: !refl, depthWrite: !refl, side: THREE.DoubleSide,
    uniforms: { A: { value: tex[p.srcs[0]] }, B: { value: tex[p.srcs[1] || p.srcs[0]] }, Cc: { value: tex[p.srcs[2] || p.srcs[1] || p.srcs[0]] }, ab: { value: 0 }, circ: { value: new THREE.Vector3(0, 0, -1) }, feather: { value: 0.18 }, aspect: { value: p.w / p.h }, alpha: { value: refl ? 0.2 : 1 }, refl: { value: refl ? 1 : 0 } } });
  const add = (o, order) => { o.renderOrder = order; sc.add(o); return o; };
  const floor = add(new THREE.Mesh(new THREE.PlaneGeometry(200, 120), new THREE.MeshBasicMaterial({ color: 0x0c0e14, fog: true })), 0); floor.rotation.x = -Math.PI / 2; floor.position.set(10, 0, 0);
  sc.fog = new THREE.Fog(C.ground, 28, 70);
  const poolTex = radial(THREE, "rgba(242,165,74,0.55)", "rgba(242,165,74,0)"), haloTex = radial(THREE, "rgba(255,214,160,0.42)", "rgba(255,214,160,0)");
  const glow = (tx, w, h) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tx, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, fog: false }));
  T3.items = Object.fromEntries(Object.entries(PRINTS).map(([id, p]) => {
    const halo = add(glow(haloTex, p.w * 2.1, p.h * 1.8), 1); halo.position.set(p.x, YC, p.z - 0.05);                                 // 壁の光（版画の後ろ）
    const edge = add(new THREE.Mesh(new THREE.PlaneGeometry(p.w + 0.2, p.h + 0.2), new THREE.MeshBasicMaterial({ color: 0x17191f, fog: false })), 2); edge.position.set(p.x, YC, p.z - 0.012);   // 細い黒の額
    const mat = add(new THREE.Mesh(new THREE.PlaneGeometry(p.w + 0.16, p.h + 0.16), new THREE.MeshBasicMaterial({ color: 0xd8cfbf, fog: false })), 3); mat.position.set(p.x, YC, p.z - 0.006);   // 生成りの余白
    const pm = printMat(p, false), print = add(new THREE.Mesh(new THREE.PlaneGeometry(p.w, p.h), pm), 4); print.position.set(p.x, YC, p.z);
    const rm = printMat(p, true), refl = add(new THREE.Mesh(new THREE.PlaneGeometry(p.w, p.h), rm), 1); refl.position.set(p.x, -YC, p.z); refl.scale.y = -1;   // 床の映り込み（逆さの写し・下ほど消える）
    rm.uniforms.A = pm.uniforms.A; rm.uniforms.B = pm.uniforms.B; rm.uniforms.Cc = pm.uniforms.Cc; rm.uniforms.ab = pm.uniforms.ab; rm.uniforms.circ = pm.uniforms.circ;   // 写しは本体と同じ混ぜ方
    const pool = add(glow(poolTex, p.w * 1.6, 2.6), 1); pool.rotation.x = -Math.PI / 2; pool.position.set(p.x, 0.002, p.z + 1.2);        // 床の光だまり
    return [id, { p, print, pm, refl, halo, pool, mat, edge }]; }));
  Object.assign(T3, { THREE, rd, sc, cam, floor, ok: true });
});

const STATE = { room: { ab: 0, circ: [0, 0, -1] }, white: { ab: 0, circ: [0, 0, -1] } };   // 場面の側が毎コマ書く（下の S1・S2・S6）
const draw3 = (t, productOnly = false) => {
  const pos = camAt(t); T3.cam.position.set(...pos); T3.cam.lookAt(pos[0], pos[1], pos[2] - 1); T3.cam.updateMatrixWorld();
  for (const [id, it] of Object.entries(T3.items)) { const L = litAt(id, t), st = STATE[id];
    if (st) { it.pm.uniforms.ab.value = st.ab; it.pm.uniforms.circ.value.set(...st.circ); }
    it.halo.material.opacity = 0.9 * L; it.pool.material.opacity = 0.6 * L;   // 0.85 では光だまりが注意書きの下で明るく、字の明るさの差が 4.4:1 だった
    for (const o of [it.halo, it.pool, it.refl, it.mat, it.edge]) o.visible = !productOnly; }
  T3.floor.visible = !productOnly;
  const rd = T3.rd; rd.setClearColor(C.ground, productOnly ? 0 : 1); rd.clear(); rd.render(T3.sc, T3.cam);
  if (!productOnly && T3.coins) drawCoins(t);
  rd.getContext().finish();   // 描き終わるまで待つ：点検は撮らずに何十回もめくるので、CPU の WebGL に仕事が溜まり次の撮影が 30秒で時間切れになった
};
// 点検（ovl.mjs）の「写真の層」：版画だけを透明の地に描き直す（床・光・額・映り込み・硬貨は写真ではない）
window.QC_PRODUCT_ONLY = (on) => { if (T3.ok) draw3(T(), on); };

// =====================================================================
// S1 HOOK＋S2 BLOOM：消灯の版画へ寄る → 問い → 手（引き紐）へ溶ける → カチッで止まる → 版画の中で光の円が開き点灯へ → 引く
// =====================================================================
const SHADE = { x: 798, y: 138 }, CHAIN = { x: 458, y: 0 }, BAND = { w: 1080, h: 850 };   // 写真の中の位置（帯 1080×850 の px・lamp.html と同じ）
{
  const c1 = COPY.S1, c2 = COPY.S2, tc = ev("bloom"), cut = s1.t1 - 0.95;
  const who = ln("left:64px;top:238px;font:500 34px/1.2 'Noto Sans JP';color:var(--dim)", P.target.who);
  const hk1 = ln("left:64px;top:290px;font:700 112px/1.12 'Noto Sans JP'", c1.hook);
  const hk2 = ln("left:64px;top:416px;font:700 112px/1.12 'Noto Sans JP';color:var(--acc)", c1.hook2);
  const h1 = ln("left:64px;top:250px;font:700 120px/1.12 'Noto Sans JP'", c2.head);
  const h2 = ln("left:64px;top:390px;font:700 120px/1.12 'Noto Sans JP';color:var(--acc)", c2.head2);
  note(c1.note, 1400, -1, s1.t1 - 0.3); note(c2.note, 1400, s2.t0 + 0.2, s2.t1 - 0.3);
  const tg = toggle(772, 446);
