# Reddit の話題を取ってきて data/topics.json を更新する。
#
# ★★2026-08-26。GASの材料が0件で固定されていたのを迂回するために作った。
#
# Reddit は 2026-05-28 に未認証の .json API を廃止した。GAS からは 403 しか
# 返らず、バズ診断はずっと「話題の材料は0件」を出していた。材料が無いと
# 「映像そのものを題材にする」経路へ落ち、本文が在庫映像の説明になる。
# スケート動画やRiotの手描き動画が出ていたのはこれが原因。
#
# 廃止されたのは .json のAPI で、RSS は認証なしで応答する（はず）。
# ★「はず」と書いているのは、開発環境のプロキシが reddit.com を塞いでいて
#   実地確認ができていないため。ここでの初回実行が最初の検証になる。
#   ログに「HTTP 403」が並ぶなら仮説が外れているので、別経路を考える。
#
# 【なぜ GitHub Actions なのか】
# GAS からは Reddit に到達できず、そもそも認証を通す手段も無い。
# 一方 Actions は普通のLinuxで、ffmpeg の描画で既に使っている場所。
# ここで取ってリポジトリに置けば、GAS は raw URL で読むだけで済む。

name: fetch-topics

on:
  schedule:
    # ★6時間おき。GASの投稿は2時間おきだが、Redditのトップは
    #   そこまで速く入れ替わらない。叩きすぎて 429 を食う方が損。
    #
    # ★★2026-09-10、**1日1回へ落とした**（決定#122）。
    #   実測すると1回 7.3分かかっており（18板×3秒の間隔＋429の再試行）、
    #   6時間おき＝1日4回で **月880分**。GitHub Actions の無料枠2,000分の
    #   44%を、話題リストの更新だけで使っていた。
    #   取っているのは `t=week`（週間トップ）で、**6時間で入れ替わる中身ではない**。
    #   1日1回にすると月220分。**660分（無料枠の3分の1）が空く。**
    #   ★足りなければ workflow_dispatch で手動更新できる。戻すのも1行。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write        # data/topics.json をコミットするため

# ★同時に走らせない。2本が同じファイルを書くと push が競合する
concurrency:
  group: fetch-topics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: 話題を取得
        run: |
          set -euo pipefail
          python3 scripts/fetch_topics.py data/topics.json

      - name: 変更があればコミット
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ★★git diff は「追跡されていない新規ファイル」を変更として見ない。
          #   初回は data/topics.json が未追跡なので、diff だけで判定すると
          #   5件ちゃんと書けているのに「内容に変化なし」で素通りする
          #   （2026-08-26、初回実行で実際に起きた）。
          #   先に add して、インデックスとHEADを比べる。
          git add data/topics.json
          if git diff --cached --quiet -- data/topics.json; then
            echo "内容に変化なし。コミットしません。"
            exit 0
          fi
          git commit -m "chore: 話題を更新 ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          # ★他のジョブが先に push している可能性がある。rebase してから送る
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "更新しました。"

      # 取れなかった回も痕跡を残す。無言で終わると
      # 「動いているのに0件」と「そもそも動いていない」を区別できない
      - name: 結果の要約
        if: always()
        run: |
          if [ -f data/topics.json ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('data/topics.json'))
          print('generated_at:', d.get('generated_at'))
          for k, v in (d.get('accounts') or {}).items():
              print('  %s: %d件' % (k, len(v)))
              for c in v[:3]:
                  print('     r/%s  %s' % (c.get('subreddit'), c.get('title','')[:70]))
          PY
          else
            echo "data/topics.json がまだありません（1件も取れていない）。"
          fi
