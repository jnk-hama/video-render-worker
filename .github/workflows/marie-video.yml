# 商品1つから、マリーの動画を最後まで作る（決定#182）。
#   カット計画（scripts/shot_plan.py・決まった規則）→ Veo（video-scene）→ 回収 → render-video へ依頼
# ★product_json の例:
#   {"product_key":"redial-850019","genre":"apparel","library_genre":"hoodie",
#    "features":["大きめフード","長め袖","ダブルジップ","ヴィンテージ洗い加工","2色","M〜3L"],
#    "image_url":"https://…/product/redial-850019.jpg",
#    "stills":{"selfie":"…","mirror":"…","free_hands":"…","hood":"…"}}
# ★dry_run: true なら計画と見積り、静止画の点検（顔の点・手の本数・絵の問い・#232）まで出して、Veo は起動しない（Veo は0円・点検の判定は数セント）
name: marie-video

on:
  workflow_dispatch:
    inputs:
      product_json:
        description: '商品（product_key / genre / features / image_url / stills）'
        required: true
        type: string
      dry_run:
        description: '計画と見積りだけ（Veo を起動しない）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # render-video を起動するため

concurrency:
  group: marie-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      # ★予行でも入れる（#232）。予行は静止画の点検（顔の点・手の本数・絵の問い）を本番と同じに回す＝#227 の点検そのもの
      - name: 顔の判定に要る物を入れる
        # ★上限を付ける（2026-10-01：pip が何も出さずに20分止まり、ジョブの40分まで待たされた）。詰まったら早く落として流し直す
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libgles2
          PIP_DEFAULT_TIMEOUT=60 PIP_RETRIES=3 python3 -m pip install --quiet --disable-pip-version-check -c constraints.txt insightface onnxruntime mediapipe
      - name: 計画 → Veo → 回収
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCT_JSON: ${{ inputs.product_json }}
        run: |
          set -euo pipefail
          printf '%s' "$PRODUCT_JSON" > product.json
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/marie_video.py product.json job.json --dry-run
          else
            # ★ログを残す（止まった時に理由を LINE へ送るため・#228）
            python3 scripts/marie_video.py product.json job.json 2>&1 | tee run.log
          fi
      - name: 描画を依頼する
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 試しの回（try_cuts・#254）は描画の依頼を作らない
          [ -f job.json ] || { echo "試しの回なので描画しません"; exit 0; }
          gh workflow run render-video.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f payload_json="$(cat job.json)"
          echo "render-video を起動しました"
      # ★★2026-09-29 追加（決定#228）。止まったら、理由をオーナーの LINE へ1通送る。
      #   9/29 は2本とも描く前に止まったのに何も届かず、オーナーは LINE を待っていた（#227）
      - name: 止まったことを LINE で知らせる
        if: ${{ failure() && !inputs.dry_run }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCT_JSON: ${{ inputs.product_json }}
        run: |
          KEY=$(printf '%s' "$PRODUCT_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("product_key","?"))' 2>/dev/null || echo '?')
          python3 scripts/notify_stop.py "$KEY（描く前に停止）" run.log
