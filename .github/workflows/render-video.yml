# 縦型ショート動画の描画。GAS から repository_dispatch で叩かれる。
#
# ★★2026-08-24、オーナー判断「フォロワーとViewを稼ぐ為に金を払う意味がない」。
#   JSON2Video（1秒=1クレジット）もライセンス購入も使わず、
#   GitHub Actions の無料枠で ffmpeg を回す構成に決めた。
#
# 【なぜここで描画するか】
# GAS は Python も FFmpeg も動かせない。実行も6分で切れる。
# 一方この処理自体は無料でできる（1080x1920 / H.264 は実測済み。
# MoneyPrinterTurbo-SETUP.md 参照）。描画だけ外へ出せば費用は0で済む。
#
# 【無料枠】
#   public リポジトリ … 無制限
#   private リポジトリ … 2,000分/月（1本あたり1〜3分。4本/日で月120〜360分）
#   ※private は1ジョブごとに分単位で切り上げ課金される。無料枠内には収まる。
#
# 【非同期にしている理由】
# GAS は6分で切れるので描画の完了を待てない。
# ここでは Release へ上げるだけにし、GAS は次のサイクルで回収する。

name: render-video

on:
  repository_dispatch:
    types: [render-video]
  # 手で試せる口も残す。payload_json にJSONを貼れば同じ経路を通る
  workflow_dispatch:
    inputs:
      payload_json:
        description: '描画するJSON（clips / captions）'
        required: true
        type: string

permissions:
  contents: write        # Release を作るため

jobs:
  # ★★2026-09-26、フック差し替え工場（決定#177）。
  #   依頼に hook_variants があれば「フック違いの N 本」へ展開し、下の render を
  #   1本ずつ並べて回す。無い依頼は1本のまま素通り（従来の依頼は何も変わらない）。
  #   展開の規則は scripts/expand_hooks.py（検査: check_expand_hooks.py）。
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      items: ${{ steps.expand.outputs.items }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: フック違いへ展開する
        id: expand
        env:
          # ★シェルへ直接展開しない。JSONに引用符が含まれるとコマンドが壊れる
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > payload.json
          else
            printf '%s' "$MANUAL_PAYLOAD" > payload.json
          fi
          python3 scripts/expand_hooks.py payload.json > expand.out
          cat expand.out >> "$GITHUB_OUTPUT"
          # ★本文は出さない（公開リポジトリ）。本数だけ
          grep '^count=' expand.out

  render:
    needs: plan
    # ★名前は id だけにする。既定だと matrix の値（＝依頼の本文）が名前に出る
    name: render (${{ matrix.item.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.items) }}

    # ★★2026-09-03、同じジョブを二重に描かないための鍵。
    #   依頼側は「25分待っても動画が来なければ再依頼」する作りなので、
    #   混雑で遅れた回は**古い実行と新しい実行が並ぶ**。両方が同じ
    #   Storageのパスへ上げると、後から終わった方（＝古い依頼の結果）が
    #   上書きしてしまう。job_id ごとに1本だけ走らせ、新しい方を優先する。
    #   ★ 鍵は plan が出した id（＝job_id、展開した回は -hN 付き）。この時点では
    #     まだ検証前なので、鍵として使うだけで、シェルへは渡さない。
    concurrency:
      # ★展開した1本ごと（-hN）に鍵を分ける。同じ鍵だと兄弟を取り消し合う
      group: render-${{ matrix.item.id || github.run_id }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # ★バージョンを固定せずランナー同梱に任せると、描画結果が黙って変わる。
      #   apt の ffmpeg を明示的に入れ、実際のバージョンをログへ残す。
      - name: FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
          fc-list | grep -i dejavu | head -2

      # ★モードA（読み上げ音声＋発声に合わせた字幕）で使う。
      #   Whisperは積まない。音声をこちらで作るので、単語の時刻は
      #   推定ではなく確定値で手に入る（scripts/tts.py 参照）。
      #   large-v3はCPUで音声長の5〜10倍かかり、20分制限に載らないという
      #   事情もある。
      - name: TTS
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -c constraints.txt edge-tts
          python3 -c "import edge_tts; print('edge-tts ready')"

      # ★★2026-09-01、切り抜きと合成のための依存。**すべてCPUで動く。**
      #   onnxruntime は CPUExecutionProvider のみ（GPU版は入れない）。
      #   これで「GPU推論に依存しない」を守ったまま、
      #   ・商品画像の背景除去（U2-Net / 実測0.86秒per枚）
      #   ・モデル映像の手首追跡（MediaPipe Pose）
      #   ができる。どちらも無料。
      #
      # ★libEGL は mediapipe が dlopen する。入れないと
      #   「libEGL.so.1: cannot open shared object file」で落ちる（実際に踏んだ）。
      - name: 依頼内容を取り出す
        id: payload
        env:
          # ★シェルへ直接展開しない。JSONに引用符が含まれるとコマンドが壊れる
          # ★依頼は plan が展開した1本（hook_variants が無ければ元の依頼そのもの）
          ITEM_PAYLOAD: ${{ matrix.item.payload }}
        run: |
          set -euo pipefail
          printf '%s' "$ITEM_PAYLOAD" > payload.json
          # ★client_payload は最上位10プロパティまで（GitHub APIの制限）。
          #   GAS は {"job": {...}} と1個に畳んで送る。旧い平置きも読む。
          #
          # ★★2026-09-03、セキュリティ点検で検証を足した。
          #   job_id をそのまま $GITHUB_OUTPUT へ書いていたため、
          #   改行を含む job_id を送れば**任意の output を注入できた**
          #   （後段の `gh release create` へ渡る値を差し替えられる）。
          #   タグ名として意味のある文字だけに絞り、外れたら止める。
          #   依頼できるのはリポジトリへ書ける者だけだが、依頼の中身は
          #   外部（Supabase / GAS）で組み立てられるので信用しない。
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          job_id = str(d.get('job_id', ''))
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,64}', job_id):
              sys.exit('job_id が不正です（英数字 . _ - の1〜64文字のみ）: %r' % job_id[:80])
          print('job_id=%s' % job_id)
          PY
          python3 - <<'PY'
          import json
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          print('mode:', d.get('mode'),
                'clips:', len(d.get('clips') or []),
                'captions:', len(d.get('captions') or []))
          PY

      # ★★2026-09-26、喋りの検査の依存（決定#177）。clip_audio の回（Veo の喋る
      #   カット）だけ入れる。文字起こし（faster-whisper）と画面の文字の検出（RapidOCR）。
      #   通常の描画（TTS の回）には積まない。無料枠の分数をそのまま本数の上限にしないため。
      - name: 喋りの検査の依存
        run: |
          set -euo pipefail
          if python3 - <<'PY'
          import json, sys
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          sys.exit(0 if d.get('clip_audio') else 1)
          PY
          then
            python3 -m pip install --quiet --disable-pip-version-check -c constraints.txt \
              faster-whisper rapidocr_onnxruntime pillow numpy
            python3 -c "import faster_whisper, rapidocr_onnxruntime; print('faster-whisper', faster_whisper.__version__)"
          else
            echo "clip_audio ではないので、喋りの検査の依存は入れません。"
          fi

      # ★★2026-09-03、条件付きにした。**無料枠の使い方の問題**。
      #   rembg / onnxruntime / mediapipe の導入と姿勢推定モデルの取得で
      #   毎回2〜3分かかるが、通常の描画（モードA/B/T）はこれを一切使わない。
      #   private リポジトリの無料枠は2,000分/月で、1本あたりの時間が
      #   そのまま本数の上限になる。使わない回に積まないことが、
      #   1日に出せる本数を増やす一番安い方法。
      #
      #   合成を使う回（payload に product か hold がある回）だけ導入する。
      - name: 合成が要るか判定
        id: needs
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          # ★foreground は透過済みPNGが渡ってくる回も多い。その場合 rembg は
          #   要らないので、cutout:false と明示された回は重い依存を積まない。
          fg = d.get('foreground') or {}
          need_fg = bool(fg.get('url')) and fg.get('cutout') is not False
          need = bool(d.get('product') or d.get('hold') or d.get('cutout') or d.get('product_panel')
                      or need_fg)
          print('compose=%s' % ('true' if need else 'false'))
          PY
          cat "$GITHUB_OUTPUT"

      # ★★2026-09-05、透過のキャッシュ（決定#089）。
      #   透過は 2コアで33秒、その前の rembg 導入で20秒。合わせて53秒。
      #   同じ商品で何本も作るので、1度抜いたら二度と抜かない。
      #   **当たれば rembg を入れる必要すら無くなる**ので、重い導入の前に見る。
      - name: 透過キャッシュを確認
        id: fgcache
        if: steps.needs.outputs.compose == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/fg_cache.py --check \
            --payload payload.json --dest .fgwork/fg.png

      - name: 切り抜き・姿勢推定
        if: steps.needs.outputs.compose == 'true' && steps.fgcache.outputs.hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1
          python3 -m pip install --quiet --disable-pip-version-check -c constraints.txt \
            rembg onnxruntime mediapipe
          python3 - <<'PY'
          import onnxruntime
          print('onnxruntime', onnxruntime.__version__,
                onnxruntime.get_available_providers())
          PY
          # ★★2026-09-05、実データで踏んだ不具合を直した。
          #   `mkdir -p /root/.mp` で
          #     mkdir: cannot create directory '/root': Permission denied
          #   になり、ステップごと落ちていた。Actionsのランナーは runner
          #   ユーザーで動くので /root は書けない。**この経路が実際に走ったのは
          #   今回が初めて**で、それまで気づけなかった。
          #
          #   ★あわせて、姿勢推定のモデルは**要る回だけ**落とす。
          #     商品の切り抜き（foreground）だけの回に 5.6MB を取りに行く
          #     理由が無い。無料枠は1秒でも短い方がよい。
          MP_DIR="${MP_DIR:-$HOME/.mp}"
          if python3 - <<'PY'
          import json, sys
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          sys.exit(0 if (d.get('hold') or d.get('product')) else 1)
          PY
          then
            mkdir -p "$MP_DIR"
            curl -sSL --max-time 120 -o "$MP_DIR/pose.task" \
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
            ls -lh "$MP_DIR/pose.task"
          else
            echo "姿勢推定は使わない回なので、モデルは落としません。"
          fi

      # ★★2026-09-04、描画方式の呼び分け（決定#088）。
      #   payload の renderer が "remotion" の回だけ Remotion で描く。
      #   既定は従来どおり ffmpeg。**いつでも切り戻せる形にしておく**
      #   （新しい方が壊れた日に、依頼側の1項目を消すだけで戻る）。
      - name: 描画方式を決める
        id: renderer
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          r = str(d.get('renderer') or 'ffmpeg').strip().lower()
          # 知らない値は既定へ落とす。未知の文字列で分岐を素通りさせない
          if r not in ('ffmpeg', 'remotion'):
              r = 'ffmpeg'
          print('engine=%s' % r)
          PY
          cat "$GITHUB_OUTPUT"

      # ★透過は描画方式によらず1回だけ。結果はキャッシュへ置いて次回使い回す
      - name: 前景を透過する
        if: steps.needs.outputs.compose == 'true'
        run: |
          set -euo pipefail
          python3 scripts/prepare_foreground_cli.py \
            --payload payload.json --out payload_fg.json --work .fgwork

      - name: 透過をキャッシュへ保存
        if: steps.needs.outputs.compose == 'true' && steps.fgcache.outputs.hit != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # ★失敗しても止めない。今回の動画はもう作れる状態にある
          python3 scripts/fg_cache.py --put \
            --payload payload.json --src .fgwork/fg.png || true

      # 透過を通した回は payload_fg.json、通していない回は payload.json を使う
      - name: 使う依頼ファイルを決める
        id: pf
        run: |
          set -euo pipefail
          if [ -f payload_fg.json ]; then
            echo "file=payload_fg.json" >> "$GITHUB_OUTPUT"
          else
            echo "file=payload.json" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # ffmpeg 版（従来）
      # ------------------------------------------------------------------
      - name: 描画（ffmpeg）
        id: render
        if: steps.renderer.outputs.engine == 'ffmpeg'
        run: |
          set -euo pipefail
          python3 scripts/render_video.py \
            --payload ${{ steps.pf.outputs.file }} --out out.mp4
          ls -lh out.mp4

      # ------------------------------------------------------------------
      # Remotion 版（評価中）
      # ------------------------------------------------------------------
      - name: Node
        if: steps.renderer.outputs.engine == 'remotion'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      # ★npm ci は node_modules を作り直すので、その中に置かれる
      #   Chrome のキャッシュより**先に**済ませておく必要がある。
      - name: 依存を入れる（Remotion）
        if: steps.renderer.outputs.engine == 'remotion'
        run: |
          set -euo pipefail
          cd remotion
          npm ci --no-audit --no-fund

      # ★★2026-09-05、実行#41で「保存されていない」ことが分かったので直した。
      #   ログ:
      #     Cache not found for input keys: remotion-chrome-Linux
      #     Path Validation Error: Path(s) specified in the action for caching
      #     do(es) not exist, hence no cache is being saved.
      #   Remotion 4 の置き場所は ~/.cache/remotion ではなく
      #   **<package.json のある階層>/node_modules/.remotion** だった
      #   （@remotion/renderer の get-download-destination.js を読んで確認）。
      #   node_modules の中なので、npm ci の**後**に戻さないと消える。
      - name: Chrome Headless Shell をキャッシュから戻す
        if: steps.renderer.outputs.engine == 'remotion'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: remotion/node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}

      - name: ナレーションを作る（Remotion用）
        if: steps.renderer.outputs.engine == 'remotion'
        run: |
          set -euo pipefail
          # ★ffmpeg版はTTSを内部で回すが、Remotion版は音声を外から受け取る。
          #   同じ台本から同じ音声・同じ字幕時刻を作るために切り出してある。
          python3 scripts/make_narration.py \
            --payload ${{ steps.pf.outputs.file }} --audio narration.mp3 --out payload_tts.json
          ls -lh narration.mp3 || echo "音声なしで続行します"

      # ★★2026-09-05 追加。**このコンテナに日本語のフォントは無い。**
      #   巨大テロップが1本目で1枚も描かれなかった原因が、コンポーネント側の
      #   fontFamily 書き忘れだった。同梱の Dela Gothic One は data URI で
      #   `JmasJP` という名前で差し込んでいるので、**その名前を書いた要素に
      #   しか当たらない**。書き忘れた要素はグリフの無い書体へ落ちて、
      #   エラーも出さずに透明になる。
      #   毎回1行だけ記録しておけば、次に同じ症状が出た時に推測しなくて済む。
      - name: 日本語フォントの前提を記録する
        if: steps.renderer.outputs.engine == 'remotion'
        run: |
          set -uo pipefail
          n=$(fc-list :lang=ja 2>/dev/null | wc -l)
          echo "コンテナの日本語フォント: ${n} 件（0が正常。同梱フォントを data URI で差し込む設計）"

      - name: 描画（Remotion）
        if: steps.renderer.outputs.engine == 'remotion'
        env:
          # ★★品質（決定#090）。実測に基づく既定は mid。
          #   4コアでの実測（9秒の動画・キャッシュを温めた条件）:
          #     low  30fps ブラー無し   4.08秒/秒
          #     mid  60fps ブラー無し   7.90秒/秒
          #     soft 60fps ブラー2     19.42秒/秒
          #     high 60fps ブラー4     35.64秒/秒
          #   ★決定#093で尺が30秒になったため既定は std（30fps/CRF18）。
          #
          #   ★★2026-09-05、**上の4コアの数字から2コアを推定したのが間違って
          #     いた**（実行#41で実測）。30秒/30fps/std の実測は
          #       描画 263.7秒（動画1秒あたり 8.79秒）／ジョブ全体 384秒
          #     で、4コアの low(4.08秒/秒) に対して約2.2倍。私は1.31倍で
          #     見積もり、月1,440分と報告したが、**実際は約2,160分**。
          #     推定を実測として扱わない（#079と同じ間違い）。
          #     現在の実測に基づく月あたり（12本/日・30日）:
          #       透過キャッシュ有 6分/本 → 2,160分 ★無料枠2,000分を超過
          #       10本/日なら        6分/本 → 1,800分  収まる
          #     本数か尺のどちらかを削るか、有料分を認めるかは要判断。
          RENDER_QUALITY: ${{ vars.RENDER_QUALITY || 'std' }}
        run: |
          set -euo pipefail
          cd remotion
          node scripts/render.mjs --payload ../payload_tts.json --out ../out.mp4
          cd ..
          ls -lh out.mp4

      # ★★2026-09-05、**出来上がった動画そのものを検査する**。
      #
      #   実行#41は全ステップ成功で終わったのに、音声トラックが
      #   1本も入っていなかった（E-010）。原因は相対パスの取り違えで、
      #   描画側は「音声が見つかりません（無音で続行）」と縮退して
      #   成功扱いにする。**成功したかどうかを、工程ではなく成果物で
      #   判定していなかった**ことが、見逃した本当の理由。
      #
      #   ナレーションを作った回（narration.mp3 がある回）は、
      #   音声トラックが無ければ**落とす**。無音の動画を配ってから
      #   気づくより、ここで止めた方が安い。
      - name: 出来上がった動画を検査する
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=index,codec_type,codec_name \
            -show_entries format=duration -of default=nw=1 out.mp4
          if [ -s narration.mp3 ]; then
            if ! ffprobe -v error -select_streams a \
                 -show_entries stream=codec_type -of csv=p=0 out.mp4 | grep -q audio; then
              echo "::error::ナレーションを作ったのに、動画に音声トラックがありません（E-010の再発）"
              exit 1
            fi
            echo "音声トラックあり。"
          else
            echo "ナレーションを作っていない回なので、音声の検査はしません。"
          fi

      # ★★2026-09-29 追加（決定#225）。**出来上がった動画の品質を機械で測る。**
      #   上の検査は音声トラックの有無だけで、黒いコマ・固まった映像・途中の無音・音量・大きさは見ていなかった。
      #   ffmpeg の公式フィルターだけで測る（0円・LLMなし）。しきい値は scripts/qc_video.py の定数だけが持つ。
      # ★他部署（GAS 経路）の動画は基準の実測がまだ無いので、既定は「記録だけ」（warn）。
      #   落とすのは、依頼が job.video_qc: "block" を付けた回だけ（マリーの動画は付く・実測 -14.17 LUFS で基準を取った）。
      #   基準を実測できた部署から block へ切り替える。
      - name: 動画の品質を測る（黒・固まり・無音・音量・大きさ）
        run: |
          set -euo pipefail
          OUT=$(python3 - <<'PY'
          import json
          j = json.load(open('payload.json')).get('job') or {}
          print(int(j.get('width') or 1080), int(j.get('height') or 1920), str(j.get('video_qc') or 'warn').lower())
          PY
          )
          set -- $OUT
          EXTRA=""
          [ "$3" = "block" ] || EXTRA="--warn-only"
          python3 scripts/qc_video.py out.mp4 --size "${1}x${2}" $EXTRA

      # ★★2026-09-20 追加。**出来上がった絵を見る**ための口。
      #
      # 【なぜ要るか】
      # ffprobe が保証するのは「壊れていないこと」までである。
      # 字幕が画面外に出ていないか／前景が商品を隠していないか／
      # 背景が内容と噛み合っているかは、**絵を見ないと分からない**。
      # 実装者のサンドボックスは Supabase にも Release にも出られず、
      # 通るのは git だけなので preview ブランチへ置く。
      #
      # ★等間隔に6コマ。先頭と末尾だけでは、途中で崩れた回を見逃す。
      # ★ここで失敗しても動画は出来ている。確認の失敗で成果物を捨てない。
      - name: 仕上がりのコマを並べて置く
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check -c constraints.txt pillow
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out.mp4)
          mkdir -p frames
          python3 - "$dur" <<'PY'
          import subprocess, sys
          dur = float(sys.argv[1])
          n = 6
          for i in range(n):
              t = dur * (i + 0.5) / n
              subprocess.run(['ffmpeg', '-y', '-v', 'error', '-ss', '%.3f' % t,
                              '-i', 'out.mp4', '-frames:v', '1',
                              'frames/f%02d.jpg' % i], check=True)
          print('尺 %.2f秒 から %d コマ抜きました' % (dur, n))
          PY
          python3 scripts/preview_b64.py frames/f*.jpg --max 200 --cols 3
          # ★★出来上がった動画そのものも置く（2026-09-22）。
          #   コマを6枚見ても、間・テンポ・音は分からない。実装者の
          #   サンドボックスは Supabase 403 / private Release 404 なので、
          #   **再生して確かめる手段が git しかない**。
          # ★★他社の商品写真（ASPの実画像）を重ねた回は公開の preview へ置かない（2026-09-26）。
          #   リポジトリは公開。product_panel / foreground の画像は楽天等の写真そのもので、
          #   marie-redial-ja-v3c が自動で置かれ、手で消した。確認は Storage の URL で行う。
          if python3 -c "import json,sys; j=json.load(open('payload.json')).get('job') or {}; sys.exit(0 if ((j.get('product_panel') or {}).get('images') or j.get('foreground')) else 1)"; then
            echo "商品写真を含む回なので preview へは置きません（Storage の URL で確認）"
          else
            bash scripts/push_preview.sh preview.jpg "render ${{ steps.payload.outputs.job_id }}" out.mp4
          fi

      # ★★2026-09-02、日本市場の部署（jmas-ai-os）向け。
      #   TikTok / Instagram の投稿APIは「公開URLから動画を取りに来る」方式で、
      #   このリポジトリは private なので Release アセットは取りに来られない。
      #   依頼側が upload:{bucket,path} を付けてきた回だけ Supabase Storage の
      #   公開バケットへ置く。鍵は Actions の Secrets からのみ読む（コードに書かない）。
      #   Secrets が無い・upload が無い回は何もしない（英語圏の部署＝GAS 経路は
      #   従来どおり Release で回収する）。
      - name: Supabase Storage へ上げる
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # ★bucket / path も検証する。`..` や絶対パスを混ぜられると
          #   バケット内の別の場所（他ジョブの動画）へ上書きできてしまう。
          TARGET=$(python3 - <<'PY'
          import json, re, sys
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          u = d.get('upload') or {}
          bucket, path = str(u.get('bucket') or ''), str(u.get('path') or '')
          if not bucket and not path:
              raise SystemExit(0)          # 指定なし。上げない
          if not re.fullmatch(r'[a-z0-9][a-z0-9._-]{1,62}', bucket):
              sys.exit('bucket が不正です: %r' % bucket[:80])
          if not re.fullmatch(r'[A-Za-z0-9._/-]{1,128}', path) or '..' in path or path.startswith('/'):
              sys.exit('path が不正です: %r' % path[:120])
          print('%s/%s' % (bucket, path))
          PY
          )
          if [ -z "$TARGET" ]; then
            echo "upload の指定なし。Storage へは上げません。"
            exit 0
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::upload が指定されたが SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY が Secrets にない"
            exit 1
          fi
          # ★★2026-09-04、値の掃除を足した。**実際にこれで落ちた。**
          #   Secrets へ貼り付ける時に末尾の改行や空白が混ざると、curl は
          #   "URL rejected: Malformed input to a URL function"（終了コード3）
          #   で落ちる。Secretsは設定済みなのに動かないので原因が見えにくい。
          #   人の貼り付けミスを、こちら側で吸収する。
          #   ★整形した値は表示しない。マスクをすり抜ける可能性があるため、
          #     形が正しいかどうかだけを出す。
          # ★★2026-09-04、「消す文字を並べる」のをやめ、
          #   **使える文字だけ残す**方式にした（tr -cd = 補集合を削除）。
          #
          #   前の版は空白・改行・引用符を消していたが、それでも
          #   42文字（正しい値は40文字）が残って弾かれた。
          #   web からコピーすると、全角スペースやゼロ幅スペースのような
          #   **目に見えず [:space:] にも当たらない文字**が紛れる。
          #   禁止するものを数え上げる限り、この種の混入は必ず取りこぼす。
          #   URLと鍵に出てこない文字は、全部落として構わない。
          RAW=$(printf '%s' "$SUPABASE_URL" | tr -cd 'A-Za-z0-9:/._-')
          KEY_CLEAN=$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -cd 'A-Za-z0-9._-')

          # ★ホスト名だけ取り出す。値が
          #     https://xxx.supabase.co/rest/v1  … パス付き
          #     https://supabase.com/dashboard/project/xxx … 管理画面のURL
          #     xxx.supabase.co                  … スキーム無し
          #     xxx                              … プロジェクトrefだけ
          #   のどれで貼られていても同じ形へ寄せる。
          #   どれが原因かを人に調べさせるより、全部受けた方が早い。
          HOST=${RAW#http://}
          HOST=${HOST#https://}
          HOST=${HOST%%/*}
          case "$HOST" in
            *.*) ;;                       # 既にドメイン
            ?*)  HOST="${HOST}.supabase.co" ;;   # プロジェクトrefだけだった場合
          esac
          URL_CLEAN="https://$HOST"

          # ★管理画面のURL（supabase.com/dashboard/...）を貼られた場合。
          #   ホストだけ取ると supabase.com になり、形式検査は通ってしまうが
          #   アップロード先としては誤り。ここで明示的に弾く。
          if [ "$HOST" = "supabase.com" ] || [ "$HOST" = "www.supabase.com" ]; then
            echo "::error::管理画面のURLが入っています。Project Settings の Project URL" \
                 "（https://<project-ref>.supabase.co）を入れてください"
            exit 1
          fi
          if ! printf '%s' "$HOST" | grep -qE '^[A-Za-z0-9][A-Za-z0-9.-]*\.[A-Za-z]{2,}$'; then
            # ★値は出さない。長さと形だけ出す（マスクをすり抜けさせない）
            echo "::error::SUPABASE_URL からホスト名を取り出せません（長さ ${#RAW} 文字）。" \
                 "期待する形: https://<project-ref>.supabase.co"
            exit 1
          fi
          echo "URLの形式: OK（ホスト ${#HOST} 文字） / 鍵の長さ: ${#KEY_CLEAN} 文字"
          # x-upsert: 同じ job を描き直した回に「既に存在する」で落ちないように
          code=$(curl -sS -o upload.log -w '%{http_code}'             -X POST "${URL_CLEAN}/storage/v1/object/${TARGET}"             -H "Authorization: Bearer ${KEY_CLEAN}"             -H "Content-Type: video/mp4" -H "x-upsert: true"             --data-binary @out.mp4)
          if [ "$code" != "200" ]; then
            echo "::error::Storage へのアップロード失敗 HTTP $code"; cat upload.log; exit 1
          fi
          echo "アップロード完了: ${URL_CLEAN}/storage/v1/object/public/${TARGET}"

      # ★Release へ上げる理由：
      #   artifact は取得に認証と解凍が要り、GAS から扱いにくい。
      #   Release アセットなら1回のGETでMP4そのものが取れる。
      #   タグに job_id を入れておけば、GAS 側は「自分が頼んだ回」を特定できる。
      # ★★2026-09-27 追加（決定#191）。完成した動画をオーナーの LINE へ送り、［承認］［作り直し］を1タップで返してもらう。
      #   依頼に review.clip_ids（使った素材の video_library の id）がある回だけ。送るのは video-scene の notify_review
      #   （service role でしか呼べない）。押された返事は Supabase の line-webhook が受ける。
      # ★送れなくても動画は出来ているので、この手順の失敗で描画を落とさない（警告だけ）。
      # ★公開リポジトリなので、URL・素材番号・返りの本文はログへ出さない（件数と状態だけ）。
      - name: オーナーへ承認依頼（LINE）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          python3 - <<'PY' || echo "::warning::LINE への承認依頼を送れませんでした（動画は出来ています）"
          import json, os, re, sys, urllib.error, urllib.request
          d = json.load(open('payload.json'))
          d = d.get('job') if isinstance(d.get('job'), dict) else d
          ids = [int(i) for i in ((d.get('review') or {}).get('clip_ids') or []) if str(i).isdigit()]
          up = d.get('upload') or {}
          if not ids or not up.get('bucket') or not up.get('path'):
              print('承認依頼の指定なし（review.clip_ids か upload が無い）。送りません。')
              sys.exit(0)
          raw = re.sub(r'[^A-Za-z0-9:/._-]', '', os.environ.get('SUPABASE_URL') or '')
          host = re.sub(r'^https?://', '', raw).split('/')[0]
          host = host if '.' in host else host + '.supabase.co'
          key = re.sub(r'[^A-Za-z0-9._-]', '', os.environ.get('SUPABASE_SERVICE_ROLE_KEY') or '')
          if not host or not key:
              sys.exit('SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY がありません')
          body = {'action': 'notify_review', 'clip_ids': ids,
                  'title': str(d.get('product_key') or '')[:60],
                  'video_url': 'https://%s/storage/v1/object/public/%s/%s' % (host, up['bucket'], up['path'])}
          req = urllib.request.Request('https://%s/functions/v1/video-scene' % host, data=json.dumps(body).encode(),
                                       headers={'Authorization': 'Bearer ' + key, 'apikey': key,
                                                'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=40) as r:
                  print('LINE へ承認依頼を送りました（HTTP %d・素材 %d 本）' % (r.status, len(ids)))
          except urllib.error.HTTPError as e:
              sys.exit('送れません（HTTP %d）' % e.code)
          PY

      - name: Release へ上げる
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ steps.payload.outputs.job_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="render-${JOB_ID}"
          # ★GitHubの式展開を run の中で直接使わない（値に引用符や改行が
          #   入るとコマンドが壊れる／注入される）。env 経由で渡す。
          #   ※この注意書きに式の記法そのものを書くと、**コメントであっても
          #     GitHubが式として解釈し、ワークフロー全体がパースできなくなる**
          #     （実際に「An expression was expected」で起動不能になった）。
          # ★★2026-09-05、**同じ job を描き直すと必ず失敗していた**ので直した。
          #   実行#45（job 994fef3d…）が Release で落ちた。同じ job を
          #   08:36（実行#44）と08:51（実行#45）の2回描いており、2回目の
          #   `gh release create` が「タグが既にある」で失敗していた。
          #   Storage側は x-upsert を付けてあるので通り、Release だけが落ちる。
          #
          #   ★描き直しは**設計された動作**である。依頼側は「25分待っても
          #     動画が来なければ再依頼」する作りなので、混雑した回は必ずここを通る。
          #   タグがあれば資産だけ差し替える（--clobber）。
          if gh release create "$TAG" out.mp4 \
               --title "$TAG" \
               --notes "bytes=$(stat -c%s out.mp4)" \
               --repo "$GH_REPO"; then
            echo "アップロード完了: $TAG"
          else
            echo "Release が既にあるので、資産だけ差し替えます: $TAG"
            gh release upload "$TAG" out.mp4 --clobber --repo "$GH_REPO"
            echo "差し替え完了: $TAG"
          fi

      # ★★2026-08-25 追加。放っておくと Release が無限に積もる。
      #
      #   1本ごとに Release を1つ作る設計なので、2アカウント×4本/日なら
      #   月およそ240個、1年で約3,000個。MP4 が付いたまま増え続け、
      #   リポジトリの Releases 画面は実質使えなくなる。
      #   GAS 側（collectRender_）は回収後に Release を消していない。
      #
      #   GAS の待ち時間は30分で打ち切られる（RENDER_TIMEOUT_MS）ので、
      #   3日より古いものは確実に誰も取りに来ない。消して安全。
      #
      #   ★掃除の失敗でジョブを落とさない。動画は既に上がっており、
      #     そちらの方が大事。`|| true` で握るが、ログには必ず出す。
      - name: 古い Release を片づける
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DAYS: '3'
        run: |
          set -uo pipefail
          gh release list --repo "${{ github.repository }}" \
            --limit 200 --json tagName,createdAt > releases.json || exit 0
          python3 - <<'PY' > stale.txt
          import json, datetime, os
          keep = int(os.environ.get('KEEP_DAYS', '3'))
          cut = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=keep)
          for r in json.load(open('releases.json')):
              tag = r.get('tagName', '')
              # ★render- で始まるものだけ。人が作った Release は触らない
              if not tag.startswith('render-'):
                  continue
              t = datetime.datetime.fromisoformat(
                  r['createdAt'].replace('Z', '+00:00'))
              if t < cut:
                  print(tag)
          PY
          n=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --repo "${{ github.repository }}" \
              --yes --cleanup-tag && n=$((n+1)) || echo "削除できず: $tag"
          done < stale.txt
          echo "古い Release を ${n} 件削除しました（${KEEP_DAYS}日より前）。"

      # 失敗した回も痕跡を残す。無言で終わると GAS 側が延々と待つ
      # ★2026-09-04、文言を直した。ジョブ全体の失敗で走るので、
      #   描画が成功して**アップロードだけ**落ちた回にも「描画に失敗」と
      #   出ていた。実際にそれで一度誤読しかけた。どの段階で落ちたかは
      #   上のステップの一覧を見るのが正しい。
      #
      # ★★2026-09-14、**中身を出すのをやめた**。
      #
      # 【なぜ】このリポジトリを公開にした。ログは誰でも読める。
      #   ここは以前 payload.json の先頭2000文字をそのまま出していたが、
      #   その中身は**台本の本文と、どの商品を選んだか**である。
      #   失敗するたびに、それが全世界へ出ることになる。
      #   認証情報は入っていない（鍵はSecretsが自動でマスクする）が、
      #   出す必要が無いものを出さない。
      #
      # 【何を残したか】障害調査に要るのは「どの値が欠けていたか・形が
      #   違ったか」であって本文ではない。だから**形だけ**出す。
      #   文字列は長さ、配列は件数、辞書はキー名。
      #   renderer / target_market のような**内容を持たない短い札**だけは
      #   値ごと出す（これが読めないと部門の取り違えを追えない。決定#082）。
      - name: 失敗時のログ
        if: failure()
        run: |
          echo "どこかの段階で失敗しました（どのステップかは上の一覧を参照）。"
          echo "payload の形（本文は出さない）:"
          python3 - <<'PY' || true
          import json

          # 内容を持たない短い札。これだけは値ごと出す
          PLAIN = {'renderer', 'target_market', 'safe_area', 'platform',
                   'video_type', 'id', 'job_id', 'lang', 'aspect'}

          try:
              p = json.load(open('payload.json'))
          except Exception as e:
              print('  payload.json を読めません: %s' % type(e).__name__)
              raise SystemExit(0)

          job = p.get('job', p)
          if not isinstance(job, dict):
              print('  job が辞書ではありません: %s' % type(job).__name__)
              raise SystemExit(0)

          def shape(k, v):
              if k in PLAIN and isinstance(v, (str, int, float, bool)):
                  return repr(v)
              if isinstance(v, str):   return 'str(%d文字)' % len(v)
              if isinstance(v, list):  return 'list(%d件)' % len(v)
              if isinstance(v, dict):  return 'dict{%s}' % ', '.join(sorted(v))
              if v is None:            return 'null'
              return '%s=%r' % (type(v).__name__, v)

          for k in sorted(job):
              print('  %-18s %s' % (k, shape(k, job[k])))
          PY
