# 縦型ショート動画の描画。GAS から repository_dispatch で叩かれる。
#
# ★★2026-08-24、オーナー判断「フォロワーとViewを稼ぐ為に金を払う意味がない」。
#   JSON2Video（1秒=1クレジット）もライセンス購入も使わず、
#   GitHub Actions の無料枠で ffmpeg を回す構成に決めた。
#
# 【なぜここで描画するか】
# GAS は Python も FFmpeg も動かせない。実行も6分で切れる。
# 一方この処理自体は無料でできる（1080x1920 / H.264 は実測済み。
# MoneyPrinterTurbo-SETUP.md 参照）。描画だけ外へ出せば費用は0で済む。
#
# 【無料枠】
#   public リポジトリ … 無制限
#   private リポジトリ … 2,000分/月（1本あたり1〜3分。4本/日で月120〜360分）
#   ※private は1ジョブごとに分単位で切り上げ課金される。無料枠内には収まる。
#
# 【非同期にしている理由】
# GAS は6分で切れるので描画の完了を待てない。
# ここでは Release へ上げるだけにし、GAS は次のサイクルで回収する。

name: render-video

on:
  repository_dispatch:
    types: [render-video]
  # 手で試せる口も残す。payload_json にJSONを貼れば同じ経路を通る
  workflow_dispatch:
    inputs:
      payload_json:
        description: '描画するJSON（clips / captions）'
        required: true
        type: string

permissions:
  contents: write        # Release を作るため

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ★★2026-09-03、同じジョブを二重に描かないための鍵。
    #   依頼側は「25分待っても動画が来なければ再依頼」する作りなので、
    #   混雑で遅れた回は**古い実行と新しい実行が並ぶ**。両方が同じ
    #   Storageのパスへ上げると、後から終わった方（＝古い依頼の結果）が
    #   上書きしてしまう。job_id ごとに1本だけ走らせ、新しい方を優先する。
    #   ★ job_id は client_payload をそのまま参照する（この時点では
    #     まだ検証前なので、鍵として使うだけで、シェルへは渡さない）。
    concurrency:
      group: render-${{ github.event.client_payload.job.job_id || github.event.client_payload.job_id || github.run_id }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # ★バージョンを固定せずランナー同梱に任せると、描画結果が黙って変わる。
      #   apt の ffmpeg を明示的に入れ、実際のバージョンをログへ残す。
      - name: FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
          fc-list | grep -i dejavu | head -2

      # ★モードA（読み上げ音声＋発声に合わせた字幕）で使う。
      #   Whisperは積まない。音声をこちらで作るので、単語の時刻は
      #   推定ではなく確定値で手に入る（scripts/tts.py 参照）。
      #   large-v3はCPUで音声長の5〜10倍かかり、20分制限に載らないという
      #   事情もある。
      - name: TTS
        run: |
          python3 -m pip install --quiet --disable-pip-version-check edge-tts
          python3 -c "import edge_tts; print('edge-tts ready')"

      # ★★2026-09-01、切り抜きと合成のための依存。**すべてCPUで動く。**
      #   onnxruntime は CPUExecutionProvider のみ（GPU版は入れない）。
      #   これで「GPU推論に依存しない」を守ったまま、
      #   ・商品画像の背景除去（U2-Net / 実測0.86秒per枚）
      #   ・モデル映像の手首追跡（MediaPipe Pose）
      #   ができる。どちらも無料。
      #
      # ★libEGL は mediapipe が dlopen する。入れないと
      #   「libEGL.so.1: cannot open shared object file」で落ちる（実際に踏んだ）。
      - name: 依頼内容を取り出す
        id: payload
        env:
          # ★シェルへ直接展開しない。JSONに引用符が含まれるとコマンドが壊れる
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > payload.json
          else
            printf '%s' "$MANUAL_PAYLOAD" > payload.json
          fi
          # ★client_payload は最上位10プロパティまで（GitHub APIの制限）。
          #   GAS は {"job": {...}} と1個に畳んで送る。旧い平置きも読む。
          #
          # ★★2026-09-03、セキュリティ点検で検証を足した。
          #   job_id をそのまま $GITHUB_OUTPUT へ書いていたため、
          #   改行を含む job_id を送れば**任意の output を注入できた**
          #   （後段の `gh release create` へ渡る値を差し替えられる）。
          #   タグ名として意味のある文字だけに絞り、外れたら止める。
          #   依頼できるのはリポジトリへ書ける者だけだが、依頼の中身は
          #   外部（Supabase / GAS）で組み立てられるので信用しない。
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          job_id = str(d.get('job_id', ''))
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,64}', job_id):
              sys.exit('job_id が不正です（英数字 . _ - の1〜64文字のみ）: %r' % job_id[:80])
          print('job_id=%s' % job_id)
          PY
          python3 - <<'PY'
          import json
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          print('mode:', d.get('mode'),
                'clips:', len(d.get('clips') or []),
                'captions:', len(d.get('captions') or []))
          PY

      # ★★2026-09-03、条件付きにした。**無料枠の使い方の問題**。
      #   rembg / onnxruntime / mediapipe の導入と姿勢推定モデルの取得で
      #   毎回2〜3分かかるが、通常の描画（モードA/B/T）はこれを一切使わない。
      #   private リポジトリの無料枠は2,000分/月で、1本あたりの時間が
      #   そのまま本数の上限になる。使わない回に積まないことが、
      #   1日に出せる本数を増やす一番安い方法。
      #
      #   合成を使う回（payload に product か hold がある回）だけ導入する。
      - name: 合成が要るか判定
        id: needs
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          need = bool(d.get('product') or d.get('hold') or d.get('cutout'))
          print('compose=%s' % ('true' if need else 'false'))
          PY
          cat "$GITHUB_OUTPUT"

      - name: 切り抜き・姿勢推定
        if: steps.needs.outputs.compose == 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1
          python3 -m pip install --quiet --disable-pip-version-check \
            rembg onnxruntime mediapipe
          python3 - <<'PY'
          import onnxruntime
          print('onnxruntime', onnxruntime.__version__,
                onnxruntime.get_available_providers())
          PY
          # 姿勢推定のモデル（5.6MB）。rembgのモデルは初回利用時に自動取得
          mkdir -p /root/.mp
          curl -sSL --max-time 120 -o /root/.mp/pose.task \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          ls -lh /root/.mp/pose.task

      - name: 描画
        id: render
        run: |
          set -euo pipefail
          python3 scripts/render_video.py --payload payload.json --out out.mp4
          ls -lh out.mp4

      # ★★2026-09-02、日本市場の部署（jmas-ai-os）向け。
      #   TikTok / Instagram の投稿APIは「公開URLから動画を取りに来る」方式で、
      #   このリポジトリは private なので Release アセットは取りに来られない。
      #   依頼側が upload:{bucket,path} を付けてきた回だけ Supabase Storage の
      #   公開バケットへ置く。鍵は Actions の Secrets からのみ読む（コードに書かない）。
      #   Secrets が無い・upload が無い回は何もしない（英語圏の部署＝GAS 経路は
      #   従来どおり Release で回収する）。
      - name: Supabase Storage へ上げる
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # ★bucket / path も検証する。`..` や絶対パスを混ぜられると
          #   バケット内の別の場所（他ジョブの動画）へ上書きできてしまう。
          TARGET=$(python3 - <<'PY'
          import json, re, sys
          d = json.load(open('payload.json'))
          if isinstance(d.get('job'), dict):
              d = d['job']
          u = d.get('upload') or {}
          bucket, path = str(u.get('bucket') or ''), str(u.get('path') or '')
          if not bucket and not path:
              raise SystemExit(0)          # 指定なし。上げない
          if not re.fullmatch(r'[a-z0-9][a-z0-9._-]{1,62}', bucket):
              sys.exit('bucket が不正です: %r' % bucket[:80])
          if not re.fullmatch(r'[A-Za-z0-9._/-]{1,128}', path) or '..' in path or path.startswith('/'):
              sys.exit('path が不正です: %r' % path[:120])
          print('%s/%s' % (bucket, path))
          PY
          )
          if [ -z "$TARGET" ]; then
            echo "upload の指定なし。Storage へは上げません。"
            exit 0
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::upload が指定されたが SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY が Secrets にない"
            exit 1
          fi
          # x-upsert: 同じ job を描き直した回に「既に存在する」で落ちないように
          code=$(curl -sS -o upload.log -w '%{http_code}'             -X POST "${SUPABASE_URL%/}/storage/v1/object/${TARGET}"             -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Content-Type: video/mp4" -H "x-upsert: true"             --data-binary @out.mp4)
          if [ "$code" != "200" ]; then
            echo "::error::Storage へのアップロード失敗 HTTP $code"; cat upload.log; exit 1
          fi
          echo "アップロード完了: ${SUPABASE_URL%/}/storage/v1/object/public/${TARGET}"

      # ★Release へ上げる理由：
      #   artifact は取得に認証と解凍が要り、GAS から扱いにくい。
      #   Release アセットなら1回のGETでMP4そのものが取れる。
      #   タグに job_id を入れておけば、GAS 側は「自分が頼んだ回」を特定できる。
      - name: Release へ上げる
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ steps.payload.outputs.job_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="render-${JOB_ID}"
          # ★GitHubの式展開を run の中で直接使わない（値に引用符や改行が
          #   入るとコマンドが壊れる／注入される）。env 経由で渡す。
          #   ※この注意書きに式の記法そのものを書くと、**コメントであっても
          #     GitHubが式として解釈し、ワークフロー全体がパースできなくなる**
          #     （実際に「An expression was expected」で起動不能になった）。
          gh release create "$TAG" out.mp4 \
            --title "$TAG" \
            --notes "bytes=$(stat -c%s out.mp4)" \
            --repo "$GH_REPO"
          echo "アップロード完了: $TAG"

      # ★★2026-08-25 追加。放っておくと Release が無限に積もる。
      #
      #   1本ごとに Release を1つ作る設計なので、2アカウント×4本/日なら
      #   月およそ240個、1年で約3,000個。MP4 が付いたまま増え続け、
      #   リポジトリの Releases 画面は実質使えなくなる。
      #   GAS 側（collectRender_）は回収後に Release を消していない。
      #
      #   GAS の待ち時間は30分で打ち切られる（RENDER_TIMEOUT_MS）ので、
      #   3日より古いものは確実に誰も取りに来ない。消して安全。
      #
      #   ★掃除の失敗でジョブを落とさない。動画は既に上がっており、
      #     そちらの方が大事。`|| true` で握るが、ログには必ず出す。
      - name: 古い Release を片づける
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DAYS: '3'
        run: |
          set -uo pipefail
          gh release list --repo "${{ github.repository }}" \
            --limit 200 --json tagName,createdAt > releases.json || exit 0
          python3 - <<'PY' > stale.txt
          import json, datetime, os
          keep = int(os.environ.get('KEEP_DAYS', '3'))
          cut = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=keep)
          for r in json.load(open('releases.json')):
              tag = r.get('tagName', '')
              # ★render- で始まるものだけ。人が作った Release は触らない
              if not tag.startswith('render-'):
                  continue
              t = datetime.datetime.fromisoformat(
                  r['createdAt'].replace('Z', '+00:00'))
              if t < cut:
                  print(tag)
          PY
          n=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --repo "${{ github.repository }}" \
              --yes --cleanup-tag && n=$((n+1)) || echo "削除できず: $tag"
          done < stale.txt
          echo "古い Release を ${n} 件削除しました（${KEEP_DAYS}日より前）。"

      # 失敗した回も痕跡を残す。無言で終わると GAS 側が延々と待つ
      - name: 失敗時のログ
        if: failure()
        run: |
          echo "描画に失敗しました。payload は以下:"
          head -c 2000 payload.json || true
