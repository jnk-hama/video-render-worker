# Google Trends 公式RSS が実際に使えるかを測るだけの、使い捨てワークフロー。
#
# ★開発用サンドボックスは trends.google.com への外向き通信を
#   ポリシーで遮断している（connect_rejected）。手元では測れない。
#   Actionsのランナーは通るので、ここで測って結果をログへ出す。
#
# ★測り終えたら消す。恒久的に置かない。
name: probe-trends

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: RSSを取りに行く
        run: |
          set -uo pipefail
          for geo in US JP; do
            echo "===================== geo=$geo"
            code=$(curl -sS -L -o "t_$geo.xml" -w '%{http_code}' \
                   --max-time 30 \
                   "https://trends.google.com/trending/rss?geo=$geo" || echo 000)
            echo "HTTP $code / $(wc -c < "t_$geo.xml" 2>/dev/null || echo 0) bytes"
            echo "--- Content-Type ---"
            curl -sS -I --max-time 30 \
              "https://trends.google.com/trending/rss?geo=$geo" \
              | grep -i '^content-type' || echo "(取れず)"
          done

      - name: 中身を解釈できるか
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for geo in ('US', 'JP'):
              print('=====================', geo)
              try:
                  root = ET.parse('t_%s.xml' % geo).getroot()
              except Exception as e:
                  print('  解釈できず:', e)
                  continue
              items = root.findall('.//item')
              print('  item 件数:', len(items))
              # 子要素の名前を数える（名前空間つきのものも見る）
              if items:
                  print('  1件目の子要素:',
                        [c.tag.split('}')[-1] for c in items[0]])
              for it in items[:5]:
                  title = it.findtext('title', '')
                  traffic = ''
                  for c in it:
                      if c.tag.split('}')[-1] == 'approx_traffic':
                          traffic = c.text or ''
                  print('   -', title, '|', traffic)
          PY

      - name: yq でも同じことができるか
        run: |
          set -uo pipefail
          yq --version || { echo "yq が入っていない"; exit 0; }
          echo "--- yq で上位5件のタイトルを抜く ---"
          yq -p=xml -o=json '.rss.channel.item[0:5][].title' t_US.xml || \
            echo "yq では抜けなかった"
