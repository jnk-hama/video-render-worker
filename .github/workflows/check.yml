# 描画まわりの検査をまとめて回す。
#
# ★★2026-09-09 追加（決定#115）。
#
# 【なぜ要るか】
# `check-telop.mjs` も `check-caption-wrap.mjs` も**手元でしか走っていなかった**。
# 走らせ忘れれば、文字が画面からはみ出す版や、語の途中で切れる版が
# そのまま main に入り、次の描画から本番の動画に出る。
# 描画は1本7分かかるうえ、**出来上がってからでないと気づけない**。
# ここで止めれば、押した時点で分かる。
#
# ★描画そのものはしない（Chromeもffmpegも要らない）。
#   検査は全て**純粋関数を数値で確かめる**作りにしてあるので、数秒で終わる。
name: check

on:
  push:
    branches: [main]
    paths:
      - "remotion/src/**"
      - "remotion/scripts/**"
      - "remotion/package.json"
      - "scripts/tts.py"
      - "scripts/make_narration.py"
      - "scripts/check_group_words.py"
      - "scripts/check_tts_prosody.py"
      - "scripts/speech_qa.py"
      - "scripts/check_speech_qa.py"
      - "scripts/expand_hooks.py"
      - "scripts/check_expand_hooks.py"
      - "scripts/shot_plan.py"
      - "scripts/check_shot_plan.py"
      - "scripts/check_pins.py"
      - "scripts/check_render_golden.py"
      - "scripts/render_video.py"
      - "scripts/speech_qa.py"
      - "tests/golden/**"
      - "constraints.txt"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "remotion/src/**"
      - "remotion/scripts/**"
      - "scripts/tts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: 依存を入れる
        run: npm ci

      - name: 型検査
        run: npx tsc --noEmit

      - name: 巨大テロップ（収まり・行割り・演出の決定性）
        run: node scripts/check-telop.mjs

      - name: 走る字幕（改行が語を割らないこと）
        run: node scripts/check-caption-wrap.mjs

      # ★2026-09-12 追加（決定#135）。機能紹介チップ。
      #   依頼側が書いた仕様の文字列をそのまま出すので、長い時に
      #   はみ出さず縮むことを数値で確かめる。
      - name: 機能紹介チップ（はみ出さないこと）
        run: node scripts/check-feature-chips.mjs

      # ★★2026-09-10 追加（決定#119）。字幕の「1枚のまとめ方」。
      #   日本語を空白で繋いでいた／文をまたいで刻んでいた、の2つを見張る。
      - name: 字幕のまとめ方（空白・文またぎ）
        working-directory: .
        run: python3 scripts/check_group_words.py

      # ★★2026-09-26 追加（決定#177）。喋った内容からの字幕と喋りの検査。
      #   入力は完成品から取った本物の文字起こし（E-033）。重い依存は要らない。
      - name: 喋りの字幕と検査（のです／言えていない語／カットまたぎ）
        working-directory: .
        run: python3 scripts/check_speech_qa.py

      - name: フック差し替えの展開
        working-directory: .
        run: python3 scripts/check_expand_hooks.py

      - name: 商品ごとのカット選び（決定#182）
        working-directory: .
        run: python3 scripts/check_shot_plan.py

      - name: pip の版固定（決定#188）
        working-directory: .
        run: python3 scripts/check_pins.py

      # ★★2026-09-10 追加（決定#127）。抑揚のため文ごとに合成して繋ぐ。
      #   繋ぎの計算を間違えると**字幕が全部ずれる**のに、動画は正常に
      #   出来上がるので見るまで気づかない（E-010と同じ壊れ方）。
      #   音を作らずに（＝ネットワーク無しで）繋ぎの計算だけを検査する。
      # ★★2026-09-26、ffmpeg を入れた。この検査は ffmpeg で無音を作って繋ぐが、
      #   ランナーに ffmpeg が無く「★NG ffmpeg/ffprobe が無い」で**9/12 から毎回落ちていた**
      #   （run #16〜#19）。ここで止まるので、後ろの検査も2週間走っていなかった。
      - name: ffmpeg（抑揚の検査で使う）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: ナレーションの抑揚（繋いだ後の時刻がずれないこと）
        working-directory: .
        run: python3 scripts/check_tts_prosody.py

      # ★★2026-09-27 追加（決定#190）。描画の回帰試験（黄金の出力との突き合わせ）。
      #   決まった合成素材を実際に描き、決まった時刻のコマを基準と SSIM で比べる。
      #   焼き込み文字の検査（RapidOCR）が走るので、その依存だけ入れる（版は constraints.txt）。
      - name: 描画の回帰試験の依存
        working-directory: .
        run: python3 -m pip install --quiet --disable-pip-version-check -c constraints.txt rapidocr_onnxruntime numpy pillow

      - name: 描画の回帰試験（コマ・尺・効果音・パネルが前と同じ）
        working-directory: .
        run: python3 scripts/check_render_golden.py
