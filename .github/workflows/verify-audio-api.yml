# 一時的な確認用。403の意味を対照実験で確定させる。
# 同じキーで 画像API / 動画API / 音源API を叩き分ける。
#   画像が200で音源が403 → キーは有効。音源APIだけ権限が無い
#   全部403             → キー自体かIPの問題
name: verify-audio-api

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 同じキーで3つのエンドポイントを叩き比べる
        env:
          PIXA_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${PIXA_KEY}" ]; then echo "❌ Secret 未設定"; exit 1; fi
          for ep in "api/" "api/videos/" "api/audio/"; do
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" \
              -G "https://pixabay.com/${ep}" \
              --data-urlencode "key=${PIXA_KEY}" \
              --data-urlencode "q=lofi" \
              --data-urlencode "per_page=3" || echo "000")
            echo "=== ${ep} → HTTP ${code}"
            # ★応答にキーが混ざり得るので、件数だけを取り出す
            python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/r.json'))
              print('   totalHits:', d.get('totalHits'), '/ hits:', len(d.get('hits') or []))
              h = (d.get('hits') or [{}])[0]
              if h:
                  print('   1件目のキー:', sorted(h.keys())[:14])
          except Exception:
              print('   （JSONではない応答）', open('/tmp/r.json').read()[:120])
          PY
          done
