# 一時。Pixabay動画APIのパラメータが実際に効くかを測る。終わったら削除。
name: verify-audio-api
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 縦型で絞れるか
        env:
          PIXA_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -uo pipefail
          [ -z "${PIXA_KEY}" ] && { echo "Secret未設定"; exit 1; }
          probe () {
            local label="$1"; shift
            local args=()
            for kv in "$@"; do args+=(--data-urlencode "$kv"); done
            code=$(curl -s -o /tmp/v.json -w "%{http_code}" \
              -G "https://pixabay.com/api/videos/" \
              --data-urlencode "key=${PIXA_KEY}" \
              --data-urlencode "per_page=3" "${args[@]}" || echo 000)
            echo "=== ${label} → HTTP ${code}"
            python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/v.json'))
              print('   totalHits:', d.get('totalHits'))
              for h in (d.get('hits') or [])[:3]:
                  vs = h.get('videos') or {}
                  large = vs.get('large') or vs.get('medium') or {}
                  print('   id=%s %sx%s %ss tags=%s lowQ=%s AI=%s' % (
                      h.get('id'), large.get('width'), large.get('height'),
                      h.get('duration'), str(h.get('tags'))[:40],
                      h.get('isLowQuality'), h.get('isAiGenerated')))
          except Exception as e:
              print('   （JSONでない）', open('/tmp/v.json').read()[:150])
          PY
          }
          probe "絞りなし"            "q=beach"
          probe "orientation=vertical" "q=beach" "orientation=vertical"
          probe "video_type=film"      "q=beach" "video_type=film"
          probe "存在しない値（対照）"  "q=beach" "orientation=NONSENSE_XYZ"
