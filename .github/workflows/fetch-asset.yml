# 外部の画像を取り寄せて**目で確かめる**ための口。
#
# 【なぜ要るか】
# 開発サンドボックスは画像サイトへ出られない（upload.wikimedia.org も
# images.pexels.com も CONNECT 403）。一方ランナーは外へ出られる。
# つまり「URLの中身を確かめてから使う」ができない状態だった。
#
# ★★実際にそれで失敗した（2026-09-10）。中身を見ずに
#   assets/en/clips/b-*.mp4 を背景に指定したら、AI生成の水着モデル映像で、
#   日本市場の掃除機の台本の裏にそれが流れる動画ができた。
#   **見ていない素材を使わない**を守るには、見る手段が要る。
#
# ここで取り寄せて Release に置けば、動画に入れる前に1枚ずつ確認できる。
#
# 使い方:
#   query に語を入れる  … Wikimedia Commons を検索して上位を取り寄せる
#   url に直接URLを入れる … その1枚だけ取り寄せる

name: fetch-asset

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Wikimedia Commons を検索する語（例: cordless vacuum cleaner）'
        required: false
        type: string
      url:
        description: '直接指定するURL（query より優先）'
        required: false
        type: string
      pexels:
        description: 'Pexelsの動画素材を探す語（使用シーンの実写。これを使う時 query/url は無視）'
        required: false
        type: string
      edge:
        description: '呼ぶEdge Functionの名前（gemini-models / product-scene）。これを使う時ほかは無視'
        required: false
        type: string
      edge_body:
        description: 'Edge Function へ渡すJSON（省略でGET）'
        required: false
        type: string
      limit:
        description: '取り寄せる枚数（検索時）'
        required: false
        default: '6'
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ★Edge Function を直接叩いて**返りを目で見る**ための口（2026-09-12）。
      #   サンドボックスは *.supabase.co へ出られないので、確認は必ずここを通る。
      #
      # ★名前は**決め打ちの一覧**からしか選べない。任意の関数を
      #   service-role で呼べる口を開けると、それ自体が穴になる。
      # ★返りに base64 の画像（data:image/... または b64 キー）が入っていれば
      #   ファイルに落とす。生成した絵を**使う前に見る**ため（決定#129と同じ理由）。
      - name: Edge Function を呼ぶ
        if: inputs.edge != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FN: ${{ inputs.edge }}
          BODY: ${{ inputs.edge_body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re as _re, urllib.request
          ALLOWED = ('gemini-models', 'pexels-search', 'product-scene')
          fn = (os.environ.get('FN') or '').strip()
          if fn not in ALLOWED:
              raise SystemExit('この口から呼べるのは %s だけです（来た値: %r）' % (ALLOWED, fn))
          def clean(v, allowed):
              return ''.join(c for c in (v or '') if _re.match(allowed, c))
          base = clean(os.environ.get('SUPABASE_URL'), r'[A-Za-z0-9:/._-]').rstrip('/')
          if not base.startswith('http'):
              base = 'https://%s' % base.lstrip('/')
          key = clean(os.environ.get('SUPABASE_SERVICE_ROLE_KEY'), r'[A-Za-z0-9._-]')
          body = (os.environ.get('BODY') or '').strip()
          hdr = {'Authorization': 'Bearer %s' % key, 'apikey': key,
                 'Content-Type': 'application/json'}
          req = urllib.request.Request('%s/functions/v1/%s' % (base, fn),
                                       data=body.encode() if body else None,
                                       headers=hdr,
                                       method='POST' if body else 'GET')
          os.makedirs('assets_out', exist_ok=True)
          try:
              with urllib.request.urlopen(req, timeout=180) as r:
                  raw = r.read()
                  code = r.status
          except urllib.error.HTTPError as e:
              raw, code = e.read(), e.code
          print('HTTP %s / %d バイト' % (code, len(raw)))
          open('assets_out/edge.json', 'wb').write(raw)
          try:
              d = json.loads(raw)
          except Exception:
              print(raw[:2000].decode('utf-8', 'replace'))
              raise SystemExit(0 if code == 200 else 1)

          n = [0]
          def dump(v):
              """base64の画像を見つけたらファイルへ落とす（見るため）"""
              if isinstance(v, dict):
                  for x in v.values():
                      dump(x)
              elif isinstance(v, list):
                  for x in v:
                      dump(x)
              elif isinstance(v, str) and len(v) > 2000:
                  s = v.split(',', 1)[-1] if v.startswith('data:') else v
                  try:
                      blob = base64.b64decode(s, validate=True)
                  except Exception:
                      return
                  if blob[:4] in (b'\x89PNG', b'\xff\xd8\xff\xe0', b'\xff\xd8\xff\xe1', b'RIFF'):
                      ext = '.png' if blob[:4] == b'\x89PNG' else '.jpg'
                      p = 'assets_out/gen%02d%s' % (n[0], ext)
                      open(p, 'wb').write(blob)
                      print('画像を保存: %s (%d バイト)' % (p, len(blob)))
                      n[0] += 1
          dump(d)
          # ★画像を落とした後に本文を出す。base64で流れて読めなくならないよう畳む
          def fold(v):
              if isinstance(v, dict):
                  return {k: fold(x) for k, x in v.items()}
              if isinstance(v, list):
                  return [fold(x) for x in v]
              if isinstance(v, str) and len(v) > 300:
                  return '<%d文字>' % len(v)
              return v
          print(json.dumps(fold(d), ensure_ascii=False, indent=1)[:6000])
          PY
          ls -lh assets_out/

      # ★★Pexels は Supabase の Edge Function 経由で引く（決定#131）。
      #   鍵は Supabase にしか無く、ここへ複製しない。呼ぶのに要る
      #   SUPABASE_URL / SERVICE_ROLE_KEY は既にこのリポジトリのSecretsにある。
      #   返るのは動画URLと静止画URLだけ（鍵は返らない）。
      - name: Pexelsの素材を探す
        if: inputs.pexels != '' && inputs.edge == ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PQ: ${{ inputs.pexels }}
          N: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          # ★★Secretsに貼る時、改行やゼロ幅スペースが紛れる。実際に紛れていた:
          #     '//xxx.supabase.co\n\u200b/functions/v1/...' で InvalidURL
          #   render-video.yml は同じ事故を踏んで tr -cd で対策済みだった。
          #   **禁止文字を数え上げるのではなく、使える文字だけ残す**（同じ手筋）。
          import re as _re
          def clean(v, allowed):
              return ''.join(c for c in (v or '') if _re.match(allowed, c))
          base = clean(os.environ.get('SUPABASE_URL'), r'[A-Za-z0-9:/._-]').rstrip('/')
          if not base.startswith('http'):
              base = 'https://%s' % base.lstrip('/')
          key = clean(os.environ.get('SUPABASE_SERVICE_ROLE_KEY'), r'[A-Za-z0-9._-]')
          print('URLの形: %s / 鍵の長さ %d文字' % (base, len(key)))
          q = (os.environ.get('PQ') or '').strip()
          n = int(os.environ.get('N') or 10)
          api = '%s/functions/v1/pexels-search?q=%s&n=%d' % (base, urllib.parse.quote(q), n)
          req = urllib.request.Request(api, headers={'Authorization': 'Bearer %s' % key,
                                                     'apikey': key})
          with urllib.request.urlopen(req, timeout=40) as r:
              d = json.load(r)
          print('Pexels: %r → %d件' % (q, d.get('count', 0)))
          os.makedirs('assets_out', exist_ok=True)
          # ★静止画を落として**目で見る**。動画URLはそのまま台本へ渡せる
          for i, v in enumerate(d.get('videos', [])):
              line = 'p%02d  id=%-9s %2ds %sx%s' % (i, v['id'], v['duration'], v['w'], v['h'])
              print(line)
              print('     video: %s' % v['url'])
              if v.get('preview'):
                  try:
                      rq = urllib.request.Request(v['preview'], headers={'User-Agent': 'jmas'})
                      with urllib.request.urlopen(rq, timeout=30) as rr:
                          open('assets_out/p%02d.jpg' % i, 'wb').write(rr.read())
                  except Exception as e:
                      print('     ★静止画を取れず: %s' % e)
          json.dump(d, open('assets_out/pexels.json', 'w'), ensure_ascii=False, indent=2)
          PY
          ls -lh assets_out/

      - name: 取り寄せる
        if: inputs.pexels == '' && inputs.edge == ''
        env:
          Q: ${{ inputs.query }}
          U: ${{ inputs.url }}
          N: ${{ inputs.limit }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          # ★URL・検索語はシェルへ展開しない（引用符や & でコマンドが壊れる）
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from PIL import Image

          UA = 'jmas-ai-os asset check (contact via repo)'
          out = []

          def get(url, dest):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
              open(dest, 'wb').write(data)
              return len(data)

          url = (os.environ.get('U') or '').strip()
          query = (os.environ.get('Q') or '').strip()
          try:
              n = max(1, min(12, int(os.environ.get('N') or 6)))
          except ValueError:
              n = 6

          targets = []
          if url:
              targets = [(url, 'direct')]
          elif query:
              # Wikimedia Commons の検索API。画像の実URLまで取れる
              api = ('https://commons.wikimedia.org/w/api.php?action=query'
                     '&generator=search&gsrnamespace=6&gsrlimit=%d&gsrsearch=%s'
                     '&prop=imageinfo&iiprop=url|size|extmetadata'
                     '&iiurlwidth=1200&format=json' % (n, urllib.parse.quote(query)))
              req = urllib.request.Request(api, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.load(r)
              # ★何も返らない回があるので、APIの答えをそのまま見せる。
              #   黙って0件で終わると原因が分からない（実際に1回そうなった）
              pages = (d.get('query', {}) or {}).get('pages') or {}
              print('検索: %r → %d件' % (query, len(pages)))
              if not pages:
                  print('APIの返り: %s' % json.dumps(d, ensure_ascii=False)[:600])
              for page in pages.values():
                  ii = (page.get('imageinfo') or [{}])[0]
                  src = ii.get('thumburl') or ii.get('url')
                  if not src:
                      continue
                  meta = ii.get('extmetadata') or {}
                  lic = (meta.get('LicenseShortName') or {}).get('value', '不明')
                  artist = re.sub('<[^>]+>', '', (meta.get('Artist') or {}).get('value', '') or '')[:60]
                  targets.append((src, '%s | %s | %s' % (page.get('title', ''), lic, artist)))
          else:
              raise SystemExit('query か url のどちらかを入れてください')

          os.makedirs('assets_out', exist_ok=True)
          for i, (src, note) in enumerate(targets):
              ext = os.path.splitext(urllib.parse.urlparse(src).path)[1].lower() or '.jpg'
              if ext not in ('.jpg', '.jpeg', '.png', '.webp'):
                  ext = '.jpg'
              dest = 'assets_out/cand%02d%s' % (i, ext)
              try:
                  size = get(src, dest)
                  im = Image.open(dest)
                  print('%-18s %5dx%-5d %7dB  %s' % (os.path.basename(dest),
                                                     im.width, im.height, size, note))
                  print('    %s' % src)
                  out.append({'file': os.path.basename(dest), 'url': src,
                              'w': im.width, 'h': im.height, 'note': note})
              except Exception as e:
                  print('★取得できず: %s (%s)' % (src, e))
          json.dump(out, open('assets_out/index.json', 'w'),
                    ensure_ascii=False, indent=2)
          PY
          ls -lh assets_out/

      - name: Release へ上げる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="asset-preview"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GH_REPO" || true
          gh release create "$TAG" assets_out/* --title "$TAG" \
            --notes "確認用に取り寄せた素材（決定#129）" --repo "$GH_REPO"
          echo "アップロード完了: $TAG"
