# 外部の画像を取り寄せて**目で確かめる**ための口。
#
# 【なぜ要るか】
# 開発サンドボックスは画像サイトへ出られない（upload.wikimedia.org も
# images.pexels.com も CONNECT 403）。一方ランナーは外へ出られる。
# つまり「URLの中身を確かめてから使う」ができない状態だった。
#
# ★★実際にそれで失敗した（2026-09-10）。中身を見ずに
#   assets/en/clips/b-*.mp4 を背景に指定したら、AI生成の水着モデル映像で、
#   日本市場の掃除機の台本の裏にそれが流れる動画ができた。
#   **見ていない素材を使わない**を守るには、見る手段が要る。
#   （★その b-*.mp4 は 2026-09-14 に削除した。どこからも使っておらず、
#     公開リポジトリに置く理由が無かった。この失敗の記録だけ残す）
#
# ここで取り寄せて Release に置けば、動画に入れる前に1枚ずつ確認できる。
#
# 使い方:
#   query に語を入れる  … Wikimedia Commons を検索して上位を取り寄せる
#   url に直接URLを入れる … その1枚だけ取り寄せる

name: fetch-asset

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Wikimedia Commons を検索する語（例: cordless vacuum cleaner）'
        required: false
        type: string
      url:
        description: '直接指定するURL（query より優先）'
        required: false
        type: string
      pexels:
        description: 'Pexelsの動画素材を探す語（使用シーンの実写。これを使う時 query/url は無視）'
        required: false
        type: string
      page:
        description: '公開Webページを読んで本文を持ち帰る（サンドボックスから出られないため）'
        required: false
        type: string
      # ★★2026-09-16 追加。長いページの「途中」を読むための口。
      #   Geminiの料金表は84,000文字あり、先頭を切って出すだけでは
      #   肝心の節へ届かなかった（実測）。語を指定して周辺だけ出す。
      page_grep:
        description: 'page の本文からこの語を探し、周辺だけを出す（長いページ用）'
        required: false
        type: string
      upload:
        description: 'リポジトリ内のファイルを Supabase の公開バケットへ上げてURLを出す（例 assets/shared/influencer/anna/front_main.jpg）'
        required: false
        type: string
      # ★★2026-09-15 追加。**リポジトリに置かずに**画像を公開バケットへ上げる口。
      #
      # 【なぜ要るか】
      # ASPの商品写真をオーナーから受け取っても、置き場所が無かった。
      # 楽天の商品ページは Akamai にデータセンターIPを弾かれて読めず
      # （実測: 43バイトの "Reference #..." しか返らない）、
      # 画像URLを機械で取る手段が無い。
      #
      # ★**このリポジトリは公開である。他社の商品写真をコミットしてはいけない。**
      #   git履歴に入ると消せず、公開と同時に再配布したことになる。
      #   だから「リポジトリを経由せず」に上げられる口を別に用意する。
      # ★上限は workflow_dispatch の入力（約65,535文字）。
      #   base64は元の約1.34倍なので、およそ48KBまでの画像が通る。
      image_b64:
        description: '画像そのものをbase64で渡して公開バケットへ上げる（リポジトリに残さない）'
        required: false
        type: string
      image_name:
        description: 'image_b64 で上げる時のファイル名（例 product/redial-850019.jpg）'
        required: false
        type: string
      verify_faces:
        description: 'asset-preview に置いてある gen*.jpg の顔が anna 本人かを機械で判定する'
        required: false
        type: boolean
        default: false
      edge:
        description: '呼ぶEdge Functionの名前（gemini-models / product-scene / video-scene）。これを使う時ほかは無視'
        required: false
        type: string
      edge_body:
        description: 'Edge Function へ渡すJSON（省略でGET）'
        required: false
        type: string
      # ★★2026-09-20 追加（決定#158）。**他社モデルを入力から外すための口。**
      #
      # 【なぜ要るか】
      # ASPの商品写真には、その店が撮影したモデルが写っていることがある。
      # それを生成の入力に渡すと、**その人の肖像を我々の生成物として使う**
      # ことになる。#068 の優良誤認とは別の、肖像権の問題である。
      #
      # ★★**「写っている人は無視しろ」という指示では防げない。**
      #   実際、プロンプトで商品を禁じたのに生成パーカーが出たばかりである。
      #   指示ではなく**入力から消す**。
      #
      # ★切ったら終わりにしない。**切った後に顔検出をやり直し、
      #   0件になったことを確かめてから**上げる。
      garment_from:
        description: '商品写真から人物を外した「衣類だけ」の画像を作る（元画像のURL）'
        required: false
        type: string
      garment_name:
        description: 'garment_from で作った画像の置き先（例 product/redial-850019-garment.jpg）'
        required: false
        type: string
      # ★★2026-09-20 追加（決定#159）。**顔を外すだけでは足りなかった。**
      #
      # garment_from は顔の下で切るので、胴体・腕・脚・髪がそのまま残る。
      # 実際にそうなった。「他社のモデルを使わない」に対して、
      # **顔を消しただけでは他社のモデルは消えていない。**
      #
      # → 衣類の部分だけを座標で切り出す。人が数値を見て決める。
      #   ★機械には「どこが衣類か」を確定的に判定できない。だから人が指定する。
      crop_from:
        description: '画像の一部を切り出して上げる（元画像のURL）'
        required: false
        type: string
      crop_box:
        description: 'crop_from の切り出し範囲。左,上,右,下 を0〜1の割合で（例 0.10,0.06,0.94,0.70）'
        required: false
        type: string
      crop_name:
        description: 'crop_from で作った画像の置き先（例 product/redial-850019-only.jpg）'
        required: false
        type: string
      limit:
        description: '取り寄せる枚数（検索時）'
        required: false
        default: '6'
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ★生成した画の顔が**本人かどうかを機械で判定する**（決定#147）。
      #
      # 【なぜ要るか】
      # 目で見て「同じ人に見える」は検証ではない。face_score.py は
      # マスター7方向との最大コサイン類似度で判定し、**0.42未満なら別人**と
      # する（校正済み。本人の最も不利な角度でも0.428出る）。
      # ★人の目視の前に、まず機械が落とす。C案フェーズ1の選別と同じ考え方。
      - name: 顔が本人かを判定する
        if: inputs.verify_faces
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ★face_score.py は画像を ffmpeg/ffprobe で読む（OpenCVを足さない設計）。
          #   この口には ffmpeg が入っていなかった（2026-09-12、実際に落ちた）。
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p faces
          gh release download asset-preview --repo "$GH_REPO" \
            --pattern 'gen*.jpg' --dir faces --clobber
          ls -1 faces/
          # ★onnxruntime は CPU 版だけ。GPUには依存しない（3本の線）
          python3 -m pip install --quiet --disable-pip-version-check \
            insightface onnxruntime
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import face_score
          refs = face_score.reference_set()
          print('マスター %d枚 / 閾値 %.2f' % (len(refs), face_score.PASS_THRESHOLD))
          ng = 0
          for f in sorted(os.listdir('faces')):
              p = os.path.join('faces', f)
              r = face_score.score(p, refs)
              if not r:
                  print('  %-12s 顔が見つからない' % f)
                  continue
              mark = 'OK  本人' if r['passed'] else '★NG 別人'
              print('  %-12s %.3f  %s' % (f, r['best'], mark))
              if not r['passed']:
                  ng += 1
          print('別人判定: %d件' % ng)

          # ★服が変わっていないか（決定#148）。顔だけ見て服を見逃した
          import outfit_score
          paths = [os.path.join('faces', f) for f in sorted(os.listdir('faces'))]
          o = outfit_score.compare(paths)
          print('')
          print('服の一致（胴体の色分布・1.0が完全一致）')
          for a, b, sim in o['pairs']:
              print('  %-12s %-12s %.3f' % (a, b, sim))
          for name, why in o['skipped']:
              print('  %-12s 判定できず（%s）' % (name, why))
          # ★顔の大きさも出す。閾値がどの条件で校正されたかを思い出すため
          for p in paths:
              b = outfit_score.band_info(p)
              if 'face_ratio' in b:
                  print('  %-12s 顔の高さ %.1f%%' % (os.path.basename(p), b['face_ratio'] * 100))
          if o['worst'] is not None:
              print('  最小 %.3f / 閾値 %.2f → %s'
                    % (o['worst'], outfit_score.PASS_THRESHOLD,
                       '服は揃っている' if o['passed'] else '★服が変わっている疑い'))
          PY

      # ★他社モデルを外した「衣類だけ」の画像を作る（決定#158）。
      #   顔検出で人物の位置を機械的に特定し、その下だけを残す。
      #   ★**切った後に顔検出をやり直して0件を確認するまで上げない。**
      - name: 商品写真から人物を外す
        if: inputs.garment_from != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SRC: ${{ inputs.garment_from }}
          DEST: ${{ inputs.garment_name }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --disable-pip-version-check \
            insightface onnxruntime pillow
          python3 - <<'PY'
          import os, re, subprocess, sys, urllib.request
          sys.path.insert(0, 'scripts')
          import numpy as np
          from PIL import Image
          import face_score

          src = (os.environ.get('SRC') or '').strip()
          dest = (os.environ.get('DEST') or '').strip().lstrip('/')
          if not src.startswith('https://'):
              raise SystemExit('garment_from は https:// のURLにしてください')
          if not dest or '..' in dest.split('/') or not re.fullmatch(r'[A-Za-z0-9/._-]{1,120}', dest):
              raise SystemExit('garment_name を入れてください（例 product/foo-garment.jpg）: %r' % dest[:120])

          urllib.request.urlretrieve(src, 'src.jpg')
          im = Image.open('src.jpg').convert('RGB')
          W, H = im.size
          print('元画像: %dx%d' % (W, H))

          def faces(path):
              dim = subprocess.run(
                  ['ffprobe', '-v', 'error', '-select_streams', 'v:0',
                   '-show_entries', 'stream=width,height', '-of', 'csv=p=0:s=x', path],
                  capture_output=True, text=True).stdout.strip().split('x')
              w, h = int(dim[0]), int(dim[1])
              raw = subprocess.run(
                  ['ffmpeg', '-v', 'error', '-i', path, '-pix_fmt', 'bgr24',
                   '-f', 'rawvideo', '-'], capture_output=True).stdout
              if len(raw) < w * h * 3:
                  return []
              img = np.frombuffer(raw, dtype=np.uint8).reshape(h, w, 3).copy()
              return face_score._analyzer().get(img)

          found = faces('src.jpg')
          print('元画像の顔: %d件' % len(found))
          for f in found:
              print('  bbox %s' % [int(v) for v in f.bbox])

          # ★★0件を成功にしない。
          #   「人が写っていない」のか「検出できなかった」のかを、
          #   0件という結果だけからは区別できない。**通さずに止める。**
          if not found:
              raise SystemExit(
                  '顔が1件も検出されませんでした。\n'
                  '  人物が写っていないのか、検出に失敗したのかを区別できません。\n'
                  '  元画像を人が見て、人物が写っていないなら upload/image_b64 で\n'
                  '  そのまま上げてください（この口は「人物を外す」ためのものです）。')

          # 一番下にある顔の下端より下を残す（頭を落とす）
          bottom = max(int(f.bbox[3]) for f in found)
          margin = int(H * 0.02)
          top = min(H - 1, bottom + margin)
          keep = H - top
          print('切り取り: 上から %dpx を捨て、下 %dpx を残す' % (top, keep))

          # ★小さくなりすぎたら止める。衣類が残っていない可能性が高い
          if keep < 256 or keep < H * 0.35:
              raise SystemExit(
                  '残る領域が小さすぎます（%dpx / 元 %dpx）。\n'
                  '  衣類が写っていない切り方になります。別の写真を使ってください。' % (keep, H))

          im.crop((0, top, W, H)).save('garment.jpg', quality=92)
          print('切り出し後: %dx%d / %d バイト'
                % (W, keep, os.path.getsize('garment.jpg')))

          # ★★切った後にやり直す。ここが要。
          after = faces('garment.jpg')
          print('切り出し後の顔: %d件' % len(after))
          if after:
              for f in after:
                  print('  残っている bbox %s' % [int(v) for v in f.bbox])
              raise SystemExit('顔が残っています。上げません。')

          # 上げる
          def clean(v, allowed):
              return ''.join(c for c in (v or '') if re.match(allowed, c))
          base = clean(os.environ.get('SUPABASE_URL'), r'[A-Za-z0-9:/._-]').rstrip('/')
          if not base.startswith('http'):
              base = 'https://%s' % base.lstrip('/')
          key = clean(os.environ.get('SUPABASE_SERVICE_ROLE_KEY'), r'[A-Za-z0-9._-]')
          data = open('garment.jpg', 'rb').read()
          req = urllib.request.Request(
              '%s/storage/v1/object/images/%s' % (base, dest), data=data, method='POST',
              headers={'Authorization': 'Bearer %s' % key, 'apikey': key,
                       'Content-Type': 'image/jpeg', 'x-upsert': 'true'})
          with urllib.request.urlopen(req, timeout=60) as r:
              print('アップロード %s' % r.status)
          print('公開URL: %s/storage/v1/object/public/images/%s' % (base, dest))
          print('')
          print('★顔は0件になっていますが、**衣類がちゃんと写っているか**は')
          print('  人が見て確かめてください。機械で見たのは「顔が無いこと」だけです。')
          PY
          # ★結果を目で確かめる。出し方は scripts/preview_b64.py に1本化した
          #   （同じ縮小・同じ指紋の付け方を2箇所に書かない）
          python3 scripts/preview_b64.py garment.jpg

      # ★★指定した範囲だけを切り出す（決定#159）。
      #   顔の下で切るだけでは胴体も腕も脚も残る。衣類だけを残すには
      #   座標で切るしかなく、**どこが衣類かは人が見て決める**。
      #   機械に判定させると、外した時に気づけない。
      - name: 画像の一部を切り出す
        if: inputs.crop_from != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SRC: ${{ inputs.crop_from }}
          BOX: ${{ inputs.crop_box }}
          DEST: ${{ inputs.crop_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          import os, re, urllib.request
          from PIL import Image

          src = (os.environ.get('SRC') or '').strip()
          dest = (os.environ.get('DEST') or '').strip().lstrip('/')
          box = (os.environ.get('BOX') or '').strip()
          if not src.startswith('https://'):
              raise SystemExit('crop_from は https:// のURLにしてください')
          if not dest or '..' in dest.split('/') or not re.fullmatch(r'[A-Za-z0-9/._-]{1,120}', dest):
              raise SystemExit('crop_name を入れてください: %r' % dest[:120])

          try:
              l, t, r, b = [float(x) for x in box.split(',')]
          except Exception:
              raise SystemExit('crop_box は 左,上,右,下 の4つを0〜1で: %r' % box[:80])
          # ★範囲を検査する。逆さや外れた値を黙って通すと、空の画像が出来る
          if not (0 <= l < r <= 1 and 0 <= t < b <= 1):
              raise SystemExit('crop_box の値が不正です（0〜1で 左<右 / 上<下）: %s' % box)

          urllib.request.urlretrieve(src, 'crop_src.jpg')
          im = Image.open('crop_src.jpg').convert('RGB')
          W, H = im.size
          px = (int(l * W), int(t * H), int(r * W), int(b * H))
          out = im.crop(px)
          print('元画像 %dx%d → 切り出し %dx%d  範囲%s' % (W, H, out.width, out.height, px))
          # ★小さすぎたら止める。商品が写っていない切り方になる
          if out.width < 200 or out.height < 200:
              raise SystemExit('切り出しが小さすぎます（%dx%d）' % (out.width, out.height))
          out.save('crop.jpg', quality=92)

          def clean(v, allowed):
              return ''.join(c for c in (v or '') if re.match(allowed, c))
          base = clean(os.environ.get('SUPABASE_URL'), r'[A-Za-z0-9:/._-]').rstrip('/')
          if not base.startswith('http'):
              base = 'https://%s' % base.lstrip('/')
          key = clean(os.environ.get('SUPABASE_SERVICE_ROLE_KEY'), r'[A-Za-z0-9._-]')
          req = urllib.request.Request(
              '%s/storage/v1/object/images/%s' % (base, dest),
              data=open('crop.jpg', 'rb').read(), method='POST',
              headers={'Authorization': 'Bearer %s' % key, 'apikey': key,
                       'Content-Type': 'image/jpeg', 'x-upsert': 'true'})
          with urllib.request.urlopen(req, timeout=60) as rr:
              print('アップロード %s' % rr.status)
          print('公開URL: %s/storage/v1/object/public/images/%s' % (base, dest))
          PY
          python3 scripts/preview_b64.py crop.jpg


      # ★リポジトリのファイルを Supabase の公開バケットへ上げる口（決定#147）。
      #
      # 【なぜ要るか】
      # Edge Function（product-scene）は画像を**URLで**受け取る。ところが
      # このリポジトリは private なので、GitHub上のパスからは取れない。
      # 素材を渡すには、どこか取りに行ける場所へ置く必要がある。
      #
      # ★上げてよいのは**リポジトリの中のファイルだけ**（`..` を弾く）。
      # ★公開バケットなのでURLを知っていれば誰でも読める。
      #   **人物・商品の素材のような、見られて困らない物だけ**を上げること。
      - name: Supabaseの公開バケットへ上げる
        if: (inputs.upload != '' || inputs.image_b64 != '') && !inputs.verify_faces
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          F: ${{ inputs.upload }}
          B64: ${{ inputs.image_b64 }}
          BNAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, mimetypes, os, re as _re, urllib.request
          b64 = (os.environ.get('B64') or '').strip()
          rel = (os.environ.get('F') or '').strip().lstrip('/')
          def clean(v, allowed):
              return ''.join(c for c in (v or '') if _re.match(allowed, c))
          base = clean(os.environ.get('SUPABASE_URL'), r'[A-Za-z0-9:/._-]').rstrip('/')
          if not base.startswith('http'):
              base = 'https://%s' % base.lstrip('/')
          key = clean(os.environ.get('SUPABASE_SERVICE_ROLE_KEY'), r'[A-Za-z0-9._-]')

          # ★バイト列の出所は2つあるが、**上げる処理は1つしか持たない**
          #   （同じ処理を2箇所に書くと必ずずれる）。
          if b64:
              # base64で直接渡された回。リポジトリには何も残らない
              name = (os.environ.get('BNAME') or '').strip().lstrip('/')
              if not name or '..' in name.split('/'):
                  raise SystemExit('image_name を入れてください（例 product/foo.jpg）: %r' % name[:120])
              if not _re.fullmatch(r'[A-Za-z0-9/._-]{1,120}', name):
                  raise SystemExit('image_name に使える文字は英数字と / . _ - だけです: %r' % name[:120])
              # ★★2026-09-15、実際に失敗して足した。
              #   転記の途中で改行や空白が混ざる／末尾の = が落ちることがある。
              #   **中身が壊れているのか、体裁だけの問題なのかを切り分ける。**
              #   体裁は直せるので直す。中身が壊れていれば下で必ず落ちる。
              b64 = _re.sub(r'\s+', '', b64)
              if len(b64) % 4:
                  b64 += '=' * (4 - len(b64) % 4)
              try:
                  data = base64.b64decode(b64, validate=True)
              except Exception as e:
                  raise SystemExit(
                      'base64を復号できません: %s / 長さ%d・末尾20文字=%r'
                      % (e, len(b64), b64[-20:]))
              # ★JPEG/PNG の先頭を見て、本当に画像かを確かめる。
              #   壊れたbase64でも復号だけは通ることがあり、
              #   そのまま上げると「成功したのに中身が壊れた画像」が残る。
              # ★★先頭だけでは足りない。**途中で切れた画像は先頭が無傷**なので
              #   「成功したのに中身が壊れた画像」がそのまま残る（実測して足した）。
              #   終端マーカーまで見て、切れていないことを確かめる。
              if data[:2] == b'\xff\xd8':
                  if data[-2:] != b'\xff\xd9':
                      raise SystemExit(
                          'JPEGの終端がありません（末尾=%r）。転記が途中で切れています'
                          % data[-8:])
              elif data[:8] == b'\x89PNG\r\n\x1a\n':
                  if data[-8:] != b'\x00\x00\x00\x00IEND\xae\x42\x60\x82'[-8:]:
                      raise SystemExit(
                          'PNGの終端(IEND)がありません（末尾=%r）。転記が途中で切れています'
                          % data[-8:])
              else:
                  raise SystemExit(
                      '画像に見えません（先頭=%r）。転記が途中で壊れていないか確認してください'
                      % data[:8])
              if not data:
                  raise SystemExit('復号したら空でした')
              dest = 'uploads/' + name
              ctype = mimetypes.guess_type(name)[0] or 'application/octet-stream'
          else:
              if not rel or '..' in rel.split('/'):
                  raise SystemExit('リポジトリの中のパスを入れてください: %r' % rel[:120])
              if not os.path.isfile(rel):
                  raise SystemExit('ファイルがありません: %s' % rel)
              dest = 'assets/' + rel.replace('assets/', '', 1)
              ctype = mimetypes.guess_type(rel)[0] or 'application/octet-stream'
              data = open(rel, 'rb').read()
          url = '%s/storage/v1/object/images/%s' % (base, dest)
          req = urllib.request.Request(
              url, data=data, method='POST',
              headers={'Authorization': 'Bearer %s' % key, 'apikey': key,
                       'Content-Type': ctype, 'x-upsert': 'true'})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print('アップロード %s (%d バイト)' % (r.status, len(data)))
          except urllib.error.HTTPError as e:
              raise SystemExit('上げられません（%s）: %s'
                               % (e.code, e.read()[:300].decode('utf-8', 'replace')))
          print('公開URL: %s/storage/v1/object/public/images/%s' % (base, dest))
          PY

      # ★公開ページを読んで持ち帰る口（2026-09-12）。
      #
      # 【なぜ要るか】
      # サンドボックスは外のサイトへ出られない（CONNECT 403）。オーナーから
      # 「このページ読める?」と参考URLをもらっても、こちらから見に行けない。
      # ランナーは出られるので、**本文だけ**持ち帰る。
      #
      # ★★**取ってよいのは、誰でも見られる普通のページの本文だけ。**
      #   SNSの動画・音声・画像をまとめて落とす用途に使わない。
      #   CLAUDE.md「各SNS・ASPの規約違反・BANリスクを一切含めない
      #   （スクレイピング等）」に触れる。読むのは1URL、1回だけ。
      - name: 公開ページを読む
        if: inputs.page != '' && inputs.upload == '' && !inputs.verify_faces
        env:
          U: ${{ inputs.page }}
          G: ${{ inputs.page_grep }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html as _h, os, re, urllib.request

          # ★★2026-09-13、**空白・改行で区切って複数URLを渡せるようにした。**
          #   Actionsの無料枠が実測で100%（1,999分/月）に達しているのに、
          #   1ページ読むたびに1分課金されるのは割に合わない。
          #   READMEを5本読むのに5回起動していた所を1回で済ませる。
          grep = (os.environ.get('G') or '').strip()
          urls = [u for u in re.split(r'\s+', (os.environ.get('U') or '').strip()) if u]
          if not urls:
              raise SystemExit('URLがありません')
          for u in urls:
              if not u.startswith(('http://', 'https://')):
                  raise SystemExit('http(s) のURLを入れてください: %r' % u[:120])

          # ★1本ずつの上限。全部で4万文字の枠を分け合う
          per = 40000 if len(urls) == 1 else max(4000, 38000 // len(urls))
          os.makedirs('assets_out', exist_ok=True)

          def read_one(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; jmas-ai-os page check)',
                  'Accept-Language': 'ja,en;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read(3 * 1024 * 1024)
                  return raw, r.headers.get('content-type', ''), r.geturl()

          for i, url in enumerate(urls, 1):
              print('\n' + '=' * 70)
              try:
                  raw, ctype, final = read_one(url)
              except Exception as e:
                  # ★1本で落ちても残りを読む。全部やり直すと1分また溶ける
                  print('[%d/%d] 取得失敗: %s\n  %s' % (i, len(urls), url, e))
                  continue
              print('[%d/%d] 取得: %s' % (i, len(urls), final))
              if final != url:
                  print('  リダイレクト先: %s' % final)
              print('  種類: %s / %d バイト' % (ctype, len(raw)))

              enc = 'utf-8'
              m = re.search(r'charset=([A-Za-z0-9_-]+)', ctype)
              if m:
                  enc = m.group(1)
              text = raw.decode(enc, 'replace')

              # ★本文だけにする。script/style を落としてタグを剥ぐ
              body = re.sub(r'(?is)<(script|style|noscript)[^>]*>.*?</\1>', ' ', text)
              body = re.sub(r'(?s)<[^>]+>', ' ', body)
              body = _h.unescape(body)
              body = re.sub(r'[ \t\r\f\v]+', ' ', body)
              body = re.sub(r'\n\s*\n+', '\n', body).strip()

              # ★複数の時はファイル名を分ける。1本の時は今までと同じ名前を保つ
              #   （page.txt を前提にしている手順を壊さないため）
              stem = 'page' if len(urls) == 1 else 'page%02d' % i
              open('assets_out/%s.html' % stem, 'w', encoding='utf-8').write(text)
              open('assets_out/%s.txt' % stem, 'w', encoding='utf-8').write(body)

              # ★og: と title は本文からタグを剥ぐと消えるので、先に抜いて出す。
              #   SNSのページは本文がJSで描かれるため、**中身はここにしか無い**
              for mm in re.finditer(
                      r'<meta[^>]+(?:property|name)=["\'](og:[^"\']+|description|title)["\'][^>]*>', text):
                  c = re.search(r'content=["\'](.*?)["\']', mm.group(0), re.S)
                  if c:
                      print('  %-22s %s' % (mm.group(1), _h.unescape(c.group(1))[:400]))
              t = re.search(r'<title[^>]*>(.*?)</title>', text, re.S)
              if t:
                  print('  %-22s %s' % ('title', _h.unescape(t.group(1)).strip()[:300]))

              # ★★3000文字で切っていたら仕様書が読めなかった（Pixabay 13,692文字で
              #   肝心の節が届かなかった）。privateのReleaseは未認証で落とせない（404）ので、
              #   **ログに出ないものは読めない**。
              print('  本文 %d 文字 → assets_out/%s.txt' % (len(body), stem))
              # ★★2026-09-16 追加。**長いページの「途中」が読めなかった。**
              #   Geminiの料金表は84,000文字あり、先頭38,000文字で切ると
              #   肝心のVeoの節へ届かない。privateのReleaseは未認証で
              #   落とせない（404）ので、**ログに出ないものは読めない**。
              #   → 語を指定したら、その周辺だけを出す。
              #   ★「先頭を出す」に落とさない。**探した語が無いなら無いと言う。**
              #     無言で先頭を出すと「載っていない」と誤読する。
              if grep:
                  low, hits, shown = body.lower(), 0, 0
                  i = 0
                  while shown < per:
                      j = low.find(grep.lower(), i)
                      if j < 0:
                          break
                      hits += 1
                      a, b = max(0, j - 400), min(len(body), j + 1200)
                      chunk = body[a:b]
                      print('---- %r の %d件目（%d文字目付近）----' % (grep, hits, j))
                      print(chunk)
                      shown += len(chunk)
                      i = b
                  if hits == 0:
                      print('★ %r はこのページの本文に **1件もありません**（本文 %d 文字を全部見た）'
                            % (grep, len(body)))
                  else:
                      print('---- %r は %d件（上限%d文字まで表示）----' % (grep, hits, per))
              elif len(body) <= per:
                  print('---- 全文 ----')
                  print(body)
              else:
                  print('---- 先頭%d文字（長すぎるので切った。全文はRelease）----' % per)
                  print(body[:per])
          PY
          ls -lh assets_out/

      # ★Edge Function を直接叩いて**返りを目で見る**ための口（2026-09-12）。
      #   サンドボックスは *.supabase.co へ出られないので、確認は必ずここを通る。
      #
      # ★名前は**決め打ちの一覧**からしか選べない。任意の関数を
      #   service-role で呼べる口を開けると、それ自体が穴になる。
      # ★返りに base64 の画像（data:image/... または b64 キー）が入っていれば
      #   ファイルに落とす。生成した絵を**使う前に見る**ため（決定#129と同じ理由）。
      - name: Edge Function を呼ぶ
        if: inputs.edge != '' && inputs.page == '' && inputs.upload == '' && !inputs.verify_faces
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FN: ${{ inputs.edge }}
          BODY: ${{ inputs.edge_body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re as _re, urllib.request
          ALLOWED = ('gemini-models', 'pexels-search', 'product-scene', 'process-job', 'video-scene')
          fn = (os.environ.get('FN') or '').strip()
          if fn not in ALLOWED:
              raise SystemExit('この口から呼べるのは %s だけです（来た値: %r）' % (ALLOWED, fn))
          def clean(v, allowed):
              return ''.join(c for c in (v or '') if _re.match(allowed, c))
          base = clean(os.environ.get('SUPABASE_URL'), r'[A-Za-z0-9:/._-]').rstrip('/')
          if not base.startswith('http'):
              base = 'https://%s' % base.lstrip('/')
          key = clean(os.environ.get('SUPABASE_SERVICE_ROLE_KEY'), r'[A-Za-z0-9._-]')
          body = (os.environ.get('BODY') or '').strip()
          hdr = {'Authorization': 'Bearer %s' % key, 'apikey': key,
                 'Content-Type': 'application/json'}
          # ★★process-job だけは**関数の中でもう一度**合鍵を見る（決定#076）。
          #   Authorization は入口（Supabaseのゲートウェイ）用で、関数の中は
          #   専用ヘッダ x-process-job-token を見る。合鍵はDBのRPCが持っている
          #   ので、ここで引いてヘッダへ入れる。**値はログへ出さない。**
          if fn == 'process-job':
              tq = urllib.request.Request(
                  '%s/rest/v1/rpc/process_job_token' % base,
                  data=b'{}',
                  headers={'Authorization': 'Bearer %s' % key, 'apikey': key,
                           'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(tq, timeout=30) as tr:
                      tok = tr.read().decode().strip().strip('"')
              except urllib.error.HTTPError as e:
                  raise SystemExit('合鍵を取得できません（%s）: %s'
                                   % (e.code, e.read()[:200].decode('utf-8', 'replace')))
              if not tok:
                  raise SystemExit('合鍵が空です。process_job_token を確認してください')
              print('合鍵を取得しました（%d文字）' % len(tok))
              hdr['x-process-job-token'] = tok
          req = urllib.request.Request('%s/functions/v1/%s' % (base, fn),
                                       data=body.encode() if body else None,
                                       headers=hdr,
                                       method='POST' if body else 'GET')
          os.makedirs('assets_out', exist_ok=True)
          try:
              with urllib.request.urlopen(req, timeout=180) as r:
                  raw = r.read()
                  code = r.status
          except urllib.error.HTTPError as e:
              raw, code = e.read(), e.code
          print('HTTP %s / %d バイト' % (code, len(raw)))
          open('assets_out/edge.json', 'wb').write(raw)
          try:
              d = json.loads(raw)
          except Exception:
              print(raw[:2000].decode('utf-8', 'replace'))
              raise SystemExit(0 if code == 200 else 1)

          n = [0]
          def dump(v):
              """base64の画像を見つけたらファイルへ落とす（見るため）"""
              if isinstance(v, dict):
                  for x in v.values():
                      dump(x)
              elif isinstance(v, list):
                  for x in v:
                      dump(x)
              elif isinstance(v, str) and len(v) > 2000:
                  s = v.split(',', 1)[-1] if v.startswith('data:') else v
                  try:
                      blob = base64.b64decode(s, validate=True)
                  except Exception:
                      return
                  if blob[:4] in (b'\x89PNG', b'\xff\xd8\xff\xe0', b'\xff\xd8\xff\xe1', b'RIFF'):
                      ext = '.png' if blob[:4] == b'\x89PNG' else '.jpg'
                      p = 'assets_out/gen%02d%s' % (n[0], ext)
                      open(p, 'wb').write(blob)
                      print('画像を保存: %s (%d バイト)' % (p, len(blob)))
                      n[0] += 1
          dump(d)
          # ★画像を落とした後に本文を出す。base64で流れて読めなくならないよう畳む
          # ★★2026-09-19、**エラー本文まで畳んでいて読めなかった。**
          #   Edge Function が返した 400 の理由が `<531文字>` になり、
          #   **何が悪いのか分からないまま止まった。**
          #   畳みたいのは base64（読んでも意味が無く、ログを流す）だけである。
          #   → 中身を見て、**base64らしい時だけ**畳む。散文は畳まない。
          def _looks_b64(t):
              if len(t) < 300:
                  return False
              head = t[:200].replace('\n', '')
              # data URI か、英数字+/= だけで出来ている長い塊
              return t.startswith('data:') or _re.fullmatch(r'[A-Za-z0-9+/=]{200}', head) is not None

          def fold(v):
              if isinstance(v, dict):
                  return {k: fold(x) for k, x in v.items()}
              if isinstance(v, list):
                  return [fold(x) for x in v]
              if isinstance(v, str) and _looks_b64(v):
                  return '<%d文字のbase64>' % len(v)
              # ★散文は畳まないが、青天井にもしない（ログが流れる）
              if isinstance(v, str) and len(v) > 4000:
                  return v[:4000] + ('…<全%d文字>' % len(v))
              return v
          # ★★2026-09-19、**6,000文字では足りなかった。** gemini-models の
          #   ListModels は約6.1KBで、**末尾（veo の行）がちょうど切れていた。**
          #   private の Release は未認証で落とせないので「ログに出ないものは読めない」。
          #   → 上限を上げ、それでも超える回は**末尾も必ず出す**。
          #     先頭だけ出して「載っていない」と誤読するのが一番まずい（page_grep と同じ理由）。
          _t = json.dumps(fold(d), ensure_ascii=False, indent=1)
          _LIM = 30000
          if len(_t) <= _LIM:
              print(_t)
          else:
              print(_t[: _LIM // 2])
              print('\n---- 中略（全 %d 文字。ここから末尾）----\n' % len(_t))
              print(_t[-(_LIM // 2):])
          PY
          ls -lh assets_out/

      # ★★Pexels は Supabase の Edge Function 経由で引く（決定#131）。
      #   鍵は Supabase にしか無く、ここへ複製しない。呼ぶのに要る
      #   SUPABASE_URL / SERVICE_ROLE_KEY は既にこのリポジトリのSecretsにある。
      #   返るのは動画URLと静止画URLだけ（鍵は返らない）。
      - name: Pexelsの素材を探す
        if: inputs.pexels != '' && inputs.edge == '' && inputs.page == '' && inputs.upload == '' && !inputs.verify_faces
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PQ: ${{ inputs.pexels }}
          N: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          # ★★Secretsに貼る時、改行やゼロ幅スペースが紛れる。実際に紛れていた:
          #     '//xxx.supabase.co\n\u200b/functions/v1/...' で InvalidURL
          #   render-video.yml は同じ事故を踏んで tr -cd で対策済みだった。
          #   **禁止文字を数え上げるのではなく、使える文字だけ残す**（同じ手筋）。
          import re as _re
          def clean(v, allowed):
              return ''.join(c for c in (v or '') if _re.match(allowed, c))
          base = clean(os.environ.get('SUPABASE_URL'), r'[A-Za-z0-9:/._-]').rstrip('/')
          if not base.startswith('http'):
              base = 'https://%s' % base.lstrip('/')
          key = clean(os.environ.get('SUPABASE_SERVICE_ROLE_KEY'), r'[A-Za-z0-9._-]')
          print('URLの形: %s / 鍵の長さ %d文字' % (base, len(key)))
          q = (os.environ.get('PQ') or '').strip()
          n = int(os.environ.get('N') or 10)
          api = '%s/functions/v1/pexels-search?q=%s&n=%d' % (base, urllib.parse.quote(q), n)
          req = urllib.request.Request(api, headers={'Authorization': 'Bearer %s' % key,
                                                     'apikey': key})
          with urllib.request.urlopen(req, timeout=40) as r:
              d = json.load(r)
          print('Pexels: %r → %d件' % (q, d.get('count', 0)))
          os.makedirs('assets_out', exist_ok=True)
          # ★静止画を落として**目で見る**。動画URLはそのまま台本へ渡せる
          for i, v in enumerate(d.get('videos', [])):
              line = 'p%02d  id=%-9s %2ds %sx%s' % (i, v['id'], v['duration'], v['w'], v['h'])
              print(line)
              print('     video: %s' % v['url'])
              if v.get('preview'):
                  try:
                      rq = urllib.request.Request(v['preview'], headers={'User-Agent': 'jmas'})
                      with urllib.request.urlopen(rq, timeout=30) as rr:
                          open('assets_out/p%02d.jpg' % i, 'wb').write(rr.read())
                  except Exception as e:
                      print('     ★静止画を取れず: %s' % e)
          json.dump(d, open('assets_out/pexels.json', 'w'), ensure_ascii=False, indent=2)
          PY
          ls -lh assets_out/

      - name: 取り寄せる
        if: inputs.pexels == '' && inputs.edge == '' && inputs.page == '' && inputs.upload == '' && inputs.garment_from == '' && inputs.crop_from == '' && !inputs.verify_faces
        env:
          Q: ${{ inputs.query }}
          U: ${{ inputs.url }}
          N: ${{ inputs.limit }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          # ★URL・検索語はシェルへ展開しない（引用符や & でコマンドが壊れる）
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from PIL import Image

          UA = 'jmas-ai-os asset check (contact via repo)'
          out = []

          def get(url, dest):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
              open(dest, 'wb').write(data)
              return len(data)

          url = (os.environ.get('U') or '').strip()
          query = (os.environ.get('Q') or '').strip()
          try:
              n = max(1, min(12, int(os.environ.get('N') or 6)))
          except ValueError:
              n = 6

          targets = []
          if url:
              targets = [(url, 'direct')]
          elif query:
              # Wikimedia Commons の検索API。画像の実URLまで取れる
              api = ('https://commons.wikimedia.org/w/api.php?action=query'
                     '&generator=search&gsrnamespace=6&gsrlimit=%d&gsrsearch=%s'
                     '&prop=imageinfo&iiprop=url|size|extmetadata'
                     '&iiurlwidth=1200&format=json' % (n, urllib.parse.quote(query)))
              req = urllib.request.Request(api, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.load(r)
              # ★何も返らない回があるので、APIの答えをそのまま見せる。
              #   黙って0件で終わると原因が分からない（実際に1回そうなった）
              pages = (d.get('query', {}) or {}).get('pages') or {}
              print('検索: %r → %d件' % (query, len(pages)))
              if not pages:
                  print('APIの返り: %s' % json.dumps(d, ensure_ascii=False)[:600])
              for page in pages.values():
                  ii = (page.get('imageinfo') or [{}])[0]
                  src = ii.get('thumburl') or ii.get('url')
                  if not src:
                      continue
                  meta = ii.get('extmetadata') or {}
                  lic = (meta.get('LicenseShortName') or {}).get('value', '不明')
                  artist = re.sub('<[^>]+>', '', (meta.get('Artist') or {}).get('value', '') or '')[:60]
                  targets.append((src, '%s | %s | %s' % (page.get('title', ''), lic, artist)))
          else:
              raise SystemExit('query か url のどちらかを入れてください')

          os.makedirs('assets_out', exist_ok=True)
          for i, (src, note) in enumerate(targets):
              ext = os.path.splitext(urllib.parse.urlparse(src).path)[1].lower() or '.jpg'
              if ext not in ('.jpg', '.jpeg', '.png', '.webp'):
                  ext = '.jpg'
              dest = 'assets_out/cand%02d%s' % (i, ext)
              try:
                  size = get(src, dest)
                  im = Image.open(dest)
                  print('%-18s %5dx%-5d %7dB  %s' % (os.path.basename(dest),
                                                     im.width, im.height, size, note))
                  print('    %s' % src)
                  out.append({'file': os.path.basename(dest), 'url': src,
                              'w': im.width, 'h': im.height, 'note': note})
              except Exception as e:
                  print('★取得できず: %s (%s)' % (src, e))
          json.dump(out, open('assets_out/index.json', 'w'),
                    ensure_ascii=False, indent=2)
          PY
          ls -lh assets_out/

      # ★上げる物が無い回（upload だけの回）は飛ばす。
      #   「no matches found for assets_out/*」で**成功した処理まで失敗扱い**に
      #   なっていた（2026-09-12）。工程の失敗と成果物の有無は別である。
      # ★★取り寄せた素材を**使う前に見る**ための口（2026-09-20）。
      #
      # 【なぜ要るか】
      # サンドボックスは画像サイトへ出られず、private リポジトリの
      # Release 資産も認証なしでは取れない。つまり取り寄せた素材を
      # 実装者が一度も見ないまま動画へ入れることになっていた。
      # **見ていない素材を使って実際に失敗している**（assets/NOTES.md の
      # b-*.mp4 の件）。見る手段が無いなら、見る手段を作る方が先である。
      #
      # ★Pexels でも 取り寄せる でも、assets_out に落ちた画像を全部並べる。
      #   ★このステップは Pexels / 取り寄せる より**後**に置くこと。
      #     前に置くと assets_out がまだ空で、黙って何も出ない。
      - name: 取り寄せた画像を並べて見せる
        if: hashFiles('assets_out/**') != ''
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          shopt -s nullglob
          imgs=(assets_out/*.jpg assets_out/*.jpeg assets_out/*.png assets_out/*.webp)
          if [ ${#imgs[@]} -eq 0 ]; then
            echo "assets_out に画像がありません（動画だけの回）。並べる物がありません"
            exit 0
          fi
          python3 scripts/preview_b64.py "${imgs[@]}" --max 160 --cols 4
          # ★ログのbase64は枚数が増えると転記で壊れる（8枚=14,852文字は無理だった）。
          #   壊れない経路として preview ブランチにも置く。
          bash scripts/push_preview.sh preview.jpg "pexels/fetch $(date -u +%H:%MZ)"

      - name: Release へ上げる
        if: hashFiles('assets_out/**') != '' && !inputs.verify_faces
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="asset-preview"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GH_REPO" || true
          gh release create "$TAG" assets_out/* --title "$TAG" \
            --notes "確認用に取り寄せた素材（決定#129）" --repo "$GH_REPO"
          echo "アップロード完了: $TAG"
